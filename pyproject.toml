[tool.black]
# un.py is our vendored Unsandbox SDK (refreshed with curl, see CLAUDE.md)
# & migrations/ are generated by Alembic; tools/ vendors the shared crawler
# (crawler.unturf.com, `make ship-delta` there) & uncloseai-cli's keyless
# search, each with its suite: keep all of them byte-for-byte upstream.
extend-exclude = '''
^/(un\.py|migrations/|tools/crawler/|tools/keyless_search\.py|tools/mcp_wire\.py|tests/unit/crawler/test_|tests/unit/test_keyless_search\.py)
'''
