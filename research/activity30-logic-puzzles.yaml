title: "Logic Puzzles"
description: "Deduction, contrapositives, syllogisms, knights & knaves, & spotting fallacies, one puzzle at a time."
kind: "lesson"
default_max_attempts_per_step: 3
tokens_for_ai_rubric: |
  You are coaching a learner through logic puzzles.
  Judge the reasoning, not the wording: any phrasing of a valid deduction counts.
  Be encouraging; when they struggle, give the next step, never the whole answer.
sections:
- section_id: introduction
  title: Welcome to Logic Puzzles
  steps:
  - step_id: welcome
    title: Welcome to Logic Puzzles
    content_blocks:
    - '# Welcome to Critical Thinking & Logic Puzzles! 🧩'
    - In this activity, you'll develop your logical reasoning skills through a series of puzzles.
    - '**What you''ll learn:**'
    - '- How to analyze logical statements'
    - '- Deductive reasoning techniques'
    - '- Proof by contradiction'
    - '- How to spot common logical fallacies'
    - ''
    - Let's begin your journey into the world of logic!
    question: Are you ready to sharpen your logical thinking skills?
    tokens_for_ai: Accept any positive, affirming response as ready.
    bucket_criteria:
      ready: "Says yes or otherwise agrees to start."
      set_language: "Asks to use another language."
      off_topic: "Anything else."
    buckets:
    - ready
    - set_language
    - off_topic
    transitions:
      ready:
        content_blocks:
        - Excellent! Let's start with the fundamentals of logical reasoning.
        metadata_add:
          score: n+0
          puzzles_solved: n+0
        next_section_and_step: section_1:step_1
      set_language:
        content_blocks:
        - I'll communicate with you in your preferred language.
        metadata_add:
          language: the-users-response
        counts_as_attempt: false
        next_section_and_step: introduction:welcome
      off_topic:
        content_blocks:
        - Let's focus on beginning our logic journey. Are you ready to start?
        counts_as_attempt: false
        next_section_and_step: introduction:welcome
- section_id: section_1
  title: Basic Logical Statements
  steps:
  - step_id: step_1
    title: Understanding Logical Statements
    content_blocks:
    - '## Understanding Logical Statements'
    - Logic is about drawing valid conclusions from given information.
    - ''
    - '**Basic principle:** If A is true, and ''A implies B'' is true, then B must be true.'
    - ''
    - '**Example:**'
    - '- Statement 1: All cats are mammals.'
    - '- Statement 2: Whiskers is a cat.'
    - '- Conclusion: Therefore, Whiskers is a mammal.'
    - ''
    - 'This is called **deductive reasoning**: going from general rules to specific cases.'
    question: Based on this reasoning, if 'All birds have feathers' and 'A robin is a bird', what can we conclude?
    tokens_for_ai: The conclusion is that a robin has feathers.
    bucket_criteria:
      correct: "Concludes that a robin has feathers."
      partial_understanding: "Mentions birds or feathers but stops short of the conclusion about the robin."
      limited_effort: "A word or two that commits to nothing."
      off_topic: "Unrelated to the puzzle."
    required_elements:
    - "concludes the robin has feathers"
    feedback_tokens_for_ai: |
      If they missed it: since ALL birds have feathers, and a robin IS a bird, the robin must have feathers.
    buckets:
    - correct
    - partial_understanding
    - limited_effort
    - off_topic
    transitions:
      correct:
        ai_feedback:
          tokens_for_ai: Praise their correct deductive reasoning and encourage them to continue.
        metadata_add:
          score: n+1
          puzzles_solved: n+1
        next_section_and_step: section_1:step_2
      partial_understanding:
        ai_feedback:
          tokens_for_ai: Acknowledge what they got right, then complete the deduction for them.
        next_section_and_step: section_1:step_2
      limited_effort:
        ai_feedback:
          tokens_for_ai: Encourage them to think about what the two statements give together, and try again.
        next_section_and_step: section_1:step_1
      off_topic:
        content_blocks:
        - Let's stay focused on the logic puzzle. Think about what we can deduce from the two statements.
        next_section_and_step: section_1:step_1
  - step_id: step_2
    title: The Contrapositive
    content_blocks:
    - '## The Contrapositive'
    - Great! Now let's learn about the **contrapositive**, a powerful logical tool.
    - ''
    - 'If we know: ''If A, then B'' is true'
    - 'Then we also know: ''If NOT B, then NOT A'' is true'
    - ''
    - '**Example:**'
    - '- Original: ''If it''s raining, then the ground is wet'''
    - '- Contrapositive: ''If the ground is NOT wet, then it''s NOT raining'''
    - ''
    - "Both statements are logically equivalent! (Careful: the **converse**, 'if the ground is wet, it's raining', is NOT.)"
    - ''
    - '**Practice:** We know: ''If you study hard, you will pass the test.'''
    question: What is the contrapositive of this statement?
    tokens_for_ai: |
      The contrapositive: "If you don't pass the test, then you didn't study hard" (any equivalent phrasing).
    bucket_criteria:
      correct: "Negates both parts AND swaps them: not passing implies not studying hard."
      partial_understanding: "Negates or swaps, but not both, or gets the idea with a slip in wording."
      logical_error: "Gives the converse (pass → studied) or the inverse (didn't study → won't pass)."
      limited_effort: "Too brief to be a statement."
      off_topic: "Unrelated."
    required_elements:
    - "the condition is not passing the test"
    - "the conclusion is not having studied hard"
    feedback_tokens_for_ai: |
      The contrapositive negates both parts AND reverses them. The converse (if B then A) and the
      inverse (if not A then not B) are NOT equivalent to the original.
    buckets:
    - correct
    - partial_understanding
    - logical_error
    - limited_effort
    - off_topic
    transitions:
      correct:
        ai_feedback:
          tokens_for_ai: Praise them and say in one sentence why a contrapositive is useful in reasoning.
        metadata_add:
          score: n+1
          puzzles_solved: n+1
        next_section_and_step: section_2:step_1
      partial_understanding:
        ai_feedback:
          tokens_for_ai: Name what they got right, then state the full contrapositive.
        metadata_add:
          score: n+1
        next_section_and_step: section_2:step_1
      logical_error:
        ai_feedback:
          tokens_for_ai: Say whether they wrote the converse or the inverse, why it is not equivalent, and ask again.
        next_section_and_step: section_1:step_2
      limited_effort:
        content_blocks:
        - 'Take your time. Remember: negate both parts AND reverse the order.'
        next_section_and_step: section_1:step_2
      off_topic:
        content_blocks:
        - Let's focus on constructing the contrapositive statement.
        next_section_and_step: section_1:step_2
- section_id: section_2
  title: Syllogisms and Deduction
  steps:
  - step_id: step_1
    title: Classic Syllogism Puzzle
    content_blocks:
    - '## Classic Syllogism Puzzle'
    - A **syllogism** is a form of logical argument with premises and a conclusion.
    - ''
    - '**Here''s your puzzle:**'
    - ''
    - '**Premise 1:** All philosophers love wisdom.'
    - '**Premise 2:** Socrates is a philosopher.'
    - '**Premise 3:** No one who loves wisdom is foolish.'
    question: What must be true about Socrates based on these premises?
    tokens_for_ai: |
      Chain: Socrates is a philosopher → he loves wisdom → he is not foolish.
    bucket_criteria:
      correct: "Concludes Socrates is not foolish (stating he loves wisdom along the way is fine)."
      partial_understanding: "Concludes only that Socrates loves wisdom, without using premise 3."
      limited_effort: "Too brief or unclear."
      off_topic: "Unrelated, or adds facts the premises don't give."
    required_elements:
    - "uses all three premises"
    - "concludes Socrates is not foolish"
    buckets:
    - correct
    - partial_understanding
    - limited_effort
    - off_topic
    transitions:
      correct:
        ai_feedback:
          tokens_for_ai: Praise how they followed the chain through all three premises.
        metadata_add:
          score: n+1
          puzzles_solved: n+1
        next_section_and_step: section_2:step_2
      partial_understanding:
        ai_feedback:
          tokens_for_ai: Confirm what they found, then ask what premise 3 adds. Don't give the conclusion.
        next_section_and_step: section_2:step_1
      limited_effort:
        content_blocks:
        - Try working through each premise step by step. What do we know about philosophers? What do we know about Socrates?
        next_section_and_step: section_2:step_1
      off_topic:
        content_blocks:
        - Focus only on what the premises tell us. What can we deduce step by step?
        next_section_and_step: section_2:step_1
  - step_id: step_2
    title: Logical Consistency
    content_blocks:
    - '## Logical Consistency'
    - Sometimes we need to check whether statements can all hold together.
    - ''
    - 'Each of these three friends either always tells the truth or always lies:'
    - ''
    - '**Alice:** ''If Bob is telling the truth, then Carol is lying.'''
    - '**Bob:** ''I am telling the truth.'''
    - '**Carol:** ''Alice is telling the truth.'''
    - ''
    - Let's assume Bob IS telling the truth (as he claims).
    question: If Bob is telling the truth, is there a logical contradiction? If so, where?
    tokens_for_ai: |
      With Bob truthful, Alice's statement reduces to "Carol is lying".
      If Alice tells the truth, Carol lies; but then Carol's "Alice is telling the truth" would be true. Contradiction.
      If Alice lies, Carol tells the truth; but then Carol's "Alice is telling the truth" would be false. Contradiction.
      So yes: Alice and Carol cannot be assigned consistently; Bob cannot be truthful here.
    bucket_criteria:
      correct: "Says yes, a contradiction, and locates it between Alice's and Carol's statements (each case fails)."
      partial_understanding: "Says there is a contradiction without showing where, or checks only one case for Alice."
      confused: "Concludes there is no contradiction, or reasons in circles."
      limited_effort: "Yes/no with nothing else."
      asking_clarifying_questions: "Asks for help or what the question means."
      off_topic: "Unrelated."
    required_elements:
    - "says there is a contradiction"
    - "locates it in Alice and Carol's statements pointing at each other"
    hints:
    - attempt: 2
      text: "💡 With Bob truthful, Alice is really saying just 'Carol is lying'. Carol says 'Alice is truthful'. Can both fit?"
    - attempt: 3
      text: "💡 Try Alice truthful: then Carol lies, so Alice is NOT truthful. Now try Alice lying."
    buckets:
    - correct
    - partial_understanding
    - confused
    - limited_effort
    - asking_clarifying_questions
    - off_topic
    transitions:
      correct:
        ai_feedback:
          tokens_for_ai: Praise them and lay out both cases for Alice in two short lines.
        metadata_add:
          score: n+2
          puzzles_solved: n+1
        next_section_and_step: section_3:step_1
      partial_understanding:
        ai_feedback:
          tokens_for_ai: Name the part missing from their answer without giving it, and ask again.
        metadata_add:
          hints_used: n+1
        next_section_and_step: section_2:step_2
      confused:
        content_blocks:
        - 'Let''s break it down:'
        - 1. Assume Bob tells the truth
        - 2. What does Alice's statement then say about Carol?
        - 3. What does Carol's statement say about Alice?
        - 4. Try Alice truthful, then Alice lying. Does either work?
        metadata_add:
          hints_used: n+1
        next_section_and_step: section_2:step_2
      limited_effort:
        content_blocks:
        - Take your time and work through each person's statement carefully.
        next_section_and_step: section_2:step_2
      asking_clarifying_questions:
        ai_feedback:
          tokens_for_ai: Answer their question and give one hint, never the answer.
        counts_as_attempt: false
        next_section_and_step: section_2:step_2
      off_topic:
        content_blocks:
        - Let's focus on whether the three statements can all hold together.
        next_section_and_step: section_2:step_2
- section_id: section_3
  title: Knights and Knaves
  steps:
  - step_id: step_1
    title: The Island of Knights and Knaves
    content_blocks:
    - '## The Island of Knights and Knaves'
    - This is a classic logic puzzle type!
    - ''
    - '**The Rules:**'
    - '- Knights ALWAYS tell the truth'
    - '- Knaves ALWAYS lie'
    - '- Everyone is either a knight or a knave'
    - ''
    - '**The Puzzle:**'
    - You meet two people, A and B.
    - ''
    - '**Person A says:** ''At least one of us is a knave.'''
    question: Is A a knight or a knave? Is B a knight or a knave? Explain your reasoning.
    tokens_for_ai: |
      If A were a knave, "at least one of us is a knave" would be true: a knave can't say something true.
      So A is a knight, the statement is true, and B is the knave.
    bucket_criteria:
      correct: "A is a knight and B is a knave, with a reason (e.g. A can't be a knave without telling the truth)."
      partial_understanding: "Both right with no reason, or only one of the two right."
      logical_error: "Wrong assignment from a reasoning slip."
      limited_effort: "Too brief or gives up."
      asking_clarifying_questions: "Asks for help."
      off_topic: "Unrelated."
    required_elements:
    - "A is a knight"
    - "B is a knave"
    - "a reason, such as a knave A would be telling the truth"
    hints:
    - attempt: 2
      text: "💡 Suppose A is a knave. Would A's statement then be true or false?"
    - attempt: 3
      text: "💡 A knave saying 'at least one of us is a knave' would be telling the truth. So what must A be?"
    buckets:
    - correct
    - partial_understanding
    - logical_error
    - limited_effort
    - asking_clarifying_questions
    - off_topic
    transitions:
      correct:
        ai_feedback:
          tokens_for_ai: Praise their proof by contradiction.
        metadata_add:
          score: n+3
          puzzles_solved: n+1
        next_section_and_step: section_3:step_2
      partial_understanding:
        ai_feedback:
          tokens_for_ai: Name what is missing (a person or the reason) and suggest assuming A is a knave.
        metadata_add:
          hints_used: n+1
        next_section_and_step: section_3:step_1
      logical_error:
        ai_feedback:
          tokens_for_ai: 'Point at the slip and suggest testing both possibilities: A a knight, then A a knave.'
        metadata_add:
          hints_used: n+1
        next_section_and_step: section_3:step_1
      limited_effort:
        content_blocks:
        - 'This is challenging! Try starting with: ''Assume A is a knave. Then what must be true?'''
        metadata_add:
          hints_used: n+1
        next_section_and_step: section_3:step_1
      asking_clarifying_questions:
        ai_feedback:
          tokens_for_ai: Answer their question and give one hint about testing both possibilities.
        counts_as_attempt: false
        next_section_and_step: section_3:step_1
      off_topic:
        content_blocks:
        - 'Let''s work through the knight and knave puzzle. Remember: knights always tell the truth, knaves always lie.'
        next_section_and_step: section_3:step_1
  - step_id: step_2
    title: Advanced Knights and Knaves
    content_blocks:
    - '## Advanced Knights and Knaves'
    - Ready for a harder one? Let's add a third person!
    - ''
    - 'You meet three people: X, Y, and Z.'
    - ''
    - '**X says:** ''All of us are knaves.'''
    - '**Y says:** ''Exactly one of us is a knight.'''
    question: Identify whether X, Y, and Z are knights or knaves. Explain your reasoning.
    tokens_for_ai: |
      X can't be a knight (a knight can't say "all of us are knaves"), so X is a knave and at least one of them is a knight.
      If Y were a knave, the knights would number 0 or 1 (only Z could be one); not 0 (X lied), and not 1 (Y lied). Contradiction.
      So Y is a knight, exactly one knight is true, and Z is a knave.
      Answer: X knave, Y knight, Z knave.
    bucket_criteria:
      correct: "X knave, Y knight, Z knave, with reasoning for each."
      partial_understanding: "Some right, or all right with reasoning missing for one."
      confused: "Contradictions or errors in their own reasoning."
      limited_effort: "Very brief or gives up."
      asking_clarifying_questions: "Asks for help."
      off_topic: "Unrelated."
    required_elements:
    - "X is a knave, since a knight could not say it"
    - "Y is a knight"
    - "Z is a knave"
    hints:
    - attempt: 2
      text: "💡 Start with X: can a knight truthfully say 'all of us are knaves'?"
    - attempt: 3
      text: "💡 X is a knave, so at least one of them is a knight. Now test Y as a knave: how many knights could there be?"
    buckets:
    - correct
    - partial_understanding
    - confused
    - limited_effort
    - asking_clarifying_questions
    - off_topic
    transitions:
      correct:
        ai_feedback:
          tokens_for_ai: Praise their systematic deduction across all three people.
        metadata_add:
          score: n+5
          puzzles_solved: n+1
        next_section_and_step: fallacies:intro
      partial_understanding:
        ai_feedback:
          tokens_for_ai: Confirm what they got right, then point at the person to test next. Don't give the answer.
        metadata_add:
          hints_used: n+1
        next_section_and_step: section_3:step_2
      confused:
        ai_feedback:
          tokens_for_ai: Walk them to the first step only, what X's statement tells us, then ask again.
        metadata_add:
          hints_used: n+1
        next_section_and_step: section_3:step_2
      limited_effort:
        content_blocks:
        - This is a tough puzzle! Start by analyzing X's statement. Can someone truthfully say 'we are all liars'?
        metadata_add:
          hints_used: n+1
        next_section_and_step: section_3:step_2
      asking_clarifying_questions:
        ai_feedback:
          tokens_for_ai: Answer their question and give one hint, never the answer.
        counts_as_attempt: false
        next_section_and_step: section_3:step_2
      off_topic:
        content_blocks:
        - Let's focus on solving this three-person knight and knave puzzle.
        next_section_and_step: section_3:step_2
- section_id: fallacies
  title: Spotting Fallacies
  steps:
  - step_id: intro
    title: Logical Fallacies
    content_blocks:
    - '## Spotting Fallacies 🔍'
    - "A **fallacy** is an argument that looks convincing but doesn't hold up. A few common ones:"
    - ''
    - '- **Ad hominem**: attacking the person instead of their argument'
    - '- **Straw man**: arguing against a weaker version of what someone said'
    - '- **False dilemma**: offering only two options when more exist'
    - '- **Affirming the consequent**: from ''if A then B'' and ''B'', concluding ''A'' (the converse trap!)'
    - ''
    - 'Score so far: **{{metadata.score}}** points.'
  - step_id: spot_ad_hominem
    title: Name That Fallacy
    question_type: multiple_choice
    question: '"You can''t trust Dana''s climate data: she failed chemistry in high school." Which fallacy is this?'
    choices:
    - {id: a, text: "Straw man"}
    - {id: b, text: "Ad hominem"}
    - {id: c, text: "False dilemma"}
    - {id: d, text: "Affirming the consequent"}
    answer: b
    transitions:
      correct:
        content_blocks:
        - "Right: it attacks Dana, not her data. ✅"
        metadata_add:
          score: n+1
          puzzles_solved: n+1
        next_section_and_step: fallacies:spot_converse
      incorrect:
        content_blocks:
        - "Not quite: is the argument about the data, or about Dana?"
  - step_id: spot_converse
    title: Valid or Not?
    question_type: multiple_choice
    question: '"If it rained, the ground is wet. The ground is wet. So it rained." What is this argument?'
    choices:
    - {id: a, text: "Valid: it follows the rule"}
    - {id: b, text: "Affirming the consequent"}
    - {id: c, text: "A contrapositive"}
    - {id: d, text: "Ad hominem"}
    answer: b
    transitions:
      correct:
        content_blocks:
        - "Yes! A sprinkler wets the ground too: B doesn't prove A. ✅"
        metadata_add:
          score: n+1
          puzzles_solved: n+1
        next_section_and_step: section_4:step_1
      incorrect:
        content_blocks:
        - "Not quite: it runs the rule backwards, from B to A. Is that the contrapositive, or the converse trap?"
- section_id: section_4
  title: Reflection and Summary
  steps:
  - step_id: step_1
    title: Congratulations!
    content_blocks:
    - '## Congratulations! 🎉'
    - You've completed the Logic Puzzles activity!
    - ''
    - '**Your score: {{metadata.score}} points**, {{metadata.puzzles_solved}} of 8 puzzles solved.'
    - ''
    - '**What you''ve learned:**'
    - ✓ Basic deductive reasoning (if A then B)
    - ✓ Contrapositives and logical equivalence
    - ✓ Syllogisms and multi-step deduction
    - ✓ Consistency checking
    - ✓ Proof by contradiction (Knights and Knaves)
    - ✓ Spotting fallacies
    - ''
    - These skills serve you in programming, science, and every argument you hear.
    question: What was the most challenging puzzle for you, and what did you learn from it?
    tokens_for_ai: Accept any genuine reflection on their learning.
    bucket_criteria:
      thoughtful_reflection: "Names a puzzle and something specific they learned."
      brief_reflection: "Short but genuine."
      limited_effort: "Very minimal."
      off_topic: "Unrelated."
    feedback_tokens_for_ai: Acknowledge their specific challenge and encourage continued practice.
    buckets:
    - thoughtful_reflection
    - brief_reflection
    - limited_effort
    - off_topic
    transitions:
      thoughtful_reflection:
        ai_feedback:
          tokens_for_ai: Give personalized feedback on their journey and one way to keep practicing.
        metadata_add:
          activity_completed: 'true'
      brief_reflection:
        ai_feedback:
          tokens_for_ai: Acknowledge their reflection and encourage them to keep practicing.
        metadata_add:
          activity_completed: 'true'
      limited_effort:
        ai_feedback:
          tokens_for_ai: Thank them for participating and summarize the key takeaways in three lines.
        metadata_add:
          activity_completed: 'true'
      off_topic:
        content_blocks:
        - Let's reflect on your logic puzzle journey. Which puzzle challenged you most?
        next_section_and_step: section_4:step_1
