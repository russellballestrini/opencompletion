# What our Activities gallery shows for this activity (optional: see SPEC.yaml).
title: "Rock Paper Scissors"
description: "Play rock, paper, scissors against a historical figure, round after round, with a running score."
kind: "game"
default_max_attempts_per_step: 30
# Answers are moves ("rock"): our built-in clarifying bucket would misread them.
allow_clarifying_questions: false

sections:
  - section_id: "section_1"
    title: "Rock-Paper-Scissors with History"
    steps:

      - step_id: "step_0"
        title: "Challenge a Historical Figure"
        content_blocks:
          - "Welcome to the Rock-Paper-Scissors challenge! 🎮"
          - "You will be playing against a random historical figure. Rock beats scissors, scissors beat paper, paper beats rock. Say **exit** when you've had enough."

      - step_id: "step_1"
        title: "Shoot against a Historical Figure"
        question: "What's your choice? Rock, paper, or scissors? 🤔"
        tokens_for_ai: |
          - rock / paper / scissors: the move they throw (a synonym or emoji counts: ✊ ✋ ✌️, "stone", "shears").
          - set_language: they ask to play in another language.
          - exit: they want to stop, quit or leave.
        # Our script plays the figure's move & keeps score, so no model ever
        # decides who won.
        processing_script: |
          import random

          beats = {"rock": "scissors", "paper": "rock", "scissors": "paper"}
          yours = metadata.get("user_choice")
          theirs = random.choice(list(beats))
          for key in ("rounds", "wins", "losses", "ties"):
              metadata[key] = int(metadata.get(key) or 0)
          metadata["rounds"] += 1
          if yours == theirs:
              outcome = "tie"
              metadata["ties"] += 1
              line = "A tie! 🤝"
          elif beats.get(yours) == theirs:
              outcome = "win"
              metadata["wins"] += 1
              line = "You win this round! 🎉"
          else:
              outcome = "loss"
              metadata["losses"] += 1
              line = "Your opponent wins this round. 😤"
          metadata["their_move"] = theirs
          metadata["round_result"] = line
          script_result = {"outcome": outcome, "their_move": theirs}
        feedback_tokens_for_ai: |
          Speak in first person as one historical figure (keep the same figure all game).
          Their move (their_move) & the result (round_result) are decided & shown already: never change them.
          Add one witty fact in character, & a word on the score (wins, losses, ties).
        buckets:
          - rock
          - paper
          - scissors
          - set_language
          - exit
        transitions:
          rock:
            metadata_tmp_add:
              user_choice: "rock"
            run_processing_script: true
            content_blocks:
              - "✊ You: **rock** · Opponent: **{{metadata.their_move}}**. {{metadata.round_result}}"
              - "Score: **{{metadata.wins}}** won · **{{metadata.losses}}** lost · **{{metadata.ties}}** tied"
            ai_feedback:
              tokens_for_ai: "React to the round in character."
            next_section_and_step: "section_1:step_1"
          paper:
            metadata_tmp_add:
              user_choice: "paper"
            run_processing_script: true
            content_blocks:
              - "✋ You: **paper** · Opponent: **{{metadata.their_move}}**. {{metadata.round_result}}"
              - "Score: **{{metadata.wins}}** won · **{{metadata.losses}}** lost · **{{metadata.ties}}** tied"
            ai_feedback:
              tokens_for_ai: "React to the round in character."
            next_section_and_step: "section_1:step_1"
          scissors:
            metadata_tmp_add:
              user_choice: "scissors"
            run_processing_script: true
            content_blocks:
              - "✌️ You: **scissors** · Opponent: **{{metadata.their_move}}**. {{metadata.round_result}}"
              - "Score: **{{metadata.wins}}** won · **{{metadata.losses}}** lost · **{{metadata.ties}}** tied"
            ai_feedback:
              tokens_for_ai: "React to the round in character."
            next_section_and_step: "section_1:step_1"
          set_language:
            content_blocks:
              - "Language preference updated. Please continue in your preferred language."
            metadata_add:
              language: "the-users-response"
            counts_as_attempt: false
            next_section_and_step: "section_1:step_1"
          exit:
            metadata_add:
              activity_completed: "true"
            next_section_and_step: "section_2:step_1"

  - section_id: "section_2"
    title: "Goodbye"
    steps:
      - step_id: "step_1"
        title: "Exit"
        content_blocks:
          - text: "Final score after {{metadata.rounds}} rounds: **{{metadata.wins}}** won · **{{metadata.losses}}** lost · **{{metadata.ties}}** tied."
            show_if:
              rounds_gte: 1
          - "Thank you for playing! We hope you enjoyed the game. Have a great day! 🌟"
