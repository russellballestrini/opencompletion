title: "Miracles of Jesus"
description: "Eight miracle accounts from the Gospels, healing to resurrection: what each text says and what it meant to its first readers."
kind: "lesson"
default_max_attempts_per_step: 3
tokens_for_ai_rubric: "This lesson reads the Gospel miracle accounts respectfully. Grade what the learner knows of the texts, never what they believe: a believer, a sceptic and a student of another faith can all answer correctly. Accept any accurate detail from any Gospel's version."
sections:
  - section_id: "section_1"
    title: "Introduction to the Miracles of Jesus"
    steps:
      - step_id: "step_1"
        title: "Who is Jesus?"
        content_blocks:
          - "# Miracles of Jesus ✨"
          - "Welcome to our **Miracles of Jesus** course!"
          - "Jesus of Nazareth was a first-century Jewish teacher in Roman-ruled Galilee and Judea. Most historians agree he lived, taught, and was crucified under Pontius Pilate around 30 CE."
          - "Christians believe he is the Son of God and the Messiah. Muslims honour him as a prophet. Many others admire his teaching."
        question: "**What do you already know about Jesus?**"
        tokens_for_ai: "Grade whether the learner shares anything accurate about Jesus. Any accurate fact counts; no belief is required."
        bucket_criteria:
          correct: "Shares at least one accurate fact about Jesus or what traditions say about him."
          partial_understanding: "Shares something mostly inaccurate, or only says \"not much\"."
          off_topic: "Does not talk about Jesus."
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm the specific thing they got right in one or two sentences, then add one detail they did not mention."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what is good in their answer, then ask one question that would take it further."
          off_topic:
            content_blocks:
              - "Let's come back to the account above: have a go at the question. 🙂"

      - step_id: "step_2"
        title: "Importance of Miracles"
        content_blocks:
          - "The Gospels of Matthew, Mark, Luke and John describe many miracles. Mark, Matthew and Luke call them \"deeds of power\"; John calls them \"signs\"."
          - "In the Gospels, miracles show God's kingdom breaking in, point to who Jesus is, and show compassion for people who are suffering."
          - "Christians read them as real acts of God. Historians study what the texts say and how early they are; scholars explain them in different ways."
        question: "**According to the Gospels, why do Jesus' miracles matter?**"
        tokens_for_ai: "Grade whether the learner names a purpose the Gospels give for the miracles."
        bucket_criteria:
          correct: "Names a purpose the Gospels give: pointing to who Jesus is, showing God's power or kingdom, or compassion for people in need."
          partial_understanding: "Says they matter without saying why, or gives only their own view without the Gospels' purpose."
          off_topic: "Does not address the miracles."
        required_elements:
          - "a purpose the Gospels give: who Jesus is, God's power or kingdom, or compassion"
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: John calls the miracles \"signs\". A sign points to something."
          - attempt: 2
            text: "💡 Bigger hint: Think about who was helped, and what onlookers asked about Jesus afterwards."
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm the specific thing they got right in one or two sentences, then add one detail they did not mention."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what they got right, then ask one question that points at the idea they left out. Do not give the answer."
          off_topic:
            content_blocks:
              - "Let's come back to the account above: have a go at the question. 🙂"

  - section_id: "section_2"
    title: "Miracles of Healing"
    steps:
      - step_id: "step_1"
        title: "Healing the Blind Man"
        content_blocks:
          - "**John 9** tells of a man who had been blind from birth."
          - "Jesus made mud with his saliva, put it on the man's eyes, and told him to wash in the Pool of Siloam. The man washed and came back able to see."
          - "The religious leaders questioned the man and his parents closely; John uses the story to ask who is truly blind."
        question: "In your own words, what happens in the healing of the man born blind?"
        tokens_for_ai: "Grade the learner's retelling of the healing of the man born blind (John 9) as the Gospels tell it."
        bucket_criteria:
          correct: "Retells the account with each required idea, in any words or order."
          partial_understanding: "Gets part of the account but leaves out a required idea."
          off_topic: "Does not retell the healing of the man born blind (John 9)."
        required_elements:
          - "the man had been blind since birth"
          - "Jesus put mud on his eyes and sent him to wash (in the Pool of Siloam)"
          - "after washing, he could see"
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: Start with who the man was: how long had he been blind?"
          - attempt: 2
            text: "💡 Bigger hint: What did Jesus put on his eyes, and where did he send him?"
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm their retelling, then add one detail from the text they did not mention and what it meant to its first readers."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what they got right, then ask one question that points at the idea they left out. Do not give the answer."
          off_topic:
            content_blocks:
              - "Let's come back to the account above: have a go at the question. 🙂"

      - step_id: "step_2"
        title: "Healing the Leper"
        content_blocks:
          - "**Mark 1:40-45** (also in Matthew and Luke): a man with leprosy knelt and said, \"If you are willing, you can make me clean.\""
          - "Jesus touched him and said, \"I am willing. Be clean!\" At once the leprosy left him."
          - "Under the purity laws of the time, people with skin disease lived apart from others, so touching him was itself striking."
        question: "In your own words, what happens in the healing of the man with leprosy?"
        tokens_for_ai: "Grade the learner's retelling of the healing of the man with leprosy (Mark 1) as the Gospels tell it."
        bucket_criteria:
          correct: "Retells the account with each required idea, in any words or order."
          partial_understanding: "Gets part of the account but leaves out a required idea."
          off_topic: "Does not retell the healing of the man with leprosy (Mark 1)."
        required_elements:
          - "a man with leprosy asked Jesus to make him clean"
          - "Jesus touched him (and said \"Be clean\")"
          - "he was healed at once"
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: What did the man ask for?"
          - attempt: 2
            text: "💡 Bigger hint: What did Jesus do with his hand that surprised people?"
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm their retelling, then add one detail from the text they did not mention and what it meant to its first readers."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what they got right, then ask one question that points at the idea they left out. Do not give the answer."
          off_topic:
            content_blocks:
              - "Let's come back to the account above: have a go at the question. 🙂"

  - section_id: "section_3"
    title: "Miracles of Provision"
    steps:
      - step_id: "step_1"
        title: "Feeding the 5,000"
        content_blocks:
          - "With five loaves of bread and two fish, Jesus fed a crowd of about 5,000 men, besides women and children."
          - "He blessed the food, broke it, and the disciples handed it out. Everyone ate their fill, and twelve baskets of leftovers were gathered."
        question: "In your own words, what happens in the feeding of the 5,000?"
        tokens_for_ai: "Grade the learner's retelling of the feeding of the 5,000 as the Gospels tell it."
        bucket_criteria:
          correct: "Retells the account with each required idea, in any words or order."
          partial_understanding: "Gets part of the account but leaves out a required idea."
          off_topic: "Does not retell the feeding of the 5,000."
        required_elements:
          - "there was very little food (five loaves and two fish)"
          - "Jesus blessed and shared it and a huge crowd ate"
          - "everyone was satisfied, with food left over"
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: How much food did they start with?"
          - attempt: 2
            text: "💡 Bigger hint: How many baskets were left over?"
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm their retelling, then add one detail from the text they did not mention and what it meant to its first readers."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what they got right, then ask one question that points at the idea they left out. Do not give the answer."
          off_topic:
            content_blocks:
              - "Let's come back to the account above: have a go at the question. 🙂"

      - step_id: "quiz_gospels"
        title: "Quick Check: Four Gospels"
        question_type: multiple_choice
        question: "Apart from the resurrection, which miracle is told in all four Gospels?"
        choices:
          - {id: a, text: "Turning water into wine"}
          - {id: b, text: "The feeding of the 5,000"}
          - {id: c, text: "The raising of Lazarus"}
          - {id: d, text: "Walking on water"}
        answer: b
        hints:
          - attempt: 1
            text: "💡 Hint: Water into wine and Lazarus appear only in John."
          - attempt: 2
            text: "💡 Bigger hint: Walking on water is missing from Luke."
        transitions:
          correct:
            content_blocks:
              - "✅ The feeding of the 5,000 is in Matthew, Mark, Luke and John."
            metadata_add:
              score: "n+1"
          incorrect:
            metadata_add:
              misses_section_3_quiz_gospels: "n+1"
            content_blocks:
              - text: "Not quite."
                show_if: {misses_section_3_quiz_gospels_lt: 3}
              - text: "Not this time. The answer: The feeding of the 5,000."
                show_if: {misses_section_3_quiz_gospels_gte: 3}

      - step_id: "step_2"
        title: "Turning Water into Wine"
        content_blocks:
          - "**John 2** calls it Jesus' first sign: at a wedding the wine ran out."
          - "Jesus told the servants to fill six stone water jars, used for ritual washing. When the water was drawn out it had become wine, better than what was served first."
        question_type: multiple_choice
        question: "Where was the wedding at which, John says, Jesus turned water into wine?"
        choices:
          - {id: a, text: "Bethlehem"}
          - {id: b, text: "Cana in Galilee"}
          - {id: c, text: "Jerusalem"}
          - {id: d, text: "Capernaum"}
        answer: b
        hints:
          - attempt: 1
            text: "💡 Hint: It was a village in Galilee."
          - attempt: 2
            text: "💡 Bigger hint: Its name begins with C, and it is not Capernaum."
        transitions:
          correct:
            content_blocks:
              - "✅ Cana in Galilee. John calls it \"the first of his signs\" (John 2:11)."
            metadata_add:
              score: "n+1"
          incorrect:
            metadata_add:
              misses_section_3_step_2: "n+1"
            content_blocks:
              - text: "Not quite."
                show_if: {misses_section_3_step_2_lt: 3}
              - text: "Not this time. The answer: Cana in Galilee (John 2)."
                show_if: {misses_section_3_step_2_gte: 3}

  - section_id: "section_4"
    title: "Miracles of Nature"
    steps:
      - step_id: "step_1"
        title: "Calming the Storm"
        content_blocks:
          - "**Mark 4:35-41**: Jesus and his disciples were crossing the Sea of Galilee when a fierce storm broke over the boat. Jesus was asleep."
          - "The terrified disciples woke him. He rebuked the wind and said to the waves, \"Quiet! Be still!\" and it was completely calm."
          - "The disciples asked one another, \"Who is this? Even the wind and the waves obey him!\""
        question: "In your own words, what happens when Jesus calms the storm?"
        tokens_for_ai: "Grade the learner's retelling of the calming of the storm (Mark 4) as the Gospels tell it."
        bucket_criteria:
          correct: "Retells the account with each required idea, in any words or order."
          partial_understanding: "Gets part of the account but leaves out a required idea."
          off_topic: "Does not retell the calming of the storm (Mark 4)."
        required_elements:
          - "a storm struck the disciples' boat on the lake"
          - "Jesus spoke to the wind and waves and they became calm"
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: Where were they, and what was Jesus doing when the storm hit?"
          - attempt: 2
            text: "💡 Bigger hint: What did Jesus say to the wind and the waves?"
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm their retelling, then add one detail from the text they did not mention and what it meant to its first readers."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what they got right, then ask one question that points at the idea they left out. Do not give the answer."
          off_topic:
            content_blocks:
              - "Let's come back to the account above: have a go at the question. 🙂"

      - step_id: "step_2"
        title: "Walking on Water"
        content_blocks:
          - "**Matthew 14:22-33** (also Mark 6 and John 6): at night, Jesus walked across the Sea of Galilee to his disciples' boat."
          - "They were terrified, thinking he was a ghost, but he said, \"Take courage! It is I. Don't be afraid.\""
          - "In Matthew, Peter steps out to walk to him, begins to sink when he fears the wind, and Jesus catches him."
        question: "In your own words, what happens when Jesus walks on the water?"
        tokens_for_ai: "Grade the learner's retelling of Jesus walking on the water as the Gospels tell it."
        bucket_criteria:
          correct: "Retells the account with each required idea, in any words or order."
          partial_understanding: "Gets part of the account but leaves out a required idea."
          off_topic: "Does not retell Jesus walking on the water."
        required_elements:
          - "Jesus walked on the water to the disciples' boat"
          - "the disciples were afraid and he reassured them"
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: Where were the disciples, and how did Jesus reach them?"
          - attempt: 2
            text: "💡 Bigger hint: How did the disciples react, and what did Jesus say?"
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm their retelling, then add one detail from the text they did not mention and what it meant to its first readers."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what they got right, then ask one question that points at the idea they left out. Do not give the answer."
          off_topic:
            content_blocks:
              - "Let's come back to the account above: have a go at the question. 🙂"

  - section_id: "section_5"
    title: "Miracles of Resurrection"
    steps:
      - step_id: "step_1"
        title: "Raising Lazarus"
        content_blocks:
          - "**John 11**: Lazarus of Bethany, brother of Martha and Mary, had been dead four days when Jesus arrived. Jesus wept."
          - "At the tomb Jesus called out, \"Lazarus, come out!\" and Lazarus came out, still wrapped in grave cloths."
        question: "In your own words, what happens in the raising of Lazarus?"
        tokens_for_ai: "Grade the learner's retelling of the raising of Lazarus (John 11) as the Gospels tell it."
        bucket_criteria:
          correct: "Retells the account with each required idea, in any words or order."
          partial_understanding: "Gets part of the account but leaves out a required idea."
          off_topic: "Does not retell the raising of Lazarus (John 11)."
        required_elements:
          - "Lazarus had died and been in the tomb for days"
          - "Jesus called him out of the tomb and he came out alive"
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: How long had Lazarus been dead when Jesus arrived?"
          - attempt: 2
            text: "💡 Bigger hint: What did Jesus call out at the tomb?"
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm their retelling, then add one detail from the text they did not mention and what it meant to its first readers."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what they got right, then ask one question that points at the idea they left out. Do not give the answer."
          off_topic:
            content_blocks:
              - "Let's come back to the account above: have a go at the question. 🙂"

      - step_id: "step_2"
        title: "Resurrection of Jesus"
        content_blocks:
          - "All four Gospels, and Paul's letters (1 Corinthians 15), proclaim that Jesus was crucified, buried, and raised on the third day; the Gospels tell of an empty tomb and of appearances to his followers."
          - "Christians celebrate it at Easter as the foundation of their faith. Historians agree his followers proclaimed it very soon after his death; how to explain that is where belief and scholarship differ."
        question: "In your own words, what do the Gospels say happened after Jesus' crucifixion?"
        tokens_for_ai: "Grade the learner's retelling of the resurrection accounts as the Gospels tell it."
        bucket_criteria:
          correct: "Retells the account with each required idea, in any words or order."
          partial_understanding: "Gets part of the account but leaves out a required idea."
          off_topic: "Does not retell the resurrection accounts."
        required_elements:
          - "Jesus was crucified and buried"
          - "on the third day the tomb was found empty or he appeared to his followers"
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: Start with what happened on Friday, then what the women found on Sunday."
          - attempt: 2
            text: "💡 Bigger hint: On which day do the Gospels say the tomb was found empty?"
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm their retelling, then add one detail from the text they did not mention and what it meant to its first readers."
            metadata_add:
              score: "n+1"
              activity_completed: "true"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what they got right, then ask one question that points at the idea they left out. Do not give the answer."
          off_topic:
            content_blocks:
              - "Let's come back to the account above: have a go at the question. 🙂"

  - section_id: "section_6"
    title: "Congratulations!"
    steps:
      - step_id: "step_1"
        title: "Well Done!"
        content_blocks:
          - "# Congratulations! 🎉"
          - "You've finished our Miracles of Jesus course: healing, provision, nature, and resurrection, as the Gospels tell them."
          - "For Christians these accounts reveal who Jesus is and God's compassion; for every reader they are central texts of a faith that shaped the world."
          - text: "**Your score: {{metadata.score}} of 11** 🏆"
            show_if: {score_exists: true}
