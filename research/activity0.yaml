    title: "Congratulations!"
    steps:
      - step_id: "step_1"
        title: "Well Done!"
        content_blocks:
          - "# Congratulations! 🎉"
          - "You've finished our GNU Manifesto course: its reasons, its key ideas, and its legacy."
          - "Read the Manifesto itself at https://www.gnu.org/gnu/manifesto.html"
          - text: "**Your score: {{metadata.score}} of 11** 🏆"
            show_if: {score_exists: true}
