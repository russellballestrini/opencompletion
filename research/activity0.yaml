title: "The GNU Manifesto"
description: "Why Richard Stallman started GNU, what \"free\" means in free software, and how copyleft shaped the software we use today."
kind: "lesson"
default_max_attempts_per_step: 3
sections:
  - section_id: "section_0"
    title: "Introduction"
    steps:
      - step_id: "step_1"
        title: "Welcome"
        content_blocks:
          - "# The GNU Manifesto 🐃"
          - "<img src='https://www.gnu.org/graphics/heckert_gnu.transp.small.png'>"
          - "Welcome to our GNU Manifesto course! 👋"
          - "You'll learn what the Manifesto says, why it was written, and how it still shapes the software we use."
          - "Ask a question any time: asking never costs you a try."

  - section_id: "section_1"
    title: "Introduction to The GNU Manifesto"
    steps:
      - step_id: "step_1"
        title: "What is The GNU Manifesto?"
        content_blocks:
          - "Richard Stallman announced the GNU Project in September 1983. In March 1985 he published **The GNU Manifesto** to explain it and ask for support."
          - "GNU was to be a complete operating system that anyone could use, study, change and share."
          - "Stallman's \"Golden Rule\": if he liked a program, he must share it with others who like it. Licences that forbade sharing turned users against their neighbours."
        question: "Why do you think Richard Stallman wanted to create a free operating system? 🤔"
        tokens_for_ai: "Grade the learner's reason for creating GNU. Accept any reason the Manifesto supports, in their own words."
        bucket_criteria:
          correct: "Gives a reason tied to freedom: sharing with others, cooperation, or users being free to study, change or redistribute programs."
          partial_understanding: "Gives only a vague reason (\"it's better\") or only cost, with no idea of freedom or sharing."
          off_topic: "Does not address why GNU was created."
          set_language: "Asks to switch to another language."
        required_elements:
          - "a reason about users' freedom to share, study or change software, or about cooperation between users"
        buckets: [correct, partial_understanding, off_topic, set_language]
        hints:
          - attempt: 1
            text: "💡 Hint: In the Manifesto, \"free\" is about freedom, not price."
          - attempt: 2
            text: "💡 Bigger hint: What does Stallman's Golden Rule say he must be able to do with a program he likes?"
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm their reason, then connect it to Stallman's Golden Rule: sharing a good program with others who like it."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what they got right, then ask one question that points at the idea they left out. Do not give the answer."
          off_topic:
            content_blocks:
              - "Let's come back to the GNU Manifesto: have a go at the question above. 🧭"
          set_language:
            content_blocks:
              - "Language preference updated."
            metadata_add:
              language: "the-users-response"
            counts_as_attempt: false

      - step_id: "step_2"
        title: "Importance of The GNU Manifesto"
        content_blocks:
          - "The Manifesto laid the foundation for the Free Software Movement."
          - "It argues that software freedom helps users (they control their own computers) and developers (they can build on each other's work instead of starting over)."
        question: "How do you think free software benefits users and developers? 🤔"
        tokens_for_ai: "Grade whether the learner names benefits of free software. Any reasonable benefit counts."
        bucket_criteria:
          correct: "Names at least one benefit for users and one for developers (freedom, control, cost, learning from code, collaboration, reuse)."
          partial_understanding: "Names benefits for only one group, or is too vague to name any benefit."
          off_topic: "Does not discuss benefits of free software."
          set_language: "Asks to switch to another language."
        required_elements:
          - "a benefit to users"
          - "a benefit to developers"
        buckets: [correct, partial_understanding, off_topic, set_language]
        hints:
          - attempt: 1
            text: "💡 Hint: Think about two groups: the people who use programs and the people who write them."
          - attempt: 2
            text: "💡 Bigger hint: Users: who controls the program on their computer? Developers: what can they do with each other's code?"
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm the specific thing they got right in one or two sentences, then add one detail they did not mention."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what they got right, then ask one question that points at the idea they left out. Do not give the answer."
          off_topic:
            content_blocks:
              - "Let's come back to the GNU Manifesto: have a go at the question above. 🧭"
          set_language:
            content_blocks:
              - "Language preference updated."
            metadata_add:
              language: "the-users-response"
            counts_as_attempt: false

      - step_id: "quiz_year"
        title: "Quick Check: When?"
        question_type: multiple_choice
        question: "In what year was The GNU Manifesto published?"
        choices:
          - {id: a, text: "1969"}
          - {id: b, text: "1983"}
          - {id: c, text: "1985"}
          - {id: d, text: "1991"}
        answer: c
        hints:
          - attempt: 1
            text: "💡 Hint: It came after the GNU Project was announced."
          - attempt: 2
            text: "💡 Bigger hint: It was the middle of the 1980s."
        transitions:
          correct:
            content_blocks:
              - "✅ 1985. The project was announced in 1983, and the Manifesto followed in March 1985."
            metadata_add:
              score: "n+1"
          incorrect:
            metadata_add:
              misses_section_1_quiz_year: "n+1"
            content_blocks:
              - text: "Not quite."
                show_if: {misses_section_1_quiz_year_lt: 3}
              - text: "Not this time. The answer: 1985 (the GNU Project itself was announced in 1983)."
                show_if: {misses_section_1_quiz_year_gte: 3}

  - section_id: "section_2"
    title: "Key Concepts of The GNU Manifesto"
    steps:
      - step_id: "step_1"
        title: "What is GNU?"
        content_blocks:
          - "GNU stands for **\"GNU's Not Unix\"**: a recursive acronym, a hacker joke that names itself."
          - "GNU was designed to be compatible with Unix, the most widely used system for serious computing at the time, while containing none of Unix's code."
        question: "Why do you think it was important for GNU to be compatible with Unix? 🤔"
        tokens_for_ai: "Grade the learner's reason for Unix compatibility. Accept any sound reason."
        bucket_criteria:
          correct: "Explains that compatibility let existing Unix users and programs move to GNU easily (familiar commands, programs that run without rewriting)."
          partial_understanding: "Says it was \"easier\" or \"popular\" without saying for whom or why."
          off_topic: "Does not address Unix compatibility."
          set_language: "Asks to switch to another language."
        required_elements:
          - "existing Unix users or programs could switch to GNU without starting over"
        buckets: [correct, partial_understanding, off_topic, set_language]
        hints:
          - attempt: 1
            text: "💡 Hint: Imagine you already use Unix every day. What would make switching painless?"
          - attempt: 2
            text: "💡 Bigger hint: Think about the programs and skills people already had."
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm the specific thing they got right in one or two sentences, then add one detail they did not mention."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what they got right, then ask one question that points at the idea they left out. Do not give the answer."
          off_topic:
            content_blocks:
              - "Let's come back to the GNU Manifesto: have a go at the question above. 🧭"
          set_language:
            content_blocks:
              - "Language preference updated."
            metadata_add:
              language: "the-users-response"
            counts_as_attempt: false

      - step_id: "step_2"
        title: "Why GNU Will Be Free"
        content_blocks:
          - "GNU is not in the public domain. The Manifesto promises that everyone may use, modify and redistribute it, and that no distributor may restrict further redistribution."
          - "That rule later became **copyleft**, written into the GNU General Public License (GPL, 1989): you may share changed versions, but only under the same freedoms."
        question: "Why do you think it was important for GNU to remain free, rather than just being put in the public domain? 🤔"
        tokens_for_ai: "Grade the learner's reason GNU must stay free for every later user."
        bucket_criteria:
          correct: "Explains that the freedom must pass on: without the rule, someone could take the code, change it and make their version proprietary."
          partial_understanding: "Says freedom matters but not why public domain alone would not protect it, or talks only about price."
          off_topic: "Does not address why GNU must remain free."
          set_language: "Asks to switch to another language."
        required_elements:
          - "without such a rule, someone could take the code and restrict the copies they pass on"
        buckets: [correct, partial_understanding, off_topic, set_language]
        hints:
          - attempt: 1
            text: "💡 Hint: Public-domain code can be taken by anyone and used for anything."
          - attempt: 2
            text: "💡 Bigger hint: What could a company do with public-domain code that copyleft forbids?"
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm the specific thing they got right in one or two sentences, then add one detail they did not mention."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what they got right, then ask one question that points at the idea they left out. Do not give the answer."
          off_topic:
            content_blocks:
              - "Let's come back to the GNU Manifesto: have a go at the question above. 🧭"
          set_language:
            content_blocks:
              - "Language preference updated."
            metadata_add:
              language: "the-users-response"
            counts_as_attempt: false

      - step_id: "quiz_name"
        title: "Quick Check: The Name"
        question_type: multiple_choice
        question: "What does GNU stand for?"
        choices:
          - {id: a, text: "GNU's Not Unix"}
          - {id: b, text: "General Network Utilities"}
          - {id: c, text: "Global Nonprofit Unix"}
          - {id: d, text: "GNU's New Userland"}
        answer: a
        hints:
          - attempt: 1
            text: "💡 Hint: It's a joke: the name contains itself."
          - attempt: 2
            text: "💡 Bigger hint: It says what GNU is NOT."
        transitions:
          correct:
            content_blocks:
              - "✅ GNU's Not Unix: the name contains itself, a recursive acronym."
            metadata_add:
              score: "n+1"
          incorrect:
            metadata_add:
              misses_section_2_quiz_name: "n+1"
            content_blocks:
              - text: "Not quite."
                show_if: {misses_section_2_quiz_name_lt: 3}
              - text: "Not this time. The answer: GNU's Not Unix."
                show_if: {misses_section_2_quiz_name_gte: 3}

      - step_id: "quiz_copyleft"
        title: "Quick Check: Copyleft"
        question_type: multiple_choice
        question: "Which idea keeps every copy of GNU free, even after someone changes it?"
        choices:
          - {id: a, text: "Public domain"}
          - {id: b, text: "Copyleft"}
          - {id: c, text: "Shareware"}
          - {id: d, text: "Freeware"}
        answer: b
        hints:
          - attempt: 1
            text: "💡 Hint: Public domain puts no rules on the next person."
          - attempt: 2
            text: "💡 Bigger hint: Its name plays on \"copyright\"."
        transitions:
          correct:
            content_blocks:
              - "✅ Copyleft: changed versions must carry the same freedoms."
            metadata_add:
              score: "n+1"
          incorrect:
            metadata_add:
              misses_section_2_quiz_copyleft: "n+1"
            content_blocks:
              - text: "Not quite."
                show_if: {misses_section_2_quiz_copyleft_lt: 3}
              - text: "Not this time. The answer: Copyleft, as in the GNU General Public License."
                show_if: {misses_section_2_quiz_copyleft_gte: 3}

  - section_id: "section_3"
    title: "Contributing to GNU"
    steps:
      - step_id: "step_1"
        title: "How to Contribute"
        content_blocks:
          - "The Manifesto asks for help of every kind: money, programs, equipment and work."
          - "GNU was built by volunteers, and much of it still is."
        question: "Why do you think it is important for people to contribute to the GNU Project? 🤔"
        tokens_for_ai: "Grade the learner's reasoning about contributing. Any thoughtful reason counts."
        bucket_criteria:
          correct: "Gives a reason (shared goals, community, a project too big for one person, everyone benefits)."
          partial_understanding: "Answers with a word or two and no reason."
          off_topic: "Does not address contributing to GNU."
          set_language: "Asks to switch to another language."
        buckets: [correct, partial_understanding, off_topic, set_language]
        hints:
          - attempt: 1
            text: "💡 Hint: What would happen to a volunteer project if nobody helped?"
          - attempt: 2
            text: "💡 Bigger hint: Who benefits when one person improves a free program?"
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm the specific thing they got right in one or two sentences, then add one detail they did not mention."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what is good in their answer, then ask one question that would take it further."
          off_topic:
            content_blocks:
              - "Let's come back to the GNU Manifesto: have a go at the question above. 🧭"
          set_language:
            content_blocks:
              - "Language preference updated."
            metadata_add:
              language: "the-users-response"
            counts_as_attempt: false

      - step_id: "step_2"
        title: "Ways to Contribute"
        content_blocks:
          - "You can help by writing code, fixing defects, testing, writing documentation, translating, answering questions, or donating."
          - "Think about how your own skills and interests could fit."
        question: "How could you contribute to the GNU Project, or free software in general, with your skills and interests? 🤔"
        tokens_for_ai: "Grade whether the learner names a concrete way they could help. Any honest, concrete idea counts."
        bucket_criteria:
          correct: "Names at least one concrete way they could help that fits them."
          partial_understanding: "Says they would help without saying how."
          off_topic: "Does not address contributing."
          set_language: "Asks to switch to another language."
        buckets: [correct, partial_understanding, off_topic, set_language]
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm the specific thing they got right in one or two sentences, then add one detail they did not mention."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what is good in their answer, then ask one question that would take it further."
          off_topic:
            content_blocks:
              - "Let's come back to the GNU Manifesto: have a go at the question above. 🧭"
          set_language:
            content_blocks:
              - "Language preference updated."
            metadata_add:
              language: "the-users-response"
            counts_as_attempt: false

  - section_id: "section_4"
    title: "Legacy of The GNU Manifesto"
    steps:
      - step_id: "step_1"
        title: "Impact on Software Development"
        content_blocks:
          - "In 1991 Linus Torvalds released the Linux kernel; combined with GNU's tools it made a complete free system, which the FSF calls GNU/Linux."
          - "The GPL became one of the most used software licences, and in 1998 the open source movement grew out of the free software world, describing similar practices with different emphasis (practical benefits rather than freedom)."
        question: "How do you think the principles of The GNU Manifesto have influenced modern software development? 🤔"
        tokens_for_ai: "Grade whether the learner names a real influence. Accept any accurate example."
        bucket_criteria:
          correct: "Names at least one concrete influence (copyleft licences like the GPL, GNU/Linux systems, open source, collaborative development, sharing code publicly)."
          partial_understanding: "Says it was influential without naming any concrete effect."
          off_topic: "Does not address the Manifesto's influence."
          set_language: "Asks to switch to another language."
        required_elements:
          - "one concrete influence on how software is made or shared"
        buckets: [correct, partial_understanding, off_topic, set_language]
        hints:
          - attempt: 1
            text: "💡 Hint: Think about the systems that run most web servers and phones today."
          - attempt: 2
            text: "💡 Bigger hint: Licences, operating systems, and the habit of sharing code publicly are all good places to look."
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm the specific thing they got right in one or two sentences, then add one detail they did not mention."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what they got right, then ask one question that points at the idea they left out. Do not give the answer."
          off_topic:
            content_blocks:
              - "Let's come back to the GNU Manifesto: have a go at the question above. 🧭"
          set_language:
            content_blocks:
              - "Language preference updated."
            metadata_add:
              language: "the-users-response"
            counts_as_attempt: false

      - step_id: "step_2"
        title: "Future of Free Software"
        content_blocks:
          - "The Manifesto's ideas still drive the Free Software Movement."
          - "Think about where software is heading: phones, cars, medical devices, machine learning."
        question: "How do you think the principles of free software will shape the future of technology? 🤔"
        tokens_for_ai: "Grade the learner's reflection. Any reasoned view counts, including a sceptical one."
        bucket_criteria:
          correct: "Gives a view of the future with a reason."
          partial_understanding: "Gives a view with no reason, or a single word."
          off_topic: "Does not address the future of free software."
          set_language: "Asks to switch to another language."
        buckets: [correct, partial_understanding, off_topic, set_language]
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm the specific thing they got right in one or two sentences, then add one detail they did not mention."
            metadata_add:
              score: "n+1"
              activity_completed: "true"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what is good in their answer, then ask one question that would take it further."
          off_topic:
            content_blocks:
              - "Let's come back to the GNU Manifesto: have a go at the question above. 🧭"
          set_language:
            content_blocks:
              - "Language preference updated."
            metadata_add:
              language: "the-users-response"
            counts_as_attempt: false

