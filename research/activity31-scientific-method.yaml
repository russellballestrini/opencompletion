title: "Scientific Method Explorer"
description: "Follow Semmelweis & Newton through observation, hypothesis, controls, variables, bias & replication."
kind: "lesson"
default_max_attempts_per_step: 3
tokens_for_ai_rubric: |
  Evaluate the student's understanding of the scientific method: forming
  testable questions & hypotheses, controls & variables, bias, and drawing
  conclusions from data. Be encouraging; suggest how to apply scientific
  thinking in their own explorations.
sections:
- section_id: introduction
  title: Welcome to Scientific Method Explorer
  steps:
  - step_id: welcome
    title: Welcome to Scientific Method
    content_blocks:
    - '# Welcome to Scientific Method Explorer! 🔬'
    - Explore how scientists make discoveries through the scientific method.
    - ''
    - 'You''ll follow in the footsteps of famous scientists, learning to:'
    - '- Ask testable questions'
    - '- Form hypotheses'
    - '- Design experiments'
    - '- Identify variables and controls'
    - '- Analyze results and draw conclusions'
    - ''
    - '**The Scientific Method Steps:**'
    - 1. **Observe** - Notice something interesting
    - 2. **Question** - Ask why or how
    - 3. **Hypothesize** - Make an educated guess
    - 4. **Experiment** - Test your hypothesis
    - 5. **Analyze** - Look at your data
    - 6. **Conclude** - Determine if hypothesis was supported
    question: Are you ready to explore the scientific method through real discoveries?
    tokens_for_ai: |
      - ready: Positive, ready to begin
      - set_language: Setting language preference
      - off_topic: Unrelated
    buckets:
    - ready
    - set_language
    - off_topic
    transitions:
      ready:
        content_blocks:
        - Excellent! Let's begin with a fascinating historical case study.
        metadata_add:
          score: 0
        next_section_and_step: section_1:step_1
      set_language:
        content_blocks:
        - I'll communicate in your preferred language.
        metadata_add:
          language: the-users-response
        counts_as_attempt: false
      off_topic:
        content_blocks:
        - Let's get started with exploring science! Are you ready?
        counts_as_attempt: false
- section_id: section_1
  title: 'Case Study: Germ Theory'
  steps:
  - step_id: step_1
    title: The Mystery of Childbed Fever
    content_blocks:
    - '## The Mystery of Childbed Fever (1840s)'
    - '**The Observation:**'
    - 'Dr. Ignaz Semmelweis noticed something disturbing in his Vienna hospital:'
    - '- Ward 1 (doctors and medical students): 10% of mothers died from childbed fever'
    - '- Ward 2 (midwives): Only 4% of mothers died'
    - ''
    - '**The Puzzle:**'
    - Both wards had similar conditions, but Ward 1 had much higher death rates.
    - ''
    - Semmelweis observed that doctors in Ward 1 came directly from autopsy rooms to deliver babies, while midwives in Ward 2 did not perform autopsies.
    question: What question should Semmelweis ask based on this observation? What do you think might be causing the difference in death rates?
    tokens_for_ai: Grade whether the learner forms a testable causal question from the observation.
    bucket_criteria:
      correct_question: "Links the doctors' autopsy work (something on their hands) to the fever."
      creative_thinking: "Proposes another testable cause worth considering."
      partial_understanding: "Notices the ward difference but asks no clear causal question."
      limited_effort: "Very brief or vague."
      off_topic: "Does not engage the question."
    feedback_tokens_for_ai: |
      If they link autopsies to the fever, praise the observation. If they
      suggest other factors, acknowledge them and guide toward the autopsy link.
    buckets:
    - correct_question
    - creative_thinking
    - partial_understanding
    - limited_effort
    - off_topic
    transitions:
      correct_question:
        ai_feedback:
          tokens_for_ai: "Praise them, they asked the key question Semmelweis asked."
        metadata_add:
          score: n+1
        next_section_and_step: section_1:step_2
      partial_understanding:
        ai_feedback:
          tokens_for_ai: Acknowledge the pattern they saw, then ask what might differ about the doctors' hands.
      creative_thinking:
        ai_feedback:
          tokens_for_ai: Acknowledge their creativity while guiding them to consider the autopsy connection.
        metadata_add:
          score: n+1
        next_section_and_step: section_1:step_2
      limited_effort:
        content_blocks:
        - Think about what the doctors were doing that the midwives were not. What might they be carrying on their hands?
      off_topic:
        content_blocks:
        - Let's focus on the medical mystery. What difference between the two wards might explain the death rates?
  - step_id: step_2
    title: Forming a Hypothesis
    content_blocks:
    - '## Forming a Hypothesis'
    - 'Semmelweis formed a hypothesis:'
    - ''
    - '**''Cadaveric particles'' from autopsies on doctors'' hands are causing childbed fever.**'
    - ''
    - This was revolutionary! In the 1840s, germs were not yet understood.
    - ''
    - '**Now for the experiment:**'
    - Semmelweis decides to require doctors to wash their hands with chlorinated lime solution before examining patients.
    question: What should Semmelweis measure before and after the handwashing requirement? What would be the control group?
    tokens_for_ai: Grade the learner's measurement and comparison (control).
    bucket_criteria:
      correct_method: "Measures death rates and names a fair comparison (Ward 1 before handwashing, or Ward 2)."
      partial_understanding: "Measures death rates but no clear control, or a control with no measure."
      incorrect: "Confuses what a control group is or measures something unrelated."
      limited_effort: "Very brief."
      off_topic: "Does not engage the question."
    required_elements:
    - "measures the death rate from childbed fever"
    - "names a comparison group (Ward 1 before handwashing, or Ward 2)"
    feedback_tokens_for_ai: |
      If they understand controls, praise them. If not, explain that a control
      shows whether a change came from our intervention or something else.
    buckets:
    - correct_method
    - partial_understanding
    - incorrect
    - limited_effort
    - off_topic
    transitions:
      correct_method:
        ai_feedback:
          tokens_for_ai: Praise their experimental thinking & the role of their control.
        metadata_add:
          score: n+2
        next_section_and_step: section_1:step_3
      partial_understanding:
        ai_feedback:
          tokens_for_ai: Name the element they left out (the measure or the comparison), without giving the answer.
      incorrect:
        content_blocks:
        - '**Control groups** help us compare results.'
        - 'We need to know: are death rates different WITH handwashing vs WITHOUT it?'
      limited_effort:
        content_blocks:
        - Think about what Semmelweis should measure and what he should compare it to.
      off_topic:
        content_blocks:
        - Let's focus on designing the experiment. What should we measure?
  - step_id: step_3
    title: The Results!
    content_blocks:
    - '## The Results!'
    - Semmelweis implemented handwashing with chlorinated lime in 1847.
    - ''
    - '**The data:**'
    - '- **Before handwashing (1846):** Death rate in Ward 1 = 10%'
    - '- **After handwashing (1847-1848):** Death rate in Ward 1 = 2%'
    - ''
    - 'The death rate dropped by 80%: $(10 - 2) / 10 = 0.8$.'
    question: Based on these results, was Semmelweis's hypothesis supported? What can we conclude about the cause of childbed fever?
    tokens_for_ai: Grade the learner's conclusion from the data.
    bucket_criteria:
      correct_conclusion: "Says the data support the hypothesis: something on doctors' hands caused the fever."
      overstating: "Correct idea but claims the data 'prove' it."
      partial_understanding: "Gets the general idea, reasoning incomplete."
      limited_effort: "Very brief."
      off_topic: "Does not engage the question."
    required_elements:
    - "the hypothesis was supported (death rates fell after handwashing)"
    - "something carried on doctors' hands caused the fever"
    feedback_tokens_for_ai: |
      If they say "proves", explain gently that evidence "supports" a
      hypothesis; scientific conclusions stay open to new evidence.
    buckets:
    - correct_conclusion
    - overstating
    - partial_understanding
    - limited_effort
    - off_topic
    transitions:
      correct_conclusion:
        ai_feedback:
          tokens_for_ai: Praise their analysis and mention the impact handwashing had on medicine.
        metadata_add:
          score: n+2
        next_section_and_step: section_1:pick_hypothesis
      overstating:
        ai_feedback:
          tokens_for_ai: Praise the reasoning; explain why results 'support' rather than 'prove' a hypothesis.
        metadata_add:
          score: n+1
        next_section_and_step: section_1:pick_hypothesis
      partial_understanding:
        ai_feedback:
          tokens_for_ai: Ask them to connect the drop in deaths to the hypothesis about doctors' hands, without the answer.
      limited_effort:
        content_blocks:
        - Look at the dramatic change in death rates. What does this tell us about Semmelweis's hypothesis?
      off_topic:
        content_blocks:
        - Let's analyze the data. Death rates dropped from 10% to 2%. What does this mean?
  - step_id: pick_hypothesis
    title: Spot the Testable Hypothesis
    content_blocks:
    - 'Score so far: **{{metadata.score}}**'
    question_type: multiple_choice
    question: Which of these is a testable hypothesis?
    choices:
    - {id: a, text: "Childbed fever is a mystery we will never understand."}
    - {id: b, text: "If doctors wash with chlorinated lime, fewer mothers will die of childbed fever."}
    - {id: c, text: "Semmelweis was a better doctor than his colleagues."}
    answer: b
    hints:
    - attempt: 1
      text: "💡 A testable hypothesis predicts something you could measure."
      counts_as_attempt: true
    transitions:
      correct:
        content_blocks:
        - 'Right: it predicts a measurable result (the death rate) that an experiment can check.'
        metadata_add:
          score: n+1
        next_section_and_step: section_2:step_1
      incorrect:
        content_blocks:
        - 'Not quite: which option makes a prediction you could check with data?'
- section_id: section_2
  title: Design Your Own Experiment
  steps:
  - step_id: step_1
    title: Newton's Light Experiment
    content_blocks:
    - '## Newton''s Light Experiment'
    - Let's explore another famous case, then YOU'LL design an experiment!
    - ''
    - '**The Observation (1660s):**'
    - Isaac Newton observed that sunlight passing through a prism splits into rainbow colors.
    - ''
    - '**The Common Belief:**'
    - Most people thought the prism was adding color to the light, like stained glass adds color.
    - ''
    - '**Newton''s Hypothesis:**'
    - 'White light is actually MADE of all the colors combined, and the prism just separates them.'
    question: Design an experiment that could test whether the colors are already in white light or are created by the prism. What would you do?
    tokens_for_ai: |
      Grade whether their experiment would tell the two explanations apart.
      Newton recombined the colors with a second prism into white light.
    bucket_criteria:
      excellent_design: "Recombines the colors into white light, or passes one color through a second prism and shows it stays unchanged."
      creative_approach: "A different design that would still tell the two explanations apart."
      partial_understanding: "Has an idea, but it would not clearly distinguish the explanations."
      limited_effort: "Very brief."
      off_topic: "Does not engage the question."
    hints:
    - attempt: 1
      text: "💡 If the prism CREATES color, could you ever get white light back from the colors?"
      counts_as_attempt: true
    - attempt: 2
      text: "💡 What would happen if the separated colors went through a second prism?"
      counts_as_attempt: true
    feedback_tokens_for_ai: |
      If they propose recombining colors, that's what Newton did. Otherwise,
      judge whether their design distinguishes the two hypotheses.
    buckets:
    - excellent_design
    - creative_approach
    - partial_understanding
    - limited_effort
    - off_topic
    transitions:
      excellent_design:
        ai_feedback:
          tokens_for_ai: Praise their design and relate it to what Newton actually did.
        metadata_add:
          score: n+3
        next_section_and_step: section_2:step_2
      creative_approach:
        ai_feedback:
          tokens_for_ai: Say how their design tells the explanations apart, then mention Newton's second prism.
        metadata_add:
          score: n+2
        next_section_and_step: section_2:step_2
      partial_understanding:
        ai_feedback:
          tokens_for_ai: 'Ask: if the prism creates color, could you reverse the process? If light contains the colors, could you recombine them?'
      limited_effort:
        content_blocks:
        - Take time to think creatively! How could you test whether colors come from the light or from the prism?
      off_topic:
        content_blocks:
        - Let's focus on designing an experiment about light and prisms.
  - step_id: step_2
    title: Identifying Variables
    content_blocks:
    - '## Identifying Variables'
    - Newton did use a second prism to recombine the colors back into white light.
    - ''
    - '**Understanding Variables:**'
    - '- **Independent variable:** What YOU change'
    - '- **Dependent variable:** What you MEASURE'
    - '- **Control variables:** What you keep THE SAME'
    - ''
    - '**Example scenario:** You want to test if plants grow faster with music.'
    - '- 10 plants with music'
    - '- 10 plants without music'
    - '- All plants get same water, light, soil, and temperature'
    - '- Measure growth after 2 weeks'
    question: Identify the independent variable, dependent variable, and control variables in this plant experiment.
    tokens_for_ai: Grade the three variables they name.
    bucket_criteria:
      correct: "Names all three correctly."
      partial_understanding: "Two of three correct."
      incorrect: "Swaps independent and dependent, or names none correctly."
      limited_effort: "Very brief or incomplete."
      off_topic: "Does not engage the question."
    required_elements:
    - "independent variable: music (present or absent)"
    - "dependent variable: plant growth"
    - "control variables: water, light, soil, temperature (any of them)"
    feedback_tokens_for_ai: |
      If they confuse independent and dependent: independent is what the
      experimenter changes, dependent is what responds.
    buckets:
    - correct
    - partial_understanding
    - incorrect
    - limited_effort
    - off_topic
    transitions:
      correct:
        ai_feedback:
          tokens_for_ai: "Praise them; variables are a crucial concept in experimental design."
        metadata_add:
          score: n+2
        next_section_and_step: section_3:step_1
      partial_understanding:
        ai_feedback:
          tokens_for_ai: Say which variables they got right and ask again about the missing one, without the answer.
      incorrect:
        content_blocks:
        - '**Tip:** The INDEPENDENT variable is what the experimenter changes on purpose.'
        - The DEPENDENT variable is what you measure to see the effect.
        - CONTROL variables are kept the same so they don't interfere.
      limited_effort:
        content_blocks:
        - 'Try to identify each type: What are you changing? What are you measuring? What are you keeping the same?'
      off_topic:
        content_blocks:
        - Let's focus on identifying the different types of variables in this experiment.
- section_id: section_3
  title: Avoiding Bias and Errors
  steps:
  - step_id: step_1
    title: Recognizing Experimental Bias
    content_blocks:
    - '## Recognizing Experimental Bias'
    - 'Score so far: **{{metadata.score}}**'
    - ''
    - '**Scenario:** A pharmaceutical company tests a new headache medicine.'
    - '- Group A: 100 patients receive the new medicine'
    - '- Group B: 100 patients receive nothing'
    - '- Researchers record who reports headache relief'
    - ''
    - '**Results:** Group A 80% report relief; Group B 30%.'
    - ''
    - The company concludes the medicine works!
    question: Is there a problem with this experimental design? What's missing or problematic?
    tokens_for_ai: |
      Problems: Group B gets nothing instead of a placebo (placebo effect
      uncontrolled); patients & researchers know who got what (no blinding).
    bucket_criteria:
      identified_placebo: "Says Group B should get a fake pill (placebo), or names the placebo effect."
      identified_blinding: "Says patients and/or researchers should not know who got the medicine."
      partial_understanding: "Senses unfairness but cannot say what is missing."
      incorrect: "Sees no problem with the design."
      limited_effort: "Very brief."
      off_topic: "Does not engage the question."
    hints:
    - attempt: 1
      text: "💡 Is it fair to compare people who GET something with people who get NOTHING?"
      counts_as_attempt: true
    - attempt: 2
      text: "💡 What if people feel better just because they believe they're being treated?"
      counts_as_attempt: true
    feedback_tokens_for_ai: |
      People often feel better just because they think they're treated; that's
      why we need placebo controls and blind studies.
    buckets:
    - identified_placebo
    - identified_blinding
    - partial_understanding
    - incorrect
    - limited_effort
    - off_topic
    transitions:
      identified_placebo:
        ai_feedback:
          tokens_for_ai: Praise them for spotting the placebo effect; explain why placebos matter in medical research.
        metadata_add:
          score: n+3
        next_section_and_step: section_3:pick_blinding
      identified_blinding:
        ai_feedback:
          tokens_for_ai: Praise the catch; explain how blinding prevents bias in patients and researchers.
        metadata_add:
          score: n+3
        next_section_and_step: section_3:pick_blinding
      partial_understanding:
        ai_feedback:
          tokens_for_ai: Guide them toward the placebo effect, without naming it.
      incorrect:
        content_blocks:
        - '**Hint:** Think about the psychological effect of KNOWING you''re getting medicine.'
      limited_effort:
        content_blocks:
        - 'Think carefully: what did Group B receive, and why might that matter?'
      off_topic:
        content_blocks:
        - Let's analyze this medical experiment. Is the design fair and unbiased?
  - step_id: pick_blinding
    title: Name That Design
    question_type: multiple_choice
    question: Neither the patients nor the researchers know who got the real medicine and who got the placebo. What is this design called?
    choices:
    - {id: a, text: "Single-blind"}
    - {id: b, text: "Double-blind"}
    - {id: c, text: "Open-label"}
    answer: b
    transitions:
      correct:
        content_blocks:
        - 'Yes: double-blind. Hiding it from researchers too keeps their expectations out of the results.'
        metadata_add:
          score: n+1
        next_section_and_step: section_3:step_2
      incorrect:
        content_blocks:
        - 'Not quite: single-blind hides it from patients only; open-label hides it from no one.'
  - step_id: step_2
    title: Scientific Integrity
    content_blocks:
    - '## Scientific Integrity'
    - '**Key principles for good science:**'
    - ✓ **Use controls** - Compare to a baseline or control group
    - ✓ **Use placebos** - Control for psychological effects
    - ✓ **Blind studies** - Subjects don't know if they got real treatment
    - ✓ **Double-blind** - Researchers also don't know (prevents their bias)
    - ✓ **Replicate** - Repeat experiments to confirm results
    - ✓ **Peer review** - Other scientists check your work
    - ✓ **Large sample sizes** - More data = more reliable
    - ✓ **Account for confounding variables** - What else might affect results?
    question: Why is it important for other scientists to be able to replicate (repeat) an experiment? What purpose does replication serve in science?
    tokens_for_ai: Grade their understanding of why replication matters.
    bucket_criteria:
      insightful: "Names several purposes: rules out chance, catches errors or fraud, tests other conditions, builds confidence."
      correct_understanding: "Says replication verifies the result is real."
      partial_understanding: "General idea, no clear purpose."
      limited_effort: "Very brief."
      off_topic: "Does not engage the question."
    feedback_tokens_for_ai: |
      Connect replication & peer review to why science corrects itself and
      why we can trust scientific consensus.
    buckets:
    - insightful
    - correct_understanding
    - partial_understanding
    - limited_effort
    - off_topic
    transitions:
      insightful:
        ai_feedback:
          tokens_for_ai: Praise their grasp of science as a self-correcting system.
        metadata_add:
          score: n+3
        next_section_and_step: section_4:step_1
      correct_understanding:
        ai_feedback:
          tokens_for_ai: Confirm replication verifies results; add any benefits they didn't mention.
        metadata_add:
          score: n+2
        next_section_and_step: section_4:step_1
      partial_understanding:
        ai_feedback:
          tokens_for_ai: Explain how replication catches errors and builds confidence.
        metadata_add:
          score: n+1
        next_section_and_step: section_4:step_1
      limited_effort:
        content_blocks:
        - Think about what happens if only ONE person does an experiment. How do we know if their result was accurate?
      off_topic:
        content_blocks:
        - Let's focus on why repeating experiments is important in science.
- section_id: section_4
  title: Reflection and Conclusion
  steps:
  - step_id: step_1
    title: Congratulations!
    content_blocks:
    - '## Congratulations, Scientist! 🔬'
    - You've completed the Scientific Method Explorer!
    - ''
    - '**Your score: {{metadata.score}}**'
    - ''
    - '**What you''ve learned:**'
    - ✓ The steps of the scientific method
    - ✓ How to form testable hypotheses
    - ✓ Experimental design principles
    - ✓ Identifying variables (independent, dependent, control)
    - ✓ The importance of controls, placebos & blinding
    - ✓ Why replication and peer review matter
    - ''
    - '**Famous scientists you studied:** Ignaz Semmelweis (handwashing) & Isaac Newton (nature of light)'
    - ''
    - 'These principles apply whether you''re testing a new technology, debugging code (forming and testing hypotheses!), evaluating health claims or understanding climate science.'
    question: How might you apply scientific thinking in your own life or studies? Give an example of a question you could investigate using the scientific method.
    tokens_for_ai: Reflection question. Accept any thoughtful application of the scientific method to a real question.
    bucket_criteria:
      excellent_application: "A specific, testable question with a clear method."
      good_application: "A reasonable area to apply it, less specific."
      basic_reflection: "General but genuine."
      limited_effort: "Very brief."
      off_topic: "Does not engage the question."
    feedback_tokens_for_ai: |
      Personal, encouraging feedback on their idea; encourage them to actually
      investigate something scientifically.
    buckets:
    - excellent_application
    - good_application
    - basic_reflection
    - limited_effort
    - off_topic
    transitions:
      excellent_application:
        ai_feedback:
          tokens_for_ai: Praise their testable question and encourage them to investigate it!
        metadata_add:
          activity_completed: 'true'
      good_application:
        ai_feedback:
          tokens_for_ai: Praise it and suggest how to make their investigation more rigorous.
        metadata_add:
          activity_completed: 'true'
      basic_reflection:
        ai_feedback:
          tokens_for_ai: Thank them and summarize the key scientific principles they learned.
        metadata_add:
          activity_completed: 'true'
      limited_effort:
        ai_feedback:
          tokens_for_ai: Acknowledge their completion and encourage scientific thinking in daily life.
        metadata_add:
          activity_completed: 'true'
      off_topic:
        content_blocks:
        - Think about how you could use scientific thinking in your own investigations. What question might you explore?
        next_section_and_step: section_4:step_1
