title: "Game Theory in Python"
description: "Code the Prisoner's Dilemma in Python: a payoff dictionary, a lookup, a one-round simulator & Tit-for-Tat."
kind: "lesson"
default_max_attempts_per_step: 3
classifier_model: "MODEL_1"
feedback_model: "MODEL_1"
tokens_for_ai_rubric: |
  Grade Python code implementing game theory. Any working approach counts;
  judge the ideas, not one exact syntax.

# Wrong answers stay on their step (partial_understanding & incorrect carry no
# next_section_and_step), so attempts count & hints escalate: a per-step
# *_tries counter picks which hint shows.

sections:
  - section_id: introduction
    title: Programming Game Theory in Python
    steps:
      - step_id: welcome
        title: Code Meets Strategy
        content_blocks:
          - "# Game Theory Programming with Python 🐍🎮"
          - ""
          - "**Learn Python by implementing game theory!**"
          - ""
          - "You'll learn to:"
          - "✓ Represent games as data structures"
          - "✓ Implement payoff matrices"
          - "✓ Code a Prisoner's Dilemma simulation"
          - "✓ Write a strategy for repeated games"
          - ""
          - "**Prerequisites:**"
          - "- Basic Python knowledge (variables, functions, loops)"
          - "- Understanding of basic game theory (Nash Equilibrium, Prisoner's Dilemma)"
          - ""
          - "**Why this matters:**"
          - "- Learn to model strategic situations"
          - "- Practice data structures (dictionaries, tuples)"
          - "- Build simulations and experiments"
          - "- Apply theory to real code"
        question: Ready to implement game theory in Python?
        tokens_for_ai: "Any yes or willingness is 'ready'."
        allow_clarifying_questions: false
        buckets: [ready, set_language, off_topic]
        transitions:
          ready:
            metadata_add: {score: 0, concepts_mastered: 0}
            next_section_and_step: payoff_matrix:step_1
          set_language:
            content_blocks: ["Language preference updated."]
            metadata_add: {language: "the-users-response"}
            counts_as_attempt: false
          off_topic:
            content_blocks: ["Say \"ready\" when you'd like to start."]
            counts_as_attempt: false

  - section_id: payoff_matrix
    title: Representing Games as Data
    steps:
      - step_id: step_1
        title: Payoff Matrix Structure
        content_blocks:
          - "## Representing Payoff Matrices in Python 📊"
          - text: "_Progress: {{metadata.concepts_mastered}} of 4 concepts · {{metadata.score}} points_"
            show_if: {score_exists: true}
          - ""
          - "**The challenge:**"
          - "How do we represent a 2-player game in code?"
          - ""
          - "**Game structure:**"
          - "- Two players (Row, Column)"
          - "- Each has strategies (actions)"
          - "- Each outcome has payoffs for both players"
          - ""
          - "**Conceptual approach:**"
          - "A payoff matrix maps strategy pairs to payoff tuples"
          - "- Input: (player1_strategy, player2_strategy)"
          - "- Output: (player1_payoff, player2_payoff)"
          - ""
          - "**Data structure choice:**"
          - "Python dictionaries are perfect!"
          - "- Keys: tuples of strategy pairs"
          - "- Values: tuples of payoffs"
          - ""
          - "**The Prisoner's Dilemma's payoffs (years in prison, as negatives):**"
          - "- Both cooperate: (-1, -1)"
          - "- Both defect: (-2, -2)"
          - "- Player 1 cooperates, player 2 defects: (-3, 0)"
          - "- Player 1 defects, player 2 cooperates: (0, -3)"
        question: "Write Python code to create a dictionary representing the Prisoner's Dilemma payoff matrix. Use strategy pairs as keys (tuples like ('cooperate', 'defect')) and payoff tuples as values."
        tokens_for_ai: |
          Their Prisoner's Dilemma payoff dictionary. Expected entries:
          ('cooperate', 'cooperate'): (-1, -1), ('cooperate', 'defect'): (-3, 0),
          ('defect', 'cooperate'): (0, -3), ('defect', 'defect'): (-2, -2).
          Any variable name & strategy spelling counts.
        bucket_criteria:
          correct: "A dictionary with all four strategy pairs mapped to the right payoff pairs."
          partial_understanding: "The right shape with a slip: a payoff wrong or swapped, an outcome missing, or non-tuple keys."
          incorrect: "Not a mapping from strategy pairs to payoffs."
          off_topic: "Not about the task."
        required_elements:
          - "a dictionary keyed by (player 1 strategy, player 2 strategy) pairs"
          - "all four strategy combinations"
          - "each value holds both payoffs, player 1's first, as given"
        buckets: [correct, partial_understanding, incorrect, set_language, off_topic]
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Praise their dictionary; show one lookup, e.g. matrix[('cooperate', 'defect')] gives (-3, 0)."
            metadata_add: {score: "n+2", concepts_mastered: "n+1"}
            next_section_and_step: payoff_matrix:lookup_check
          partial_understanding:
            metadata_add: {matrix_tries: "n+1"}
            content_blocks:
              - text: "💡 Hint: check all four pairs are there, and that player 1's payoff comes first in each value."
                show_if: {matrix_tries_lt: 2}
              - text: "💡 Hint: one entry looks like `('cooperate', 'cooperate'): (-1, -1)`. Write the other three the same way."
                show_if: {matrix_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Name the one missing or wrong entry. Show the full dictionary only if metadata.matrix_tries is 3 or more."
          incorrect:
            metadata_add: {matrix_tries: "n+1"}
            content_blocks:
              - text: "💡 Hint: start with `game = {}`; each key is a tuple of two strategies, each value a tuple of two payoffs."
                show_if: {matrix_tries_lt: 2}
              - text: "💡 Hint: one entry looks like `('cooperate', 'cooperate'): (-1, -1)`. Write the other three the same way."
                show_if: {matrix_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Explain why a dict with tuple keys fits a payoff matrix. Show the full dictionary only if metadata.matrix_tries is 3 or more."
          set_language:
            content_blocks: ["Language preference updated."]
            metadata_add: {language: "the-users-response"}
            counts_as_attempt: false
          off_topic:
            content_blocks: ["Let's build that payoff dictionary: four strategy pairs, four payoff pairs."]

      - step_id: lookup_check
        title: "Quick Check: Reading the Matrix"
        question_type: multiple_choice
        question: "With that dictionary in `game`, what is `game[('defect', 'cooperate')]`?"
        choices:
          - {id: a, text: "(-3, 0)"}
          - {id: b, text: "(0, -3)"}
          - {id: c, text: "(-1, -1)"}
          - {id: d, text: "(-2, -2)"}
        answer: b
        transitions:
          correct:
            content_blocks: ["Right: player 1 defects & walks free (0); player 2 cooperates & gets 3 years (-3)."]
            metadata_add: {score: "n+1"}
            next_section_and_step: payoff_matrix:step_2
          incorrect:
            content_blocks: ["Not quite: the key's first strategy is player 1's, & so is the value's first payoff."]

      - step_id: step_2
        title: Querying the Matrix
        content_blocks:
          - "## Using the Payoff Matrix 🔍"
          - text: "_Progress: {{metadata.concepts_mastered}} of 4 concepts · {{metadata.score}} points_"
            show_if: {score_exists: true}
          - ""
          - "**Now that you have a payoff matrix, let's use it!**"
          - ""
          - "**Task:** Write a function that determines outcomes"
          - ""
          - "**Function requirements:**"
          - "- Name: `get_payoffs`"
          - "- Parameters: `payoff_matrix`, `player1_action`, `player2_action`"
          - "- Returns: tuple of (player1_payoff, player2_payoff)"
          - ""
          - "**Think about:**"
          - "- How do you access dictionary values?"
          - "- How do you build the lookup key from the two actions?"
        question: "Write a Python function called `get_payoffs` that takes a payoff matrix dictionary and two player actions, then returns the payoff tuple for that strategy combination."
        tokens_for_ai: |
          Their get_payoffs function. Expected: return payoff_matrix[(player1_action, player2_action)].
          Parameter names may differ; matrix.get((a, b)) or matrix[a, b] count too.
        bucket_criteria:
          correct: "Takes the matrix & both actions and returns the payoffs for that pair."
          partial_understanding: "Right idea with one slip: the key isn't the pair, the actions are swapped, or it prints instead of returning."
          incorrect: "No function, or no dictionary lookup."
          off_topic: "Not about the task."
        required_elements:
          - "a function get_payoffs taking the matrix & both actions"
          - "looks up the pair (player 1 action, player 2 action)"
          - "returns that payoff tuple"
        buckets: [correct, partial_understanding, incorrect, set_language, off_topic]
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Praise their function; e.g. get_payoffs(game, 'cooperate', 'defect') returns (-3, 0)."
            metadata_add: {score: "n+2", concepts_mastered: "n+1"}
            next_section_and_step: simulation:step_1
          partial_understanding:
            metadata_add: {lookup_tries: "n+1"}
            content_blocks:
              - text: "💡 Hint: your dictionary's keys are tuples. What tuple do the two actions make?"
                show_if: {lookup_tries_lt: 2}
              - text: "💡 Hint: build the key `(player1_action, player2_action)`, look it up, & return what you find."
                show_if: {lookup_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Name the one missing or wrong piece. Show a working function only if metadata.lookup_tries is 3 or more."
          incorrect:
            metadata_add: {lookup_tries: "n+1"}
            content_blocks:
              - text: "💡 Hint: `def get_payoffs(payoff_matrix, player1_action, player2_action):` then one line that looks up & returns."
                show_if: {lookup_tries_lt: 2}
              - text: "💡 Hint: build the key `(player1_action, player2_action)`, look it up, & return what you find."
                show_if: {lookup_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Explain how a dictionary lookup by tuple key works. Show a working function only if metadata.lookup_tries is 3 or more."
          set_language:
            content_blocks: ["Language preference updated."]
            metadata_add: {language: "the-users-response"}
            counts_as_attempt: false
          off_topic:
            content_blocks: ["Let's write `get_payoffs`: the matrix and two actions in, a payoff tuple out."]

  - section_id: simulation
    title: Simulating Strategic Interactions
    steps:
      - step_id: step_1
        title: One-Shot Game Simulator
        content_blocks:
          - "## Simulating Game Outcomes 🎲"
          - text: "_Progress: {{metadata.concepts_mastered}} of 4 concepts · {{metadata.score}} points_"
            show_if: {score_exists: true}
          - ""
          - "**Building a simple game simulator**"
          - ""
          - "**Requirements:**"
          - "- Function name: `play_game`"
          - "- Parameters: `payoff_matrix`, `strategy1`, `strategy2`"
          - "- Should call your `get_payoffs` function"
          - "- Print the outcome in a readable format"
          - "- Return the payoffs"
          - ""
          - "**Example output format:**"
          - "```"
          - "Player 1 chose: cooperate"
          - "Player 2 chose: defect"
          - "Payoffs: Player 1 = -3, Player 2 = 0"
          - "```"
          - ""
          - "**Conceptual flow:**"
          - "1. Get payoffs using your get_payoffs function"
          - "2. Display what each player chose"
          - "3. Display the resulting payoffs"
          - "4. Return the payoffs for further use"
        question: "Write a `play_game` function that simulates one round of a game, prints the outcome, and returns the payoffs. Use your `get_payoffs` function from earlier."
        tokens_for_ai: "Their play_game function: payoffs from get_payoffs, both choices & payoffs printed, payoffs returned. Output wording may differ."
        bucket_criteria:
          correct: "Calls get_payoffs, prints both choices & both payoffs, returns the payoffs."
          partial_understanding: "Most of it: missing the print, the return, or doing the lookup again instead of calling get_payoffs."
          incorrect: "No function, or one that doesn't simulate a round."
          off_topic: "Not about the task."
        required_elements:
          - "gets the payoffs by calling get_payoffs"
          - "prints both players' choices & payoffs"
          - "returns the payoffs"
        buckets: [correct, partial_understanding, incorrect, set_language, off_topic]
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Praise the function composition: play_game reuses get_payoffs, prints for people & returns for code."
            metadata_add: {score: "n+2", concepts_mastered: "n+1"}
            next_section_and_step: repeated_games:step_1
          partial_understanding:
            metadata_add: {simulate_tries: "n+1"}
            content_blocks:
              - text: "💡 Hint: check the four steps of the conceptual flow: which one is missing?"
                show_if: {simulate_tries_lt: 2}
              - text: "💡 Hint: printing shows the result to people; `return` hands it to code. A simulator needs both."
                show_if: {simulate_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Name the one missing piece. Show a complete function only if metadata.simulate_tries is 3 or more."
          incorrect:
            metadata_add: {simulate_tries: "n+1"}
            content_blocks:
              - text: "💡 Hint: start with `payoffs = get_payoffs(payoff_matrix, strategy1, strategy2)`; the rest is printing & returning."
                show_if: {simulate_tries_lt: 2}
              - text: "💡 Hint: printing shows the result to people; `return` hands it to code. A simulator needs both."
                show_if: {simulate_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Explain the four-step flow against their code. Show a complete function only if metadata.simulate_tries is 3 or more."
          set_language:
            content_blocks: ["Language preference updated."]
            metadata_add: {language: "the-users-response"}
            counts_as_attempt: false
          off_topic:
            content_blocks: ["Let's write `play_game`: look up, print, return."]

  - section_id: repeated_games
    title: Repeated Game Strategies
    steps:
      - step_id: step_1
        title: Tit-for-Tat Strategy
        content_blocks:
          - "## Implementing Strategic Behavior 🔄"
          - text: "_Progress: {{metadata.concepts_mastered}} of 4 concepts · {{metadata.score}} points_"
            show_if: {score_exists: true}
          - ""
          - "**The Tit-for-Tat Strategy:**"
          - "1. Start with cooperation"
          - "2. Then copy opponent's previous move"
          - ""
          - "**Function requirements:**"
          - "- Name: `tit_for_tat`"
          - "- Parameter: `opponent_last_move` (None on the first move)"
          - "- Returns: 'cooperate' or 'defect'"
          - ""
          - "**Why this is powerful:**"
          - "- Nice (starts with cooperation)"
          - "- Retaliatory (punishes defection)"
          - "- Forgiving (returns to cooperation)"
          - "- Simple, and it won Axelrod's tournament"
        question: "Write a `tit_for_tat` function that takes an opponent's last move (or None for first round) and returns the appropriate strategy according to Tit-for-Tat logic."
        tokens_for_ai: |
          Their tit_for_tat function: 'cooperate' when opponent_last_move is None,
          else the opponent's last move. if/else, a conditional expression or
          `opponent_last_move or 'cooperate'` all count.
        bucket_criteria:
          correct: "Cooperates on the first move & copies the opponent's last move after."
          partial_understanding: "One half right: never handles None, or always cooperates, or always defects after the first move."
          incorrect: "Not a strategy function, or logic unrelated to the opponent's move."
          off_topic: "Not about the task."
        required_elements:
          - "cooperates on the first move (opponent_last_move is None)"
          - "otherwise returns the opponent's last move"
        buckets: [correct, partial_understanding, incorrect, set_language, off_topic]
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Celebrate: nice, retaliatory & forgiving in a few lines. Show a short usage example over three rounds."
            metadata_add: {score: "n+2", concepts_mastered: "n+1", activity_completed: "true"}
            next_section_and_step: repeated_games:wrap_up
          partial_understanding:
            metadata_add: {tft_tries: "n+1"}
            content_blocks:
              - text: "💡 Hint: two cases. What should happen when there is no last move yet, and what after?"
                show_if: {tft_tries_lt: 2}
              - text: "💡 Hint: `if opponent_last_move is None:` cooperate; otherwise hand back what they played."
                show_if: {tft_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Name the half that's missing. Show a complete function only if metadata.tft_tries is 3 or more."
          incorrect:
            metadata_add: {tft_tries: "n+1"}
            content_blocks:
              - text: "💡 Hint: the function's only input is the opponent's last move; its answer depends only on that."
                show_if: {tft_tries_lt: 2}
              - text: "💡 Hint: `if opponent_last_move is None:` cooperate; otherwise hand back what they played."
                show_if: {tft_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Explain Tit-for-Tat's two rules against their code. Show a complete function only if metadata.tft_tries is 3 or more."
          set_language:
            content_blocks: ["Language preference updated."]
            metadata_add: {language: "the-users-response"}
            counts_as_attempt: false
          off_topic:
            content_blocks: ["Let's write `tit_for_tat`: cooperate first, then copy."]

      - step_id: wrap_up
        title: Game Over
        content_blocks:
          - "# Well Played! 🏆"
          - text: "You coded **{{metadata.concepts_mastered}} of 4** concepts & scored **{{metadata.score}}** points."
            show_if: {score_exists: true}
          - ""
          - "You represented a game as data, queried it, simulated a round & wrote a strategy."
          - "**Next:** loop `play_game` over 100 rounds with `tit_for_tat` against an always-defect strategy & total the payoffs."
