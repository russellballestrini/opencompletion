title: "Revolutionary War: What Happened"
description: "The facts of the American Revolution, 1763-1783: causes, battles, people and the peace, with quick quizzes."
kind: "lesson"
default_max_attempts_per_step: 3
tokens_for_ai_rubric: "Learners are about 13. Grade generously: accept any accurate detail beyond the ones listed, and any defensible reading where historians disagree. Never mark an answer down for naming Loyalist, enslaved or Native American perspectives."
sections:
  - section_id: "section_1"
    title: "Introduction to the Revolutionary War"
    steps:
      - step_id: "step_1"
        title: "What is the Revolutionary War?"
        content_blocks:
          - "# The Revolutionary War: What Happened 🇺🇸"
          - "Welcome! In this lesson we'll get the facts straight: causes, battles, people and the peace."
          - "The American Revolutionary War (1775-1783), also called the American War of Independence, was fought between Great Britain and thirteen of its North American colonies, which became the United States."
        question: "What do you already know about the American Revolutionary War?"
        tokens_for_ai: "Grade whether the learner shares anything accurate about the war. Any accurate fact counts."
        bucket_criteria:
          correct: "Shares at least one accurate fact."
          partial_understanding: "Shares something mostly inaccurate, or only says \"not much\"."
          off_topic: "Does not talk about the war."
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm the specific thing they got right in one or two sentences, then add one detail they did not mention."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what is good in their answer, then ask one question that would take it further."
          off_topic:
            content_blocks:
              - "Let's stay with the Revolutionary War: have a go at the question above. 🙂"

      - step_id: "step_2"
        title: "Importance of the Revolutionary War"
        content_blocks:
          - "The war ended British rule over the thirteen colonies and created the United States, a republic governed by elected representatives."
          - "Not everyone agreed: Patriots wanted independence, Loyalists (perhaps one colonist in five) stayed loyal to the king, and many enslaved people and Native nations sided with Britain, which some saw as the better hope for their freedom or land."
        question: "Why is the American Revolutionary War important?"
        tokens_for_ai: "Grade the learner's facts about why the war mattered."
        bucket_criteria:
          correct: "Says it led to independence or the founding of the United States (any further reason is a bonus)."
          partial_understanding: "Calls it important without saying what it changed."
          off_topic: "Does not address why the war mattered."
        required_elements:
          - "it led to American independence or the creation of the United States"
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: What did the colonies become at the end of the war?"
          - attempt: 2
            text: "💡 Bigger hint: Who ruled the colonies before the war, and who after?"
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm the specific thing they got right in one or two sentences, then add one detail they did not mention."
