        question_type: multiple_choice
        question: "Which British general surrendered his army at Yorktown in 1781?"
        choices:
          - {id: a, text: "John Burgoyne"}
          - {id: b, text: "Charles Cornwallis"}
          - {id: c, text: "William Howe"}
          - {id: d, text: "Thomas Gage"}
        answer: b
        hints:
          - attempt: 1
            text: "💡 Hint: Burgoyne surrendered at Saratoga, not Yorktown."
          - attempt: 2
            text: "💡 Bigger hint: His name begins with C."
        transitions:
