              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what they got right, then ask one question that points at the idea they left out. Do not give the answer."
          off_topic:
            content_blocks:
              - "Let's stay with the Revolutionary War: have a go at the question above. 🙂"

  - section_id: "section_2"
    title: "Causes of the Revolutionary War"
    steps:
      - step_id: "step_1"
        title: "Taxation Without Representation"
        content_blocks:
          - "After the costly Seven Years' War (1756-1763), Parliament taxed the colonies directly: the Stamp Act (1765), the Townshend Acts (1767), the Tea Act (1773)."
          - "Colonists elected no members of Parliament, so many protested \"no taxation without representation\". British leaders answered that Parliament represented every subject of the empire (\"virtual representation\")."
        question: "What did \"taxation without representation\" mean, and how did it lead toward war?"
        tokens_for_ai: "Grade the learner's facts about taxation without representation."
        bucket_criteria:
          correct: "Explains that Parliament taxed colonists who elected no one to it, and that their protests over it fed the conflict."
          partial_understanding: "Explains the phrase or its effect, but not both."
          off_topic: "Does not address taxation without representation."
        required_elements:
          - "the colonists were taxed by a Parliament they elected no one to"
          - "this caused protest and anger that grew toward conflict"
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: Who passed the taxes, and did colonists vote for anyone there?"
          - attempt: 2
            text: "💡 Bigger hint: Think of how the colonists responded to the Stamp Act and the Tea Act."
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm the specific thing they got right in one or two sentences, then add one detail they did not mention."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what they got right, then ask one question that points at the idea they left out. Do not give the answer."
          off_topic:
            content_blocks:
              - "Let's stay with the Revolutionary War: have a go at the question above. 🙂"

      - step_id: "step_2"
        title: "The Intolerable Acts"
        content_blocks:
          - "Parliament answered in 1774 with the Coercive Acts, which colonists called the **Intolerable Acts**: Boston's port was closed until the tea was paid for, and Massachusetts lost much of its self-government."
          - "Twelve colonies sent delegates to the First Continental Congress (September 1774) to coordinate their resistance."
        question: "What were the Intolerable Acts, and how did they push the colonies toward war?"
        tokens_for_ai: "Grade the learner's facts about the Intolerable Acts."
        bucket_criteria:
          correct: "Says they were punishing laws after the Boston Tea Party (e.g. closing Boston's port) and that they united the colonies in resistance."
          partial_understanding: "Gets what they were or their effect, but not both."
          off_topic: "Does not address the Intolerable Acts."
        required_elements:
          - "they were laws punishing Massachusetts or Boston after the Tea Party"
          - "they pushed the colonies to unite or resist (e.g. the First Continental Congress)"
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: What had Boston just done that Parliament wanted to punish?"
          - attempt: 2
            text: "💡 Bigger hint: What did the colonies organize in September 1774?"
