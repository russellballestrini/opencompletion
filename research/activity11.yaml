          - "It announced that the thirteen colonies were now independent states, no longer under British rule, and listed their grievances against King George III."
        question: "What was the Declaration of Independence, and why was it significant?"
        tokens_for_ai: "Grade the learner's facts about the Declaration of Independence."
        bucket_criteria:
          correct: "Says it announced the colonies' independence from Britain (1776) and gives a reason it mattered."
          partial_understanding: "Says what it was without why it mattered, or the reverse."
          off_topic: "Does not address the Declaration of Independence."
        required_elements:
          - "it declared the colonies independent of Britain"
          - "a reason it mattered (it made the war a fight for independence, or stated the nation's ideals)"
