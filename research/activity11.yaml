  - section_id: "section_4"
    title: "Key Figures of the Revolutionary War"
    steps:
      - step_id: "step_1"
        title: "George Washington"
        content_blocks:
          - "George Washington, a Virginia planter and veteran of the Seven Years' War, was chosen by the Continental Congress in 1775 to lead its army. He later became the first President of the United States (1789-1797)."
        question_type: multiple_choice
        question: "What was George Washington's role during the Revolutionary War?"
        choices:
          - {id: a, text: "President of the United States"}
          - {id: b, text: "Commander-in-chief of the Continental Army"}
          - {id: c, text: "Author of the Declaration of Independence"}
          - {id: d, text: "American ambassador to France"}
        answer: b
        hints:
          - attempt: 1
            text: "💡 Hint: He became President only after the war."
          - attempt: 2
            text: "💡 Bigger hint: Think about who led the soldiers."
        transitions:
          correct:
            content_blocks:
              - "✅ He led the Continental Army from 1775 to 1783, and only later (1789) became the first President."
            metadata_add:
              score: "n+1"
          incorrect:
            metadata_add:
              misses_section_4_step_1: "n+1"
            content_blocks:
              - text: "Not quite."
                show_if: {misses_section_4_step_1_lt: 3}
              - text: "Not this time. The answer: Commander-in-chief of the Continental Army (he became President in 1789)."
                show_if: {misses_section_4_step_1_gte: 3}

      - step_id: "step_2"
        title: "Thomas Jefferson"
        content_blocks:
          - "Thomas Jefferson, a Virginia lawyer and planter, was 33 when the Continental Congress asked him to draft a document. He later became the third President of the United States (1801-1809)."
        question_type: multiple_choice
        question: "Which document is Thomas Jefferson best known for drafting?"
        choices:
          - {id: a, text: "The Declaration of Independence"}
          - {id: b, text: "The Treaty of Paris"}
          - {id: c, text: "The Bill of Rights"}
          - {id: d, text: "The Stamp Act"}
        answer: a
        hints:
          - attempt: 1
            text: "💡 Hint: It was written in 1776."
          - attempt: 2
            text: "💡 Bigger hint: It announced that the colonies were independent."
        transitions:
