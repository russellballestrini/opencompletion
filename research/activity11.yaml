          - "It was a protest against the tax and against the East India Company's tea monopoly, not against drinking tea."
        question: "What was the Boston Tea Party, and why was it significant?"
        tokens_for_ai: "Grade the learner's facts about the Boston Tea Party."
        bucket_criteria:
