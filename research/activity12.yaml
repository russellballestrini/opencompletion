          - "Think about how losing a whole army affects a country far from home."
        question: "Why do you think the Siege of Yorktown led to the end of the war?"
        tokens_for_ai: "Grade the learner's reasoning about why Yorktown ended the war. Any view backed by a reason counts; accept Loyalist and other perspectives as well as Patriot ones."
        bucket_criteria:
          correct: "Says the surrender of Cornwallis's army made Britain give up on winning and seek peace."
          partial_understanding: "Describes the siege without why it ended the war."
          off_topic: "Does not address why Yorktown ended the war."
        required_elements:
          - "Cornwallis's army surrendered"
          - "Britain lost the will to keep fighting and sought peace"
