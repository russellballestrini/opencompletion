  - section_id: "section_4"
    title: "Key Figures of the Revolutionary War"
    steps:
      - step_id: "step_1"
        title: "George Washington"
        content_blocks:
          - "George Washington commanded the Continental Army from 1775 to 1783, often with too few men, supplies or pay. He later became the first President of the United States."
          - "Think about what kept an army together through hard winters like Valley Forge (1777-1778)."
        question: "What qualities do you think made George Washington an effective leader, and how did they help the American forces?"
        tokens_for_ai: "Grade the learner's reasoning about Washington's leadership. Any view backed by a reason counts; accept Loyalist and other perspectives as well as Patriot ones."
        bucket_criteria:
          correct: "Names at least one quality and links it to how it helped the army."
          partial_understanding: "Names qualities without linking them to the war."
          off_topic: "Does not address Washington's leadership."
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: Think about the winter at Valley Forge."
          - attempt: 2
            text: "💡 Bigger hint: How might one leader keep a hungry, unpaid army from giving up?"
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm their reasoning, then add one perspective they did not mention (a Loyalist, an enslaved person, a Native nation, or a British official)."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what is good in their answer, then ask one question that would take it further."
          off_topic:
