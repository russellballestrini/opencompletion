  - section_id: "section_8"
    title: "Legacy of the Revolutionary War"
    steps:
      - step_id: "step_1"
        title: "Impact on the United States"
        content_blocks:
          - "The new nation built governments on written constitutions and elected representatives, and in 1791 added the Bill of Rights."
          - "Those words did not yet apply to everyone: slavery remained legal, and women and Native Americans were left out. Later movements used the same words to demand their rights."
          - "Look for the Revolution's ideas in how the country works today."
        question: "How do you think the principles of the Revolution shape the United States today?"
        tokens_for_ai: "Grade the learner's reasoning about the Revolution's principles today. Any view backed by a reason counts; accept Loyalist and other perspectives as well as Patriot ones."
        bucket_criteria:
          correct: "Names a principle and where it shows up today, with a reason."
          partial_understanding: "Names a principle without a present-day example."
          off_topic: "Does not address the Revolution's principles today."
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: Think about elections, rights or the Constitution."
          - attempt: 2
            text: "💡 Bigger hint: Which unfinished promises are people still working on?"
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm their reasoning, then add one perspective they did not mention (a Loyalist, an enslaved person, a Native nation, or a British official)."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what is good in their answer, then ask one question that would take it further."
          off_topic:
            content_blocks:
              - "Let's stay with the colonists: have a go at the question above. 🙂"

      - step_id: "step_2"
        title: "Influence on Other Nations"
        content_blocks:
          - "The Revolution inspired others: the French Revolution (1789), the Haitian Revolution (1791-1804) and independence movements across Latin America. Historians debate how much each borrowed from it."
          - "Think about what a successful revolution shows people elsewhere."
