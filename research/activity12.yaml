        question: "Why do you think the Declaration of Independence mattered so much to the colonists?"
        tokens_for_ai: "Grade the learner's reasoning about the Declaration's significance to colonists. Any view backed by a reason counts; accept Loyalist and other perspectives as well as Patriot ones."
        bucket_criteria:
