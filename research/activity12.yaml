title: "Revolutionary War: In the Colonists' Shoes"
description: "The same events as our fact lesson, seen from the inside: why colonists acted as they did, and what it changed."
kind: "lesson"
default_max_attempts_per_step: 3
tokens_for_ai_rubric: "Learners are about 13. Grade generously: accept any accurate detail beyond the ones listed, and any defensible reading where historians disagree. Never mark an answer down for naming Loyalist, enslaved or Native American perspectives."
sections:
  - section_id: "section_1"
    title: "Introduction to the Revolutionary War"
    steps:
      - step_id: "step_1"
        title: "What is the Revolutionary War?"
        content_blocks:
          - "# The Revolutionary War: In the Colonists' Shoes 🇺🇸"
          - "Welcome! In this lesson you'll step into the colonists' world and reason about why they acted as they did."
          - "The American Revolutionary War (1775-1783), also called the American War of Independence, was fought between Great Britain and thirteen of its North American colonies, which became the United States."
          - "Think about government, taxes and who got a say."
        question: "Why do you think many American colonists wanted to break away from British rule?"
        tokens_for_ai: "Grade the learner's reasoning about why colonists wanted independence. Any view backed by a reason counts; accept Loyalist and other perspectives as well as Patriot ones."
        bucket_criteria:
          correct: "Gives at least one reason (taxes, no representation, punishments, ideas about rights and self-government)."
          partial_understanding: "Gives a feeling with no reason, or one word."
          off_topic: "Does not address why colonists wanted independence."
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: What did colonists say about taxes passed in London?"
          - attempt: 2
            text: "💡 Bigger hint: Think about who made the laws, and whether colonists had a say."
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm their reasoning, then add one perspective they did not mention (a Loyalist, an enslaved person, a Native nation, or a British official)."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what is good in their answer, then ask one question that would take it further."
          off_topic:
            content_blocks:
              - "Let's stay with the colonists: have a go at the question above. 🙂"

      - step_id: "step_2"
        title: "Importance of the Revolutionary War"
        content_blocks:
          - "Independence ended British rule, but life changed differently for different people."
          - "Not everyone agreed: Patriots wanted independence, Loyalists (perhaps one colonist in five) stayed loyal to the king, and many enslaved people and Native nations sided with Britain, which some saw as the better hope for their freedom or land."
          - "Think about freedom, government and rights, and about who gained and who did not."
        question: "How do you think gaining independence changed the lives of the colonists?"
        tokens_for_ai: "Grade the learner's reasoning about how independence changed colonists' lives. Any view backed by a reason counts; accept Loyalist and other perspectives as well as Patriot ones."
        bucket_criteria:
          correct: "Names at least one change, with a reason or example."
          partial_understanding: "Says life changed without saying how."
          off_topic: "Does not address how independence changed colonists' lives."
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: Who made the laws before and after independence?"
          - attempt: 2
            text: "💡 Bigger hint: Did independence change life the same way for a merchant, a Loyalist and an enslaved person?"
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm their reasoning, then add one perspective they did not mention (a Loyalist, an enslaved person, a Native nation, or a British official)."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what is good in their answer, then ask one question that would take it further."
          off_topic:
            content_blocks:
              - "Let's stay with the colonists: have a go at the question above. 🙂"

  - section_id: "section_2"
    title: "Causes of the Revolutionary War"
    steps:
      - step_id: "step_1"
        title: "Taxation Without Representation"
        content_blocks:
          - "After the costly Seven Years' War (1756-1763), Parliament taxed the colonies directly: the Stamp Act (1765), the Townshend Acts (1767), the Tea Act (1773)."
          - "Colonists elected no members of Parliament, so many protested \"no taxation without representation\". British leaders answered that Parliament represented every subject of the empire (\"virtual representation\")."
          - "Imagine paying taxes with no say in how they are set or spent."
        question: "How do you think colonists felt about \"taxation without representation\", and why?"
        tokens_for_ai: "Grade the learner's reasoning about colonists' feelings about taxation without representation. Any view backed by a reason counts; accept Loyalist and other perspectives as well as Patriot ones."
        bucket_criteria:
          correct: "Names a feeling (anger, unfairness, distrust) and a reason linked to having no say."
          partial_understanding: "Names a feeling without a reason, or a reason without a feeling."
          off_topic: "Does not address colonists' feelings about taxation without representation."
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: How would you feel paying a tax you had no vote on?"
          - attempt: 2
            text: "💡 Bigger hint: Why did having no elected member in Parliament matter so much?"
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm their reasoning, then add one perspective they did not mention (a Loyalist, an enslaved person, a Native nation, or a British official)."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what is good in their answer, then ask one question that would take it further."
          off_topic:
            content_blocks:
              - "Let's stay with the colonists: have a go at the question above. 🙂"

      - step_id: "step_2"
        title: "The Intolerable Acts"
        content_blocks:
          - "Parliament answered in 1774 with the Coercive Acts, which colonists called the **Intolerable Acts**: Boston's port was closed until the tea was paid for, and Massachusetts lost much of its self-government."
          - "Twelve colonies sent delegates to the First Continental Congress (September 1774) to coordinate their resistance."
          - "Imagine your whole city punished for a protest some people made."
        question: "How do you think colonists felt about the Intolerable Acts, and why?"
        tokens_for_ai: "Grade the learner's reasoning about colonists' feelings about the Intolerable Acts. Any view backed by a reason counts; accept Loyalist and other perspectives as well as Patriot ones."
        bucket_criteria:
          correct: "Names a feeling and a reason (collective punishment, losing self-government, fear it could happen to other colonies)."
          partial_understanding: "Names a feeling without a reason."
          off_topic: "Does not address colonists' feelings about the Intolerable Acts."
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: Who was punished: only the tea-dumpers, or all of Boston?"
          - attempt: 2
            text: "💡 Bigger hint: Why might people in Virginia worry about laws aimed at Massachusetts?"
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Affirm their reasoning, then add one perspective they did not mention (a Loyalist, an enslaved person, a Native nation, or a British official)."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Say what is good in their answer, then ask one question that would take it further."
          off_topic:
            content_blocks:
              - "Let's stay with the colonists: have a go at the question above. 🙂"

  - section_id: "section_3"
    title: "Key Events of the Revolutionary War"
    steps:
      - step_id: "step_1"
        title: "The Boston Tea Party"
        content_blocks:
          - "On December 16, 1773, the Sons of Liberty dumped 342 chests of East India Company tea into Boston Harbor in protest against the Tea Act."
          - "Think about the message they wanted to send, and to whom."
        question: "Why do you think the colonists chose to protest by dumping tea into the harbor?"
        tokens_for_ai: "Grade the learner's reasoning about the choice of protest at the Boston Tea Party. Any view backed by a reason counts; accept Loyalist and other perspectives as well as Patriot ones."
        bucket_criteria:
          correct: "Gives a reason for this form of protest (refusing to pay the tax, a dramatic public message, stopping the tea from landing)."
          partial_understanding: "Says they were angry without explaining why this protest."
          off_topic: "Does not address the choice of protest at the Boston Tea Party."
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: If the tea had landed, what would someone have had to pay?"
          - attempt: 2
            text: "💡 Bigger hint: Who was the protest meant to be seen by?"
        transitions:
