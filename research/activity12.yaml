      - step_id: "step_2"
        title: "The Battle of Saratoga"
        content_blocks:
          - "At Saratoga, New York (September-October 1777), American forces defeated a British army, and General Burgoyne surrendered his whole army. In 1778 France signed an alliance with the United States, bringing troops, money and a navy."
          - "Think about what France could add that the Americans lacked."
        question: "Why do you think the Battle of Saratoga became the turning point of the war?"
        tokens_for_ai: "Grade the learner's reasoning about why Saratoga was a turning point. Any view backed by a reason counts; accept Loyalist and other perspectives as well as Patriot ones."
