              - "Let's stay with the colonists: have a go at the question above. 🙂"

      - step_id: "step_2"
        title: "Thomas Jefferson"
        content_blocks:
          - "Thomas Jefferson drafted the Declaration of Independence. He later became the third President of the United States."
          - "It claims that all men are created equal, with unalienable rights to life, liberty and the pursuit of happiness; that governments get their power from the consent of the governed; and that people may alter or abolish a government that destroys those rights."
          - "Jefferson himself enslaved more than 600 people over his lifetime, a contradiction people pointed out even then."
          - "Think about what those words meant to people at the time, and later."
        question: "How do you think the words of the Declaration of Independence inspired colonists and shaped the new nation?"
        tokens_for_ai: "Grade the learner's reasoning about the Declaration's influence. Any view backed by a reason counts; accept Loyalist and other perspectives as well as Patriot ones."
