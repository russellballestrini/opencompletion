      - step_id: "step_2"
        title: "The Battles of Lexington and Concord"
        content_blocks:
          - "On April 19, 1775, British troops marched to seize colonial weapons at Concord, Massachusetts. Shots at Lexington and fighting at Concord's North Bridge began the war."
          - "Think about how the relationship with Britain changed once shots were fired."
        question: "Why do you think the Battles of Lexington and Concord were so significant?"
        tokens_for_ai: "Grade the learner's reasoning about the significance of Lexington and Concord. Any view backed by a reason counts; accept Loyalist and other perspectives as well as Patriot ones."
        bucket_criteria:
          correct: "Says they turned protest into war (the first battles), with a reason it mattered."
          partial_understanding: "Says they mattered without saying how."
          off_topic: "Does not address the significance of Lexington and Concord."
        required_elements:
          - "they were the first fighting: protest became war"
        buckets: [correct, partial_understanding, off_topic]
        hints:
          - attempt: 1
            text: "💡 Hint: Before April 1775, were colonists and British troops at war?"
          - attempt: 2
