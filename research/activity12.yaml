  - section_id: "section_5"
    title: "Major Battles of the Revolutionary War"
    steps:
      - step_id: "step_1"
        title: "The Battle of Bunker Hill"
        content_blocks:
          - "At the Battle of Bunker Hill (June 17, 1775; mostly fought on nearby Breed's Hill) the British took the hill but lost over 1,000 men killed or wounded, far more than the colonial militia."
          - "Think about morale: how it felt to lose the hill, but hurt the enemy badly."
        question: "Why do you think the Battle of Bunker Hill mattered to the American forces, even though they lost?"
        tokens_for_ai: "Grade the learner's reasoning about Bunker Hill's significance for American forces. Any view backed by a reason counts; accept Loyalist and other perspectives as well as Patriot ones."
        bucket_criteria:
          correct: "Says it showed militia could stand up to British regulars, boosting confidence or resolve."
          partial_understanding: "Says it mattered without a reason."
          off_topic: "Does not address Bunker Hill's significance for American forces."
        required_elements:
          - "it showed colonial forces could fight the British army, which raised morale or resolve"
