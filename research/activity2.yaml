title: "Python Basics"
description: "Install Python, then write your first programs: output, variables, if statements, loops & functions."
kind: "lesson"
default_max_attempts_per_step: 3
tokens_for_ai_rubric: |
  A beginner's Python course. Any working Python counts; judge the ideas,
  not one exact syntax. Be friendly & encouraging.

# Wrong code stays on its step (partial_understanding & incorrect carry no
# next_section_and_step), so attempts count & hints escalate: a per-step
# *_tries counter picks which hint shows.

sections:
  - section_id: "section_1"
    title: "Introduction to Python"
    steps:
      - step_id: "step_1"
        title: "What is Python?"
        content_blocks:
          - "# Welcome to Python Basics 🐍"
          - "Python is a high-level, interpreted programming language known for its readability and versatility."
        question: "What do you know about Python so far? (Nothing yet is a fine answer!)"
        tokens_for_ai: "Any honest answer moves on: what they know, or that they're new."
        bucket_criteria:
          shares_knowledge: "Says something they know or have heard about Python."
          new_to_python: "Says they know little or nothing yet."
          off_topic: "Not about Python or their experience."
        buckets: [shares_knowledge, new_to_python, off_topic]
        transitions:
          shares_knowledge:
            metadata_add: {score: 0}
            ai_feedback:
              tokens_for_ai: "Build on what they said in two or three sentences; gently correct anything inaccurate."
          new_to_python:
            metadata_add: {score: 0}
            content_blocks:
              - "Perfect place to start: this course assumes nothing."
          off_topic:
            content_blocks:
              - "Let's stay with Python: what have you heard about it, if anything?"

      - step_id: "step_2"
        title: "Installing Python"
        content_blocks:
          - "To start coding in Python, you need to install it on your computer."
          - "You can download Python from the official website: https://www.python.org/downloads/"
          - "On Linux & macOS it's often there already: try `python3 --version` in a terminal."
        question: "Have you installed Python on your computer?"
        tokens_for_ai: "Did they install Python, not yet, or hit a problem?"
        bucket_criteria:
          installed: "Python is installed (or was already)."
          not_yet: "Haven't installed it yet, or can't on this device."
          having_trouble: "Tried and hit a problem."
          off_topic: "Not about installing Python."
        buckets: [installed, not_yet, having_trouble, off_topic]
        transitions:
          installed:
            content_blocks:
              - "Excellent! You are ready to start coding in Python."
          not_yet:
            content_blocks:
              - "No problem: you can follow along in an online Python shell (https://www.python.org/shell/) & install later."
          having_trouble:
            ai_feedback:
              tokens_for_ai: "Help with the problem they describe, step by step for their operating system. Mention an online shell works meanwhile."
          off_topic:
            content_blocks:
              - "Let's stay with installing Python: is it on your computer yet?"

  - section_id: "section_2"
    title: "Basic Python Syntax"
    steps:
      - step_id: "step_1"
        title: "Writing Your First Python Program"
        content_blocks:
          - "Let's write your first Python program."
          - "Open a text editor and type the following code:\n```python\nprint('Hello, World!')\n```"
          - "Save the file with a `.py` extension and run it using the Python interpreter, e.g. `python3 hello.py`."
        question: "Were you able to run the 'Hello, World!' program?"
        tokens_for_ai: "Did it run, or did they hit a problem?"
        bucket_criteria:
          ran_it: "It ran and printed Hello, World!"
          having_trouble: "An error, or they don't know how to run it."
          off_topic: "Not about running the program."
        buckets: [ran_it, having_trouble, off_topic]
        transitions:
          ran_it:
            content_blocks:
              - "Great! You've written and run your first Python program. 🎉"
          having_trouble:
            ai_feedback:
              tokens_for_ai: "Diagnose the error or step they describe & say exactly what to try next."
          off_topic:
            content_blocks:
              - "Let's stay with your first program: did `print('Hello, World!')` run?"

      - step_id: "step_2"
        title: "Variables and Data Types"
        content_blocks:
          - "In Python, you can store data in variables."
          - text: "_Score so far: {{metadata.score}}_"
            show_if: {score_exists: true}
          - "Python supports various data types such as integers, floats, strings, and booleans."
          - "Here's an example:\n```python\nx = 5\npi = 3.14\nname = 'Alice'\nis_student = True\n```"
        question: "Create a variable, assign it a value of your choice, and print it."
        tokens_for_ai: "Their Python code assigning a variable & printing it. Any name, value & type counts."
        bucket_criteria:
          correct: "Assigns a value to a variable and prints the variable."
          partial_understanding: "Assigns but never prints, prints a typed value instead of the variable, or a syntax slip."
          incorrect: "No variable assignment."
          off_topic: "Not about the task."
        required_elements:
          - "assigns a value to a variable name"
          - "prints the variable itself"
        buckets: [correct, partial_understanding, incorrect, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Excellent! You have successfully created a variable."
            metadata_add: {score: "n+1"}
          partial_understanding:
            metadata_add: {variable_tries: "n+1"}
            content_blocks: &variable_hints
              - text: "💡 Hint: two lines: one that stores a value with `=`, one that prints it."
                show_if: {variable_tries_lt: 2}
              - text: "💡 Hint: pass the variable's name to `print()` without quotes; quotes make it text."
                show_if: {variable_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Name the one missing or wrong piece. Show working code only if metadata.variable_tries is 3 or more."
          incorrect:
            metadata_add: {variable_tries: "n+1"}
            content_blocks: *variable_hints
            ai_feedback:
              tokens_for_ai: "Explain what a variable is in one sentence. Show working code only if metadata.variable_tries is 3 or more."
          off_topic:
            content_blocks:
              - "Let's stay with variables: make one and print it."

      - step_id: "step_3"
        title: "Quick Check: Data Types"
        question_type: multiple_choice
        question: "What type is the value `\"5\"`, quotes included?"
        choices:
          - {id: a, text: "int"}
          - {id: b, text: "float"}
          - {id: c, text: "str"}
          - {id: d, text: "bool"}
        answer: c
        transitions:
          correct:
            content_blocks:
              - "Right: quotes make it a string. `5` without them is an int, & `type(\"5\")` would tell you so."
            metadata_add: {score: "n+1"}
          incorrect:
            content_blocks:
              - "Not quite: look at the quotes around it."

  - section_id: "section_3"
    title: "Control Flow"
    steps:
      - step_id: "step_1"
        title: "If Statements"
        content_blocks:
          - "If statements allow you to execute code based on certain conditions."
          - text: "_Score so far: {{metadata.score}}_"
            show_if: {score_exists: true}
          - "Here's an example:\n```python\nx = 10\nif x > 5:\n    print('x is greater than 5')\nelse:\n    print('x is 5 or less')\n```"
        question: "Write an if statement that checks whether a number is positive and prints a message if it is."
        tokens_for_ai: "Their Python if statement for a positive number. A hard-coded number or input() both count; an else is optional."
        bucket_criteria:
          correct: "A condition true exactly for numbers above 0, printing a message when it holds."
          partial_understanding: "Right shape with a slip: >= 0 (zero isn't positive), no colon or indentation, nothing printed."
          incorrect: "No if statement, or a condition unrelated to positive."
          off_topic: "Not about the task."
        required_elements:
          - "a number to test"
          - "a condition true when the number is greater than 0"
          - "prints a message when it holds"
        buckets: [correct, partial_understanding, incorrect, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Great! You've written a correct if statement."
            metadata_add: {score: "n+1"}
          partial_understanding:
            metadata_add: {if_tries: "n+1"}
            content_blocks: &if_hints
              - text: "💡 Hint: is 0 positive? Pick the comparison that says no."
                show_if: {if_tries_lt: 2}
              - text: "💡 Hint: `if` + condition + `:`, then the indented `print()` on the next line."
                show_if: {if_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Name the one missing or wrong piece. Show working code only if metadata.if_tries is 3 or more."
          incorrect:
            metadata_add: {if_tries: "n+1"}
            content_blocks: *if_hints
            ai_feedback:
              tokens_for_ai: "Explain how an if statement tests a condition. Show working code only if metadata.if_tries is 3 or more."
          off_topic:
            content_blocks:
              - "Let's stay with if statements: test whether a number is positive."

      - step_id: "step_2"
        title: "For Loops"
        content_blocks:
          - "For loops allow you to iterate over a sequence of elements."
          - text: "_Score so far: {{metadata.score}}_"
            show_if: {score_exists: true}
          - "Here's an example:\n```python\nfor i in range(5):\n    print(i)\n```"
          - "That prints 0, 1, 2, 3 and 4: `range(5)` starts at 0 and stops *before* 5."
        question: "Write a for loop that prints the numbers from 1 to 10."
        tokens_for_ai: "Their Python for loop printing 1 to 10 inclusive. Any working loop counts."
        bucket_criteria:
          correct: "A for loop printing exactly 1 through 10."
          partial_understanding: "A loop off by one (0-9, 1-9, 0-10) or with a syntax slip."
          incorrect: "No loop (ten print lines), or one that can't run."
          off_topic: "Not about the task."
        required_elements:
          - "a for loop"
          - "prints 1 first & 10 last, every number between"
        buckets: [correct, partial_understanding, incorrect, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Excellent! You've written a correct for loop."
            metadata_add: {score: "n+1"}
          partial_understanding:
            metadata_add: {loop_tries: "n+1"}
            content_blocks: &loop_hints
              - text: "💡 Hint: `range()` can take a start too. Where should yours start and stop?"
                show_if: {loop_tries_lt: 2}
              - text: "💡 Hint: `range(start, stop)` stops *before* stop. To include 10, what must stop be?"
                show_if: {loop_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Name the one missing or wrong piece. Show working code only if metadata.loop_tries is 3 or more."
          incorrect:
            metadata_add: {loop_tries: "n+1"}
            content_blocks: *loop_hints
            ai_feedback:
              tokens_for_ai: "Explain how a for loop repeats its body. Show working code only if metadata.loop_tries is 3 or more."
          off_topic:
            content_blocks:
              - "Let's stay with for loops: print 1 to 10."

  - section_id: "section_4"
    title: "Functions"
    steps:
      - step_id: "step_1"
        title: "Defining Functions"
        content_blocks:
          - "Functions allow you to encapsulate code into reusable blocks."
          - text: "_Score so far: {{metadata.score}}_"
            show_if: {score_exists: true}
          - "Here's an example:\n```python\ndef greet(name):\n    print(f'Hello, {name}!')\n\ngreet('Alice')\n```"
          - "A function can also hand a value back to its caller with `return`."
        question: "Define a function that takes two numbers and returns their sum."
        tokens_for_ai: "Their Python function returning the sum of two parameters. Any names count."
        bucket_criteria:
          correct: "A function of two parameters that returns their sum."
          partial_understanding: "Prints the sum instead of returning it, one parameter, or a syntax slip."
          incorrect: "No function definition."
          off_topic: "Not about the task."
        required_elements:
          - "defines a function with two parameters"
          - "returns their sum, not only prints it"
        buckets: [correct, partial_understanding, incorrect, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Great! You've defined a correct function."
            metadata_add: {score: "n+1"}
          partial_understanding:
            metadata_add: {define_tries: "n+1"}
            content_blocks: &define_hints
              - text: "💡 Hint: `print` shows a value; `return` hands it back. This one should hand it back."
                show_if: {define_tries_lt: 2}
              - text: "💡 Hint: `def name(a, b):` then an indented line that returns a + b's result."
                show_if: {define_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Name the one missing or wrong piece. Show working code only if metadata.define_tries is 3 or more."
          incorrect:
            metadata_add: {define_tries: "n+1"}
            content_blocks: *define_hints
            ai_feedback:
              tokens_for_ai: "Explain how def defines a function. Show working code only if metadata.define_tries is 3 or more."
          off_topic:
            content_blocks:
              - "Let's stay with functions: two numbers in, their sum out."

      - step_id: "step_2"
        title: "Calling Functions"
        content_blocks:
          - "Once you've defined a function, you can call it to execute the code inside it."
          - text: "_Score so far: {{metadata.score}}_"
            show_if: {score_exists: true}
          - "Here's an example:\n```python\ndef square(n):\n    return n * n\n\nresult = square(4)\nprint(result)\n```"
        question: "Call the function you just defined with two numbers and print the result."
        tokens_for_ai: "Their Python call of a sum function with two arguments, printing what it returns. Repeating the definition is fine; print(add(2, 3)) counts."
        bucket_criteria:
          correct: "Calls their function with two numbers & prints the returned value."
          partial_understanding: "Calls it but never prints, or prints without calling, or a slip in the arguments."
          incorrect: "No call."
          off_topic: "Not about the task."
        required_elements:
          - "calls their function with two numbers"
          - "prints the value it returns"
        buckets: [correct, partial_understanding, incorrect, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Excellent! You've called the function correctly."
            metadata_add: {score: "n+1", activity_completed: "true"}
          partial_understanding:
            metadata_add: {call_tries: "n+1"}
            content_blocks: &call_hints
              - text: "💡 Hint: a call is the function's name with values in parentheses."
                show_if: {call_tries_lt: 2}
              - text: "💡 Hint: keep what it returns in a variable, then print that, or print the call directly."
                show_if: {call_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Name the one missing or wrong piece. Show working code only if metadata.call_tries is 3 or more."
          incorrect:
            metadata_add: {call_tries: "n+1"}
            content_blocks: *call_hints
            ai_feedback:
              tokens_for_ai: "Explain defining vs calling. Show working code only if metadata.call_tries is 3 or more."
          off_topic:
            content_blocks:
              - "Let's stay with calling: run your function on two numbers and print what comes back."

      - step_id: "step_3"
        title: "The End."
        content_blocks:
          - "# You Finished Python Basics! 🎉"
          - text: "Final score: **{{metadata.score}} of 6**."
            show_if: {score_exists: true}
          - "You can now print, store values, branch, loop & write functions."
          - "**Next:** combine them: a loop that calls your function on each number from 1 to 10."
