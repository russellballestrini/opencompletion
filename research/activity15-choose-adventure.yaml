# What our Activities gallery shows for this activity (optional: see SPEC.yaml).
title: "Escape Room II: A Secret Compartment"
description: "A longer escape: explore a locked room, open its safe, then decide whether to crack a second one."
kind: "game"
default_max_attempts_per_step: 30

# Metadata (true once found): key, password, coin, paper, safe_open &
# exit_key (the first safe), secret_map (the second safe);
# pick (this turn's choice), prize (the prize room's draw).
# Story steps keep our built-in clarifying bucket: a question about the
# room gets a hint & the question again.

tokens_for_ai_rubric: |
  You are a master storyteller. Retell this chat as one coherent, vivid escape story with a beginning, middle & end, shaped by the choices the player made & the narrator's replies.

sections:
  - section_id: "section_1"
    title: "The Escape Room Begins"
    steps:
      - step_id: "step_0"
        title: "Waking Up"
        content_blocks:
          - "You wake up in a dimly lit room with no memory of how you got there. The room is small and has a single door that is locked."

      - step_id: "step_1"
        title: "Explore"
        content_blocks:
          - "You see a rug on the floor, a bookshelf with a book, and a safe on the wall. There is also an exit door, locked tight."
          - text: "🔑 You carry a key."
            show_if:
              key: true
          - text: "🔐 You remember a password: ESCAPE123."
            show_if:
              password: true
          - text: "🪙 You carry an engraved coin."
            show_if:
              coin: true
          - text: "📜 You carry a folded paper: 1-8-9-5."
            show_if:
              paper: true
          - text: "🗝️ You hold the exit key!"
            show_if:
              exit_key: true
        # A pick among four things in the room: buttons, no model asked.
        question_type: multiple_choice
        question: "What do you do? 🤔"
        choices:
          - {id: rug, text: "Look under the rug"}
          - {id: book, text: "Examine the book"}
          - {id: safe, text: "Try to open the safe"}
          - {id: door, text: "Try to leave the room"}
        answer: [rug, book, safe, door]
        answer_mode: any
        buckets: [choose, unclear]
        mc_correct: choose
        mc_incorrect: unclear
        transitions:
          choose:
            metadata_tmp_add:
              pick: "the-users-response"
            counts_as_attempt: false
            next_section_and_step:
              - if:
                  pick_matches: "(?i)rug"
                goto: "section_2:step_1"
              - elif:
                  pick_matches: "(?i)book"
                goto: "section_3:step_1"
              - elif:
                  pick_matches: "(?i)safe"
                  safe_open: true
                goto: "section_4:step_2"
              - elif:
                  pick_matches: "(?i)safe"
                goto: "section_4:step_1"
              - else: true
                goto: "section_1:door"
          unclear:
            content_blocks:
              - "Pick one thing to try: the **rug**, the **book**, the **safe** or the **door**."
            counts_as_attempt: false
            next_section_and_step: "section_1:step_1"

      - step_id: "door"
        title: "The Exit Door"
        content_blocks:
          - text: "The exit key turns in the lock. 🚪 The door swings open!"
            show_if:
              exit_key: true
          - text: "The door won't budge: it needs a key you haven't found. Maybe the safe holds one? 🔒"
            show_if:
              exit_key_not_exists: true
        next_section_and_step:
          - if:
              exit_key: true
            goto: "section_6:step_1"
          - else: true
            goto: "section_1:step_1"

  - section_id: "section_2"
    title: "The Key"
    steps:
      - step_id: "step_1"
        title: "Found the Key"
        content_blocks:
          - text: "You lift the rug: a key glints in the dust. 🔑"
            show_if:
              key_not_exists: true
          - text: "Just dust under the rug now... though the floorboards look uneven."
            show_if:
              key: true
        question: "Take the key, look closer, or keep exploring? 🤔"
        tokens_for_ai: |
          - take_key: they take or pocket the key.
          - find_coin: they look closer, search under or around the rug, or check the floorboards.
          - continue_exploring: they leave it, look elsewhere or go back.
          - off_topic: anything else.
        buckets:
          - take_key
          - find_coin
          - continue_exploring
          - off_topic
        transitions:
          take_key:
            content_blocks:
              - "You pocket the key. 🔑"
            metadata_add:
              key: true
            next_section_and_step: "section_1:step_1"
          find_coin:
            content_blocks:
              - text: "Under a loose floorboard you find a small coin with strange engravings. 🪙"
                show_if:
                  coin_not_exists: true
              - text: "Nothing else under the floorboards: you already have the coin."
                show_if:
                  coin: true
            metadata_add:
              coin: true
            next_section_and_step: "section_1:step_1"
          continue_exploring:
            next_section_and_step: "section_1:step_1"
          off_topic:
            content_blocks:
              - "Back to our room: take the key, look closer, or keep exploring? 🧭"

  - section_id: "section_3"
    title: "The Book"
    steps:
      - step_id: "step_1"
        title: "Found the Password"
        content_blocks:
          - "The book contains a note with a password: 'ESCAPE123'. 🔐 Its spine seems thicker than it should be."
        question: "Memorise the password, look closer, or keep exploring? 🤔"
        tokens_for_ai: |
          - take_password: they note, memorise or take the password.
          - find_paper: they look closer at the book, its spine, cover or pages.
          - continue_exploring: they put it back, look elsewhere or go back.
          - off_topic: anything else.
        buckets:
          - take_password
          - find_paper
          - continue_exploring
          - off_topic
        transitions:
          take_password:
            content_blocks:
              - "You commit ESCAPE123 to memory. 🧠"
            metadata_add:
              password: true
            next_section_and_step: "section_1:step_1"
          find_paper:
            content_blocks:
              - "Tucked in the spine: a folded paper with a cryptic message, *'The year the clock stopped: 1-8-9-5'*. 📜"
            metadata_add:
              paper: true
            next_section_and_step: "section_1:step_1"
          continue_exploring:
            next_section_and_step: "section_1:step_1"
          off_topic:
            content_blocks:
              - "Back to our room: memorise the password, look closer, or keep exploring? 🧭"

  - section_id: "section_4"
    title: "The Safe"
    steps:
      - step_id: "step_1"
        title: "Opening the Safe"
        content_blocks:
          - "The safe has a keyhole & a keypad: it needs both a key and a password. 🔒"
        question: "Try to open it, or keep exploring? 🤔"
        tokens_for_ai: |
          - use_key_and_password: they try to open the safe (with a key, a password, or both).
          - continue_exploring: they leave it, look elsewhere or go back.
          - off_topic: anything else.
        # Opens the safe only when both are in hand.
        processing_script: |
          if metadata.get("key") is True and metadata.get("password") is True:
              metadata["safe_open"] = True
              metadata["exit_key"] = True
          script_result = {}
        buckets:
          - use_key_and_password
          - continue_exploring
          - off_topic
        transitions:
          use_key_and_password:
            run_processing_script: true
            content_blocks:
              - text: "You turn the key & type ESCAPE123... *click*! Inside: treasure & an exit key. 🎉"
                show_if:
                  safe_open: true
              - text: "The keyhole is empty: you need a key. Maybe something in this room hides one?"
                show_if:
                  key_not_exists: true
              - text: "The keypad blinks red: you need a password. Books sometimes keep secrets..."
                show_if:
                  password_not_exists: true
            next_section_and_step:
              - if:
                  safe_open: true
                goto: "section_4:step_2"
              - else: true
                goto: "section_1:step_1"
          continue_exploring:
            next_section_and_step: "section_1:step_1"
          off_topic:
            content_blocks:
              - "Back to our room: try the safe, or keep exploring? 🧭"

      - step_id: "step_2"
        title: "Safe is Open"
        content_blocks:
          - "The safe stands open, its exit key in your hand. 🗝️ At the back is a coin slot that looks intriguing. 🪙"
        question: "Use a coin in the slot, try to leave the room, or keep exploring? 🤔"
        tokens_for_ai: |
          - use_coin: they put a coin in the slot.
          - try_leave_room: they head for the door or try to leave.
          - continue_exploring: they look elsewhere or go back.
          - off_topic: anything else.
        buckets:
          - use_coin
          - try_leave_room
          - continue_exploring
          - off_topic
        transitions:
          use_coin:
            content_blocks:
              - text: "The coin drops with a clunk & a hidden compartment slides open..."
                show_if:
                  coin: true
              - text: "You have no coin. The floor under the rug looked uneven..."
                show_if:
                  coin_not_exists: true
            next_section_and_step:
              - if:
                  coin: true
                goto: "section_5:step_1"
              - else: true
                goto: "section_4:step_2"
          try_leave_room:
            next_section_and_step: "section_1:door"
          continue_exploring:
            next_section_and_step: "section_1:step_1"
          off_topic:
            content_blocks:
              - "Back to our room: the coin slot, the door, or keep exploring? 🧭"

  - section_id: "section_5"
    title: "The Secret Compartment"
    steps:
      - step_id: "step_1"
        title: "The Hidden Compartment"
        content_blocks:
          - "The compartment holds a second, smaller safe with a four-digit combination lock. 🔢"
        question: "Do you try to solve the combination, or leave it alone? 🤔"
        tokens_for_ai: |
          - solve_combination: they try a combination or try to solve it.
          - leave_it_alone: they leave it, go back or head for the door.
          - off_topic: anything else.
        # The second safe opens only for someone holding the cryptic paper.
        processing_script: |
          if metadata.get("paper") is True:
              metadata["secret_map"] = True
          script_result = {}
        buckets:
          - solve_combination
          - leave_it_alone
          - off_topic
        transitions:
          solve_combination:
            run_processing_script: true
            content_blocks:
              - text: "You recall the paper: 1-8-9-5. The lock clicks open, revealing a map to a hidden place outside this room! 🗺️"
                show_if:
                  secret_map: true
              - text: "You spin the dials, but nothing gives. A clue must be hidden somewhere... perhaps inside the book?"
                show_if:
                  secret_map_not_exists: true
            next_section_and_step: "section_4:step_2"
          leave_it_alone:
            next_section_and_step: "section_4:step_2"
          off_topic:
            content_blocks:
              - "Back to our room: try the combination, or leave it? 🧭"

  - section_id: "section_6"
    title: "Prize Room"
    steps:
      - step_id: "step_1"
        title: "Choose Your Prize"
        content_blocks:
          - "Beyond the door is a prize room! 🎁 Ten items rest on pedestals. One is yours."
        question: "Guess your prize? 🤔"
        # Any guess is a guess: never read as a question about the game.
        allow_clarifying_questions: false
        tokens_for_ai: "- guess: any guess at all."
        buckets:
          - guess
        transitions:
          guess:
            metadata_random:
              prize:
                - "a golden keychain 🗝️"
                - "a mysterious amulet 🧿"
                - "a rare gemstone 💎"
                - "an ancient scroll 📜"
                - "a magical wand 🪄"
                - "a treasure map 🗺️"
                - "a silver coin 🪙"
                - "a mystical ring 💍"
                - "a rare book 📚"
                - "a magical potion 🧪"
            content_blocks:
              - "You won **{{metadata.prize}}**!"
              - text: "And your secret map leads to one more pedestal, hidden behind a curtain: a crown of starlight. 👑"
                show_if:
                  secret_map: true
            ai_feedback:
              tokens_for_ai: "One playful sentence comparing their guess with the prize they won (prize)."
            metadata_add:
              activity_completed: "true"
            next_section_and_step: "section_7:step_1"

  - section_id: "section_7"
    title: "Congratulations!"
    steps:
      - step_id: "step_1"
        title: "Well Done!"
        content_blocks:
          - "Congratulations on escaping! 🎉"
          - text: "You even found the room's last secret. A true escape artist!"
            show_if:
              secret_map: true
          - text: "One secret stayed hidden this time: play again to find it."
            show_if:
              secret_map_not_exists: true
          - "We hope you enjoyed the adventure. 🌟"
