title: "Perimeter Security Training"
description: "Professional training on securing the perimeter of a presidential speech, from site assessment to emergency comms."
kind: "lesson"
default_max_attempts_per_step: 3
tokens_for_ai_rubric: |
  The learner is a security professional in training. Be direct & practical.
  Accept any valid answer in their own words; never require exact phrasing.

# metadata.score counts correct answers; the first question starts it at 0
# on every bucket so the closing screen always has a number.
sections:
  - section_id: "section_1"
    title: "Introduction to Perimeter Security"
    steps:
      - step_id: "step_1"
        title: "What is Perimeter Security?"
        content_blocks:
          - "# Perimeter Security Training 🛡️"
          - "Scenario: you are securing the venue for a presidential speech."
          - "Perimeter security is the set of measures that protect a site's outer boundary against unauthorized access."
        question: "In your own words, what is perimeter security?"
        tokens_for_ai: "Grade their definition of perimeter security."
        bucket_criteria:
          correct: "Describes protecting a site's outer boundary to keep out unauthorized people or threats."
          partial_understanding: "Mentions security or protection but not the boundary, or the boundary without its purpose."
          off_topic: "Not about perimeter security."
        required_elements:
          - "protecting the outer boundary of a site"
          - "keeping out unauthorized access or threats"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Name the element they left out, without the answer."
            metadata_add:
              score: "n+0"
          off_topic:
            content_blocks:
              - "Let's stay on task: what does perimeter security protect, and from what?"
            metadata_add:
              score: "n+0"

      - step_id: "step_2"
        title: "Importance of Perimeter Security for a Presidential Speech"
        question: "Why is perimeter security important for a presidential speech?"
        tokens_for_ai: "Grade their reasons."
        bucket_criteria:
          correct: "Gives a real reason: safety of the president & attendees, keeping threats & unauthorized people out, or keeping the environment controlled."
          partial_understanding: "Says it matters but gives no concrete reason."
          off_topic: "Not about the event's security."
        required_elements:
          - "a concrete reason (protecting people, preventing unauthorized access or threats, keeping control)"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct: a high-profile target & a crowd make a controlled boundary essential. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask who is at risk & from what, without giving the answer."
          off_topic:
            content_blocks:
              - "Think about who attends & what could go wrong. Why does the boundary matter?"

  - section_id: "section_2"
    title: "Planning and Preparation"
    steps:
      - step_id: "step_1"
        title: "Site Assessment"
        content_blocks:
          - "Hardening a perimeter starts with a site assessment: walking the venue before anything is built."
        question: "What is the purpose of a site assessment?"
        tokens_for_ai: "Grade the purpose they give."
        bucket_criteria:
          correct: "Finding vulnerabilities, entry points or weak areas so the plan can address them."
          partial_understanding: "Says 'checking the site' without saying what is looked for or why."
          off_topic: "Not about site assessment."
        required_elements:
          - "identifying vulnerabilities, entry points or weak spots"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct: you find the weak points first, then fix them. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what they are looking for on the walk-through, without the answer."
          off_topic:
            content_blocks:
              - "Picture walking the venue before the event. What are you looking for?"

      - step_id: "step_2"
        title: "Security Plan Development"
        content_blocks:
          - "Next, the assessment becomes a written security plan."
        question: "What should a security plan for a presidential speech include?"
        tokens_for_ai: "Grade the plan's components."
        bucket_criteria:
          correct: "Covers security measures, personnel deployment AND emergency response."
          partial_understanding: "Covers one or two of the three."
          off_topic: "Not about a security plan."
        required_elements:
          - "security measures (barriers, access control, surveillance)"
          - "personnel deployment (who stands where)"
          - "emergency response protocols"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct: measures, people & emergency response. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Praise what they covered & name which area (things, people, emergencies) is missing, without listing it."
          off_topic:
            content_blocks:
              - "Think in three parts: the things, the people & what happens when something goes wrong."

  - section_id: "section_3"
    title: "Implementing Security Measures"
    steps:
      - step_id: "step_1"
        title: "Physical Barriers"
        content_blocks:
          - "Fences, bollards & barricades are physical barriers."
        question: "What is the role of physical barriers in perimeter security?"
        tokens_for_ai: "Grade the role they describe."
        bucket_criteria:
          correct: "They control access & stop or delay unauthorized entry (vehicles included)."
          partial_understanding: "Names barriers but not what they do."
          off_topic: "Not about physical barriers."
        required_elements:
          - "controlling access or stopping unauthorized entry"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct: they channel people to checkpoints & stop vehicles. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what would happen without them, without the answer."
          off_topic:
            content_blocks:
              - "Picture a fence line around the venue. What job does it do?"

      - step_id: "step_2"
        title: "Access Control"
        content_blocks:
          - "Access control means checkpoints, ID verification & controlled entry points."
        question: "Why is access control important?"
        tokens_for_ai: "Grade their reason."
        bucket_criteria:
          correct: "Ensures only authorized or screened people (and items) enter the secured area."
          partial_understanding: "Describes checkpoints without saying what they ensure."
          off_topic: "Not about access control."
        required_elements:
          - "only authorized or screened people get in"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask who should get through a checkpoint & who shouldn't, without the answer."
          off_topic:
            content_blocks:
              - "Think about the entry gate. What is it there to guarantee?"

  - section_id: "section_4"
    title: "Monitoring and Surveillance"
    steps:
      - step_id: "step_1"
        title: "Surveillance Cameras"
        content_blocks:
          - "Cameras give a security team eyes on the whole perimeter."
        question: "What is the role of surveillance cameras in perimeter security?"
        tokens_for_ai: "Grade the role they describe."
        bucket_criteria:
          correct: "Monitoring the perimeter in real time to detect threats (recording for evidence also counts)."
          partial_understanding: "Says cameras 'watch' without saying what for."
          off_topic: "Not about cameras."
        required_elements:
          - "monitoring or detecting threats"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct: real-time feeds let the team spot & respond fast. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what the control room does with the feed, without the answer."
          off_topic:
            content_blocks:
              - "Think about the control room watching the feeds. What are they for?"

      - step_id: "step_2"
        title: "Security Personnel"
        content_blocks:
          - "Technology helps, but people hold the perimeter."
        question: "What is the role of security personnel in perimeter security?"
        tokens_for_ai: "Grade the role they describe."
        bucket_criteria:
          correct: "Monitoring the perimeter AND responding to incidents (positioning & radios are a bonus)."
          partial_understanding: "Gives only monitoring or only responding."
          off_topic: "Not about security personnel."
        required_elements:
          - "monitoring or patrolling the perimeter"
          - "responding to incidents"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct: watch, then act. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Name which half (watching or acting) is missing, without spelling it out."
          off_topic:
            content_blocks:
              - "Think about an officer on post. What do they do before & during an incident?"

  - section_id: "section_5"
    title: "Emergency Response"
    steps:
      - step_id: "step_1"
        title: "Emergency Protocols"
        content_blocks:
          - "Emergency protocols cover evacuation plans, communication procedures, and roles & responsibilities."
        question: "Why are emergency protocols important?"
        tokens_for_ai: "Grade their reason."
        bucket_criteria:
          correct: "They let the team respond quickly & effectively because everyone already knows what to do."
          partial_understanding: "Says they are needed but not why a plan made in advance helps."
          off_topic: "Not about emergency protocols."
        required_elements:
          - "faster or more effective response because roles & steps are decided in advance"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct: in a crisis there's no time to improvise. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what happens in a crisis when nobody knows their role, without the answer."
          off_topic:
            content_blocks:
              - "Imagine an alarm goes off mid-speech. Why does a plan written beforehand matter?"

      - step_id: "step_2"
        title: "Communication During Emergencies"
        content_blocks:
          - "Radios, phones & other devices keep the team in contact."
        question: "Why is communication important during emergencies?"
        tokens_for_ai: "Grade their reason."
        bucket_criteria:
          correct: "It coordinates the response: everyone shares what is happening & acts together."
          partial_understanding: "Names devices but not why contact matters."
          off_topic: "Not about emergency communication."
        required_elements:
          - "coordinating the team's response"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
              activity_completed: "true"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what goes wrong if teams can't talk, without the answer."
          off_topic:
            content_blocks:
              - "Think of several teams in an emergency. Why must they stay in contact?"

      - step_id: "step_3"
        title: "Training Complete"
        content_blocks:
          - "# Training Complete ✅"
          - "You scored **{{metadata.score}} of 10**."
          - "You covered assessment, planning, barriers, access control, surveillance, personnel & emergency response."
