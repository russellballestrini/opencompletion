# What our Activities gallery shows for this activity (optional: see SPEC.yaml).
title: "Tic Tac Toe"
description: "Play X against our computer on a 3x3 board: three in a row wins."
kind: "game"
default_max_attempts_per_step: 9
# Answers are moves ("4"): our built-in clarifying bucket would misread them.
allow_clarifying_questions: false

sections:
  - section_id: "section_1"
    title: "Tic Tac Toe"
    steps:
      - step_id: "step_0"
        title: "Introduction"
        content_blocks:
          - |
            Welcome to Tic Tac Toe! 🎮
            You will be playing against the computer. You are 'X' and the computer is 'O'.
            The board positions are numbered 0 to 8 as follows:

            <img src="/static/images/tic-tac-toe.png">

      - step_id: "step_1"
        title: "Your Move"
        question: "Enter a position number (0-8) to place your 'X'. Say restart or exit to quit."
        tokens_for_ai: |
          - valid_move: a position, a number 0 to 8 (our script checks the square is free).
          - invalid_move: anything else meant as a move (a number out of range, a word).
          - restart: they want a new game.
          - exit: they want to stop, quit or leave.
        feedback_tokens_for_ai: |
          Speak in first person as the computer playing O. One or two playful sentences.
          The move & result are decided & shown already (move_note): never change or repeat them, never draw or describe the board.
        # Our script referees every move: a square that isn't free, or a
        # word, is explained & asked again; a finished game goes to Game Over.
        processing_script: |
          import random

          win_conditions = [
              [0, 1, 2], [3, 4, 5], [6, 7, 8],  # rows
              [0, 3, 6], [1, 4, 7], [2, 5, 8],  # columns
              [0, 4, 8], [2, 4, 6]              # diagonals
          ]

          def check_win(board, player):
              # The winning line, if `player` has one
              for condition in win_conditions:
                  if all(board[i] == player for i in condition):
                      return condition
              return None

          def computer_move(board):
              # Win if we can, else block X, else the centre, else any free square
              free = [i for i in range(9) if board[i] == " "]
              for mark in ("O", "X"):
                  for i in free:
                      trial = list(board)
                      trial[i] = mark
                      if check_win(trial, mark):
                          return i
              if 4 in free:
                  return 4
              return random.choice(free) if free else None

          def plot_board(board, win_line=None):
              import io
              import base64
              import matplotlib
              matplotlib.use("Agg")
              import matplotlib.pyplot as plt

              fig, ax = plt.subplots(figsize=(3, 3))
              ax.set_xlim(0, 3)
              ax.set_ylim(0, 3)
              ax.set_xticks([])
              ax.set_yticks([])
              ax.grid(True)

              for i, mark in enumerate(board):
                  x = i % 3
                  y = 2 - i // 3
                  if mark != " ":
                      ax.text(x + 0.5, y + 0.5, mark, fontsize=24, ha='center', va='center')
                  else:
                      # Plot the cell number if the cell is empty
                      ax.text(x + 0.5, y + 0.5, str(i), fontsize=12, ha='center', va='center', color='gray')

              # Draw the winning line if there is one
              if win_line:
                  start, end = win_line[0], win_line[-1]
                  ax.plot([start % 3 + 0.5, end % 3 + 0.5], [2 - start // 3 + 0.5, 2 - end // 3 + 0.5], 'r-', linewidth=2)

              buf = io.BytesIO()
              plt.savefig(buf, format='png')
              plt.close(fig)
              buf.seek(0)
              return base64.b64encode(buf.getvalue()).decode('utf-8')

          # Rebuild the board from the moves so far
          user_moves = list(metadata.get("user_moves") or [])
          ai_moves = list(metadata.get("ai_moves") or [])
          board = [" "] * 9
          for move in user_moves:
              board[int(move)] = "X"
          for move in ai_moves:
              board[int(move)] = "O"
          for key in ("games", "wins", "losses", "draws"):
              metadata[key] = int(metadata.get(key) or 0)

          text = str(metadata.get("user_response") or "").strip()
          user_move = int(text) if text.isdigit() else -1
          ai_move = None

          if metadata.get("game_over"):
              metadata["move_note"] = "This game is over."
              script_result = {"next_section_and_step": "section_1:game_over"}
          elif not 0 <= user_move < 9:
              free = ", ".join(str(i) for i in range(9) if board[i] == " ")
              metadata["move_note"] = f"🤔 `{text[:20]}` isn't a square. Pick a free one: {free}."
              script_result = {"valid": False}
          elif board[user_move] != " ":
              free = ", ".join(str(i) for i in range(9) if board[i] == " ")
              metadata["move_note"] = f"🙃 Square {user_move} is taken. Free squares: {free}."
              script_result = {"valid": False}
          else:
              board[user_move] = "X"
              user_moves.append(user_move)
              user_win_line = check_win(board, "X")
              if not user_win_line:
                  ai_move = computer_move(board)
                  if ai_move is not None:
                      board[ai_move] = "O"
                      ai_moves.append(ai_move)
              ai_win_line = check_win(board, "O")
              is_draw = " " not in board and not user_win_line and not ai_win_line
              game_over = bool(user_win_line or ai_win_line or is_draw)

              note = f"You take **{user_move}**."
              if ai_move is not None:
                  note += f" I take **{ai_move}**."
              if user_win_line:
                  metadata["wins"] += 1
                  note += " Three in a row: **you win!** 🎉"
              elif ai_win_line:
                  metadata["losses"] += 1
                  note += " Three in a row for O: **I win!** 🤖"
              elif is_draw:
                  metadata["draws"] += 1
                  note += " The board is full: **a draw.** 🤝"
              if game_over:
                  metadata["games"] += 1
              metadata["move_note"] = note
              metadata.update({
                  "user_moves": user_moves,
                  "ai_moves": ai_moves,
                  "game_over": game_over,
                  "ai_wins": ai_win_line is not None,
                  "user_wins": user_win_line is not None,
                  "is_draw": is_draw,
              })
              script_result = {
                  "plot_image": plot_board(board, user_win_line or ai_win_line),
                  "set_background": not game_over,
                  "ai_move": ai_move,
                  "user_move": user_move,
              }
              if game_over:
                  script_result["next_section_and_step"] = "section_1:game_over"
        buckets:
          - valid_move
          - invalid_move
          - restart
          - exit
        transitions:
          valid_move:
            run_processing_script: true
            content_blocks:
              - "{{metadata.move_note}}"
            ai_feedback:
              tokens_for_ai: "React to the move."
            next_section_and_step: "section_1:step_1"
          invalid_move:
            run_processing_script: true
            content_blocks:
              - "{{metadata.move_note}}"
            counts_as_attempt: false
            next_section_and_step: "section_1:step_1"
          exit:
            metadata_add:
              activity_completed: "true"
            next_section_and_step: "section_1:step_2"
          restart:
            content_blocks:
              - "Restarting the game. Let's start fresh!"
            metadata_remove: [user_moves, ai_moves, game_over, ai_wins, user_wins, is_draw, move_note]
            next_section_and_step: "section_1:step_0"

      - step_id: "game_over"
        title: "Game Over"
        content_blocks:
          - "Games: **{{metadata.games}}** · you won **{{metadata.wins}}** · I won **{{metadata.losses}}** · draws **{{metadata.draws}}**"
        question: "Play **again**, or **exit**?"
        tokens_for_ai: |
          - restart: they want another game (yes, again, sure, a square number).
          - exit: they want to stop, quit or leave (no, done).
        buckets:
          - restart
          - exit
        transitions:
          restart:
            metadata_remove: [user_moves, ai_moves, game_over, ai_wins, user_wins, is_draw, move_note]
            next_section_and_step: "section_1:step_0"
          exit:
            metadata_add:
              activity_completed: "true"
            next_section_and_step: "section_1:step_2"

      - step_id: "step_2"
        title: "Goodbye"
        content_blocks:
          - text: "Final tally: **{{metadata.games}}** games · you won **{{metadata.wins}}** · I won **{{metadata.losses}}** · draws **{{metadata.draws}}**"
            show_if:
              games_gte: 1
          - "Thank you for playing Tic Tac Toe! 🎉"
          - "Feel free to come back anytime for another game."
