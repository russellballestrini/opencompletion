  # SECTION: CHEMISTRY & ENGINEERING - Balance equations and solve problems
  # ============================================================================
  - section_id: "chemistry_engineering"
    title: "Nuclear Chemistry & Engineering"
    steps:
      - step_id: "chemistry_hub"
        title: "Chemistry Laboratory"
        classifier_model: "MODEL_1"  # Hermes for categorization
        feedback_model: "MODEL_2"    # Qwen for chemistry expertise
        question: "You access the chemistry analysis systems. What would you like to work on? (coolant chemistry, fission equations, radioactive decay, fuel chemistry, balance an equation, or return)"
        tokens_for_ai: "Categorize: 'coolant', 'reactor', 'decay', 'fuel', 'balance_equation', 'return'"
        feedback_tokens_for_ai: |
          ARIA has advanced chemistry analysis capabilities.
          
          As a machine learning operator, you can calculate complex chemical equations, balance reactions,
          analyze coolant chemistry, predict decay chains, optimize fuel composition.
          
          This is where nuclear engineering meets practical chemistry.
          
        buckets: [coolant, reactor, decay, fuel, balance_equation, return, set_language]
        
        transitions:
          coolant:
            content_blocks:
              - "You analyze the molten salt coolant chemistry..."
            metadata_remove: "coolant_tries"
            next_section_and_step: "chemistry_engineering:coolant_chemistry"
          
          reactor:
            content_blocks:
              - "You examine the nuclear fission reactions in the core..."
            metadata_remove: "fission_tries"
            next_section_and_step: "chemistry_engineering:reactor_chemistry"
          
          decay:
            content_blocks:
              - "You calculate radioactive decay chains..."
            metadata_remove: "decay_tries"
            next_section_and_step: "chemistry_engineering:decay_analysis"
          
          fuel:
            content_blocks:
              - "You optimize fuel composition and burnup..."
            next_section_and_step: "chemistry_engineering:fuel_chemistry"
          
          balance_equation:
            content_blocks:
              - "You prepare to balance a nuclear reaction equation..."
            next_section_and_step: "chemistry_engineering:equation_balancing"
          
          return:
            next_section_and_step: "control_center:main_control"
          
          set_language:
            metadata_add:
              language: "the-users-response"
            counts_as_attempt: false
            next_section_and_step: "chemistry_engineering:chemistry_hub"

      - step_id: "coolant_chemistry"
        title: "Molten Salt Coolant Chemistry"
        allow_clarifying_questions: true
        content_blocks:
          - "## The Fuel Salt"
          - "Prometheus-7's fuel salt is a molten mixture of **LiF**, **BeF2** and **UF4**: roughly 65% LiF, 29% BeF2 and 6% UF4 by mole."
          - "It is a mixture, not one compound: each salt keeps its own formula."
        question: "Why does lithium fluoride carry one fluorine, beryllium fluoride two, and uranium tetrafluoride four? Explain using the ions' charges."
        tokens_for_ai: |
          The learner explains the formulas LiF, BeF2, UF4 from ionic charges.
          'hint' if they ask for a hint; 'done' if they want to leave the lab.
        bucket_criteria:
          correct: "Fluoride is -1 and each metal's charge (Li +1, Be +2, U +4) is balanced by that many fluorides, so each salt is neutral."
          partial_understanding: "On the right track (charges, or neutrality) but misses one idea or one metal's charge."
          incorrect: "Wrong reasoning (e.g. counts by atomic mass or valence electrons of fluorine only) or no explanation."
          hint: "Asks for help instead of answering."
          done: "Wants to stop and go back to the lab menu."
        required_elements:
          - "fluoride ion carries a charge of -1"
          - "each metal's positive charge (lithium +1, beryllium +2, uranium +4) sets how many fluorides it takes"
          - "the compound is electrically neutral overall"
        feedback_tokens_for_ai: |
          Respond as ARIA's lab systems. FLiBe: Li-7 absorbs few neutrons, BeF2 lowers the melting point
          (about 459°C for 2LiF-BeF2), UF4 is the dissolved fuel. Never give the full answer on a wrong try.
        buckets: [correct, partial_understanding, incorrect, hint, done, set_language]
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Praise the charge-balance reasoning. Dr. Chen notes the salt chemistry is spot-on."
            metadata_add:
              chemistry_mastery: "n+1"
            metadata_remove: "coolant_tries"
