      - step_id: "solve_balance"
        title: "Solve the Balance"
        allow_clarifying_questions: true
        question: "Balance **{{metadata.challenge_equation}}**: write it with whole-number coefficients."
        tokens_for_ai: |
          The equation to balance is metadata.challenge_equation. Count every element on both sides.
          'hint' if they ask for a hint.
        bucket_criteria:
          correct: "Every element has the same atom count on both sides, with the smallest whole-number coefficients."
          partial_understanding: "Balances some elements but not all, or balanced with coefficients that are not the smallest."
          incorrect: "Changes a formula's subscripts, or most elements unbalanced."
          hint: "Asks for help instead of answering."
        required_elements:
          - "each element's atom count is equal on both sides"
          - "only coefficients change, never a formula's subscripts"
          - "coefficients are the smallest whole numbers that work"
        feedback_tokens_for_ai: "Check atom counts per element. On a wrong try, name one unbalanced element, never the answer."
        buckets: [correct, partial_understanding, incorrect, hint, set_language]
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Confirm the balance, element by element."
            metadata_add:
              chemistry_mastery: "n+1"
              equations_balanced: "n+1"
            metadata_remove: "balance_tries"
            next_section_and_step: "chemistry_engineering:equation_balancing"
          partial_understanding:
            metadata_add:
              balance_tries: "n+1"
            ai_feedback:
              tokens_for_ai: "Name one element that is still unbalanced."
            content_blocks: &balance_hints
              - text: "💡 Hint: list each element and count its atoms on the left and on the right."
                show_if:
                  balance_tries: 1
              - text: "💡 Hint: balance the element that appears in the fewest formulas first; leave H and O for last."
                show_if:
                  balance_tries: 2
              - text: "💡 Strong hint: if you end with a half (like 5/2 O2), double every coefficient."
                show_if:
                  balance_tries: 3
              - text: "Let us set this one aside: count each element on both sides and try a fresh equation."
                show_if:
                  balance_tries_gte: 4
            next_section_and_step:
              - if:
                  balance_tries_gte: 4
                goto: "chemistry_engineering:equation_balancing"
              - else: true
                goto: "chemistry_engineering:solve_balance"
          incorrect:
            metadata_add:
              balance_tries: "n+1"
            content_blocks: *balance_hints
            next_section_and_step:
              - if:
                  balance_tries_gte: 4
                goto: "chemistry_engineering:equation_balancing"
              - else: true
                goto: "chemistry_engineering:solve_balance"
          hint:
            content_blocks:
              - "💡 Atoms are conserved: change coefficients (the numbers in front), never the formulas."
            counts_as_attempt: false
            next_section_and_step: "chemistry_engineering:solve_balance"
          set_language:
            metadata_add:
              language: "the-users-response"
            counts_as_attempt: false
            next_section_and_step: "chemistry_engineering:solve_balance"

