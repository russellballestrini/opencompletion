        - text: '💡 Hint: where does your counter start, & where does it stop? Check both 1 & 5 are shown.'
          show_if:
            loop_tries_lt: 2
        - text: '💡 Hint: if your language counts with a range, check whether the range''s end is included.'
          show_if:
            loop_tries_gte: 2
        ai_feedback:
          tokens_for_ai: 'Say what they got right, then name the one missing or wrong piece. Don''t write the solution for them, unless metadata.loop_tries is 3 or more: then show a complete working one.'
      incorrect:
        metadata_add:
          loop_tries: n+1
        content_blocks:
        - text: '💡 Hint: where does your counter start, & where does it stop? Check both 1 & 5 are shown.'
          show_if:
            loop_tries_lt: 2
        - text: '💡 Hint: if your language counts with a range, check whether the range''s end is included.'
          show_if:
            loop_tries_gte: 2
        ai_feedback:
          tokens_for_ai: 'Say kindly what their code would do instead, & which idea to reach for. Don''t write the solution for them, unless metadata.loop_tries is 3 or more: then show a complete working one.'
      limited_effort:
        content_blocks:
        - 'Give it a go: a broken first try teaches more than none. Stuck? Ask a question.'
