    transitions:
      correct:
        ai_feedback:
          tokens_for_ai: Excellent! You've mastered functions with return values in their language. Explain the difference between returning and displaying.
        metadata_add:
          score: n+3
          concepts_mastered: n+1
        next_section_and_step: conclusion:step_1
      partial_understanding:
        metadata_add:
          add_tries: n+1
        content_blocks:
        - text: '💡 Hint: does your function hand its answer back with return, or only print it?'
          show_if:
            add_tries_lt: 2
        - text: '💡 Hint: the function returns; the caller displays. Call add(5, 3) & show what comes back.'
          show_if:
            add_tries_gte: 2
        ai_feedback:
          tokens_for_ai: 'Say what they got right, then name the one missing or wrong piece. Don''t write the solution for them, unless metadata.add_tries is 3 or more: then show a complete working one.'
      incorrect:
        metadata_add:
          add_tries: n+1
        content_blocks:
        - text: '💡 Hint: does your function hand its answer back with return, or only print it?'
          show_if:
            add_tries_lt: 2
        - text: '💡 Hint: the function returns; the caller displays. Call add(5, 3) & show what comes back.'
          show_if:
            add_tries_gte: 2
        ai_feedback:
          tokens_for_ai: 'Say kindly what their code would do instead, & which idea to reach for. Don''t write the solution for them, unless metadata.add_tries is 3 or more: then show a complete working one.'
      limited_effort:
        content_blocks:
        - 'Give it a go: a broken first try teaches more than none. Stuck? Ask a question.'
      set_language:
        content_blocks:
        - Language preference updated.
        metadata_add:
          language: the-users-response
        counts_as_attempt: false
