    - partial_understanding
    - incorrect
    - limited_effort
    - set_language
    - off_topic
    transitions:
      correct:
        ai_feedback:
          tokens_for_ai: Excellent! You've written multiple output statements in their language. Explain how they can use this to build more complex programs.
        metadata_add:
          score: n+2
          concepts_mastered: n+1
        next_section_and_step: variables:step_1
      partial_understanding:
        metadata_add:
          lines_tries: n+1
        content_blocks:
        - text: '💡 Hint: the output call from Hello World works here too. How many times will you call it?'
          show_if:
            lines_tries_lt: 2
        - text: '💡 Hint: call it three times, or put `\n` between the messages in one string.'
          show_if:
            lines_tries_gte: 2
        ai_feedback:
          tokens_for_ai: 'Say what they got right, then name the one missing or wrong piece. Don''t write the solution for them, unless metadata.lines_tries is 3 or more: then show a complete working one.'
      incorrect:
        metadata_add:
          lines_tries: n+1
        content_blocks:
        - text: '💡 Hint: the output call from Hello World works here too. How many times will you call it?'
          show_if:
            lines_tries_lt: 2
        - text: '💡 Hint: call it three times, or put `\n` between the messages in one string.'
          show_if:
            lines_tries_gte: 2
        ai_feedback:
          tokens_for_ai: 'Say kindly what their code would do instead, & which idea to reach for. Don''t write the solution for them, unless metadata.lines_tries is 3 or more: then show a complete working one.'
      limited_effort:
        content_blocks:
        - 'Give it a go: a broken first try teaches more than none. Stuck? Ask a question.'
      set_language:
        content_blocks:
        - Language preference updated.
        metadata_add:
          language: the-users-response
        counts_as_attempt: false
      off_topic:
