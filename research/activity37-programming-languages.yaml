        - Write a for loop that displays numbers 1 through 5.
- section_id: functions
  title: 'Functions: Reusable Code'
  steps:
  - step_id: step_1
    title: Creating Functions
    content_blocks:
    - '## Functions: Organize and Reuse Your Code 📦'
    - text: '_Progress: {{metadata.concepts_mastered}} of 8 concepts · {{metadata.score}} points_'
      show_if:
        score_exists: true
    - ''
    - '### What Are Functions?'
    - A **function** is a named block of reusable code that performs a specific task. Think of it as a mini-program within your program. Functions are one of the most important concepts in programming because they let you organize code and avoid repetition.
    - ''
    - '### Why Do We Need Functions?'
    - ''
    - '**Without functions, code becomes:**'
    - '- Repetitive (copy-paste the same code everywhere)'
    - '- Hard to maintain (fix a bug in 50 places instead of 1)'
    - '- Difficult to understand (one giant block of code)'
    - '- Impossible to test in isolation'
    - ''
    - '**With functions, code becomes:**'
    - '- **Reusable:** Write once, use many times'
    - '- **Organized:** Break complex programs into manageable pieces'
    - '- **Readable:** `calculateTax()` is clearer than 50 lines of math'
    - '- **Testable:** Test each function independently'
    - '- **Abstract:** Hide implementation details behind a simple name'
    - ''
    - '### Real-World Analogy'
    - 'Think of functions like recipes in a cookbook:'
    - '- Each recipe has a **name** ("Chocolate Cake")'
    - '- Each recipe takes **ingredients** (inputs/parameters)'
    - '- Each recipe has **instructions** (the function body - what it does)'
    - '- Each recipe produces **a result** (output/return value)'
    - ''
    - 'You don''t rewrite the recipe every time you want cake - you just refer to it by name: "Make Chocolate Cake"'
    - ''
    - '### Anatomy of a Function'
    - ''
    - 'Every function has these parts:'
    - ''
    - 1. **Name:** What you call the function (`welcome`, `calculateTotal`, `isValid`)
    - 2. **Parameters:** Inputs the function needs (optional)
    - 3. **Body:** The code that runs when you call the function
    - 4. **Return value:** What the function sends back (optional)
    - ''
    - '**Defining vs Calling:**'
    - '- **Definition** = Creating the function (writing the recipe)'
    - '- **Call** = Using the function (following the recipe)'
    - ''
    - '### Functions in Different Languages'
    - ''
    - '**Python:**'
    - '```python'
    - '# Define the function'
    - 'def welcome(city):                    # def = define, city = parameter'
    - '    print(f"Welcome to {city}!")        # Function body (indented)'
    - ''
    - '# Call the function'
    - 'welcome("Paris")                      # Output: Welcome to Paris!'
    - 'welcome("Lima")                        # Output: Welcome to Lima!'
    - '```'
    - ''
    - '**JavaScript:**'
    - '```javascript'
    - // Define the function
    - function welcome(city) {              // function keyword
    - '    console.log(`Welcome to ${city}!`); // Function body in braces'
    - '}'
    - ''
    - // Call the function
    - 'welcome("Paris");                     // Output: Welcome to Paris!'
    - 'welcome("Lima");                       // Output: Welcome to Lima!'
    - '```'
    - ''
    - '**Java:**'
    - '```java'
    - // Define the function (method)
    - void welcome(String city) {                      // void = no return value
    - '    System.out.println("Welcome to " + city + "!");'
    - '}'
    - ''
    - // Call the function
    - welcome("Paris");
    - welcome("Lima");
    - '```'
    - ''
    - '**C++:**'
    - '```cpp'
    - // Define the function
    - void welcome(std::string city) {                 // void = no return
    - '    std::cout << "Welcome to " << city << "!" << std::endl;'
    - '}'
    - ''
    - // Call the function
    - welcome("Paris");
    - welcome("Lima");
    - '```'
    - ''
    - '### Understanding Parameters'
    - ''
    - '**Parameters** (also called arguments) are values you pass into a function:'
    - ''
    - '```python'
    - 'def welcome(city):       # "city" is a parameter'
    - '    print(f"Welcome to {city}!")'
    - ''
    - 'welcome("Paris")         # "Paris" is the argument passed to city'
    - '```'
    - ''
    - 'When you call `welcome("Paris")`:'
    - 1. The value `"Paris"` is passed to the function
    - 2. Inside the function, `city = "Paris"`
    - 3. The function can use `city` like any other variable
    - ''
    - '**Multiple parameters:**'
    - '```python'
    - 'def welcome(city, country):'
    - '    print(f"Welcome to {city}, {country}!")'
    - ''
    - 'welcome("Paris", "France")  # Output: Welcome to Paris, France!'
    - '```'
    - ''
    - '### The DRY Principle'
    - '**DRY = Don''t Repeat Yourself**'
    - ''
    - '**Without functions (repetitive):**'
    - '```python'
    - print("Welcome to Paris!")
    - print("Welcome to Lima!")
    - print("Welcome to Oslo!")
    - '```'
    - ''
    - '**With functions (DRY):**'
    - '```python'
    - 'def welcome(city):'
    - '    print(f"Welcome to {city}!")'
    - ''
    - welcome("Paris")
    - welcome("Lima")
    - welcome("Oslo")
    - '```'
    - ''
    - If you need to change the message, you only change it in ONE place (the function), not everywhere it's used!
    - ''
    - '### Function Naming Conventions'
    - 'Choose clear, descriptive names that describe what the function does:'
    - ''
    - '**Good names:** `calculateTotal`, `isValid`, `getUserInput`, `sendEmail`'
    - '**Bad names:** `doStuff`, `func1`, `xyz`, `temp`'
    - ''
    - 'Use verb names since functions perform actions: `get`, `set`, `calculate`, `validate`, `send`, `display`'
    - ''
    - '### Now It''s Your Turn!'
    - Practice creating and calling a function with a parameter.
    question: Write a function called 'greet' that takes a name as a parameter and displays 'Hello, [name]!' to stdout. Then call the function with your own name.
    tokens_for_ai: |
      Their greet function & its call. It should be in their chosen programming language (metadata.programming_language); working code in another language is partial_understanding. Any valid approach counts.
    bucket_criteria:
      correct: greet takes a name, displays Hello, <name>! & is called with a name.
      partial_understanding: 'A function with one piece missing: no call, no parameter, or a fixed name.'
      incorrect: No function.
      limited_effort: A word or two, or no code at all.
      off_topic: Not about this task.
    required_elements:
