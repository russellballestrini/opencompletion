# What our Activities gallery shows for this activity (optional: see SPEC.yaml).
title: "Story Builder: A Fork in a Forest"
description: "Choose a way through a forest, a river & a magical portal; our choices become one story."
kind: "game"
default_max_attempts_per_step: 30

# Every step keeps its own asking_clarifying_questions bucket (a story
# question gets an answer in the story), so our built-in one stays out.

tokens_for_ai_rubric: |
  You are a master storyteller. Retell this chat as one coherent, vivid story with a beginning, middle & end, shaped by the choices the player made & the narrator's replies.

sections:
  - section_id: "section_1"
    title: "The Adventure Begins"
    steps:
      - step_id: "step_1"
        title: "Setting the Scene"
        content_blocks:
          - "# Story Builder 🌟"
          - "Your choices shape this story. You are in a dense forest, and you come across a fork in the path."
          - "To the **left**, the path leads deeper into the forest, toward the sound of a flowing river. To the **right**, it leads to a clearing with a mysterious glowing light."
        question: "Which path do you choose? Left (forest) or Right (clearing)? 🤔"
        tokens_for_ai: |
          - left_forest: they go left, toward the forest or the river.
          - right_clearing: they go right, toward the clearing or the light.
          - asking_clarifying_questions: they ask about the scene instead of choosing.
          - off_topic: anything else.
        buckets:
          - left_forest
          - right_clearing
          - off_topic
          - asking_clarifying_questions
        transitions:
          left_forest:
            ai_feedback:
              tokens_for_ai: "One or two vivid sentences of the walk toward the river, in second person."
            next_section_and_step: "section_2:step_1"
          right_clearing:
            ai_feedback:
              tokens_for_ai: "One or two vivid sentences of the walk toward the light, in second person."
            next_section_and_step: "section_3:step_1"
          off_topic:
            content_blocks:
              - "Back to our story: left toward the river, or right toward the light? 🧭"
          asking_clarifying_questions:
            ai_feedback:
              tokens_for_ai: "Answer their question in the story's voice, briefly, without choosing for them."

  - section_id: "section_2"
    title: "The Forest Path"
    steps:
      - step_id: "step_1"
        title: "Encounter at the River"
        content_blocks:
          - "You go deeper into the forest. 🌲 The sound of the river grows louder until you reach its sparkling edge."
          - "A small boat is tied to a tree."
        question: "Do you **take the boat** & explore the river, or **follow the riverbank** on foot? (Or **go back** to the fork.) 🤔"
        tokens_for_ai: |
          - take_boat: they take the boat or go onto the water.
          - follow_riverbank: they walk along the river on foot.
          - go_back: they return to the fork.
          - asking_clarifying_questions: they ask about the scene instead of choosing.
          - off_topic: anything else.
        buckets:
          - take_boat
          - follow_riverbank
          - go_back
          - off_topic
          - asking_clarifying_questions
        transitions:
          take_boat:
            content_blocks:
              - "You untie the boat & push off. 🚣"
            next_section_and_step: "section_4:step_1"
          follow_riverbank:
            content_blocks:
              - "You follow the riverbank on foot. 🌲"
            next_section_and_step: "section_5:step_1"
          go_back:
            content_blocks:
              - "You head back to the fork in the path. 🔄"
            next_section_and_step: "section_1:step_1"
          off_topic:
            content_blocks:
              - "Back to our story: the boat, the riverbank, or back to the fork? 🧭"
          asking_clarifying_questions:
            ai_feedback:
              tokens_for_ai: "Answer their question in the story's voice, briefly, without choosing for them."

  - section_id: "section_3"
    title: "The Clearing Path"
    steps:
      - step_id: "step_1"
        title: "The Magical Portal"
        content_blocks:
          - "You walk toward the clearing. 🌟 The glow brightens until you see a magical portal shimmering in the air."
        question: "Do you **step through the portal**, or **explore the clearing**? (Or **go back** to the fork.) 🤔"
        tokens_for_ai: |
          - step_through_portal: they enter the portal.
          - explore_clearing: they look around the clearing instead.
          - go_back: they return to the fork.
          - asking_clarifying_questions: they ask about the scene instead of choosing.
          - off_topic: anything else.
        buckets:
          - step_through_portal
          - explore_clearing
          - go_back
          - off_topic
          - asking_clarifying_questions
        transitions:
          step_through_portal:
            content_blocks:
              - "You take a breath & step through the portal. ✨"
            next_section_and_step: "section_6:step_1"
          explore_clearing:
            content_blocks:
              - "You leave the portal humming & explore the clearing. 🌿"
            next_section_and_step: "section_7:step_1"
          go_back:
            content_blocks:
              - "You head back to the fork in the path. 🔄"
            next_section_and_step: "section_1:step_1"
          off_topic:
            content_blocks:
              - "Back to our story: the portal, the clearing, or back to the fork? 🧭"
          asking_clarifying_questions:
            ai_feedback:
              tokens_for_ai: "Answer their question in the story's voice, briefly, without choosing for them."

  - section_id: "section_4"
    title: "The Boat Adventure"
    steps:
      - step_id: "step_1"
        title: "The Hidden Treasure"
        content_blocks:
          - "As you paddle downstream, friendly forest creatures wave you ashore & lead you to a treasure chest half buried in moss."
        question: "Do you **open the treasure**, or **leave it**? (Or **go back** to the river.) 🤔"
        tokens_for_ai: |
          - open_treasure: they open the chest.
          - leave_treasure: they leave it closed.
          - go_back: they return to the river.
          - asking_clarifying_questions: they ask about the scene instead of choosing.
          - off_topic: anything else.
        buckets:
          - open_treasure
          - leave_treasure
          - go_back
          - off_topic
          - asking_clarifying_questions
        transitions:
          open_treasure:
            content_blocks:
              - "Inside: gold coins, precious gems & a glowing artifact that grants you a special power. 💎"
            metadata_add:
              path_taken: "treasure"
            next_section_and_step: "section_8:step_1"
          leave_treasure:
            content_blocks:
              - "You leave the chest for someone who needs it more. The journey itself feels like the treasure. 🌲"
            metadata_add:
              path_taken: "kindness"
            next_section_and_step: "section_8:step_1"
          go_back:
            content_blocks:
              - "You paddle back to the river's edge. 🔄"
            next_section_and_step: "section_2:step_1"
          off_topic:
            content_blocks:
              - "Back to our story: open the chest, leave it, or go back? 🧭"
          asking_clarifying_questions:
            ai_feedback:
              tokens_for_ai: "Answer their question in the story's voice, briefly, without choosing for them."

  - section_id: "section_5"
    title: "The Riverbank Adventure"
    steps:
      - step_id: "step_1"
        title: "The Hidden Cave"
        content_blocks:
          - "Walking along the river, you spot a hidden cave entrance behind the reeds. Further on, mist rises from somewhere downstream."
        question: "Do you **enter the cave**, or **continue walking**? (Or **go back** to the river.) 🤔"
        tokens_for_ai: |
          - enter_cave: they go into the cave.
          - continue_walking: they keep walking along the river.
          - go_back: they return to where the boat was.
          - asking_clarifying_questions: they ask about the scene instead of choosing.
          - off_topic: anything else.
        buckets:
          - enter_cave
          - continue_walking
          - go_back
          - off_topic
          - asking_clarifying_questions
        transitions:
          enter_cave:
            content_blocks:
              - "Inside you find ancient artifacts & a map to a secret location. 🗺️"
            metadata_add:
              path_taken: "map"
            next_section_and_step: "section_8:step_1"
          continue_walking:
            content_blocks:
              - "The mist is a waterfall, & behind it a hidden path leads to a secret garden. 🌸"
            metadata_add:
              path_taken: "waterfall"
            next_section_and_step: "section_8:step_1"
          go_back:
            content_blocks:
              - "You walk back to the river's edge. 🔄"
            next_section_and_step: "section_2:step_1"
          off_topic:
            content_blocks:
              - "Back to our story: the cave, keep walking, or go back? 🧭"
          asking_clarifying_questions:
            ai_feedback:
              tokens_for_ai: "Answer their question in the story's voice, briefly, without choosing for them."

  - section_id: "section_6"
    title: "The Portal Adventure"
    steps:
      - step_id: "step_1"
        title: "The Magical Realm"
        content_blocks:
          - "You land in a magical realm full of wonders. A wise old wizard offers to teach you powerful spells."
        question: "Do you **learn spells** from the wizard, or **explore the realm** on your own? (Or **go back** to the clearing.) 🤔"
        tokens_for_ai: |
          - learn_spells: they accept the wizard's teaching.
          - explore_realm: they set off alone.
          - go_back: they return through the portal.
          - asking_clarifying_questions: they ask about the scene instead of choosing.
          - off_topic: anything else.
        buckets:
          - learn_spells
          - explore_realm
          - go_back
          - off_topic
          - asking_clarifying_questions
        transitions:
          learn_spells:
            content_blocks:
              - "The wizard teaches you spells that crackle at your fingertips. 🪄"
            metadata_add:
              path_taken: "spells"
            next_section_and_step: "section_8:step_1"
          explore_realm:
            content_blocks:
              - "You wander off & discover hidden treasures & magical creatures. 🦄"
            metadata_add:
              path_taken: "realm"
            next_section_and_step: "section_8:step_1"
          go_back:
            content_blocks:
              - "You step back through the portal into the clearing. 🔄"
            next_section_and_step: "section_3:step_1"
          off_topic:
            content_blocks:
              - "Back to our story: learn spells, explore, or go back? 🧭"
          asking_clarifying_questions:
            ai_feedback:
              tokens_for_ai: "Answer their question in the story's voice, briefly, without choosing for them."

  - section_id: "section_7"
    title: "The Clearing Adventure"
    steps:
      - step_id: "step_1"
        title: "The Hidden Garden"
        content_blocks:
          - "Past the clearing you find a hidden garden of rare plants. A friendly gardener looks up from the soil & smiles."
        question: "Do you **talk to the gardener**, or **explore the garden** on your own? (Or **go back** to the clearing.) 🤔"
        tokens_for_ai: |
          - talk_gardener: they speak with the gardener.
          - explore_garden: they explore alone.
          - go_back: they return to the clearing.
          - asking_clarifying_questions: they ask about the scene instead of choosing.
          - off_topic: anything else.
        buckets:
          - talk_gardener
          - explore_garden
          - go_back
          - off_topic
          - asking_clarifying_questions
        transitions:
          talk_gardener:
            content_blocks:
              - "The gardener shares the secrets of rare plants & their magical properties. 🌱"
            metadata_add:
              path_taken: "gardener"
            next_section_and_step: "section_8:step_1"
          explore_garden:
            content_blocks:
              - "You find hidden paths & secret corners full of rare plants & curious creatures. 🦋"
            metadata_add:
              path_taken: "garden"
            next_section_and_step: "section_8:step_1"
          go_back:
            content_blocks:
              - "You walk back to the clearing. 🔄"
            next_section_and_step: "section_3:step_1"
          off_topic:
            content_blocks:
              - "Back to our story: the gardener, the garden, or go back? 🧭"
          asking_clarifying_questions:
            ai_feedback:
              tokens_for_ai: "Answer their question in the story's voice, briefly, without choosing for them."

  - section_id: "section_8"
    title: "The Final Choices"
    steps:
      - step_id: "step_1"
        title: "The Final Encounter"
        content_blocks:
          - "Your path has led you to the final part of your adventure."
          - "A guardian of the forest steps from the trees & offers you a reward for your journey."
        question: "Do you **accept the reward**, or **decline it** & keep exploring? (Or **start over** at the fork.) 🤔"
        tokens_for_ai: |
          - accept_reward: they accept it.
          - decline_reward: they decline it.
          - go_back: they want to start over from the fork.
          - asking_clarifying_questions: they ask about the scene instead of choosing.
          - off_topic: anything else.
        buckets:
          - accept_reward
          - decline_reward
          - go_back
          - off_topic
          - asking_clarifying_questions
        transitions:
          accept_reward:
            content_blocks:
              - "The guardian hands you a magical artifact that hums with power. 🎉"
            ai_feedback:
              tokens_for_ai: "Close the story in two or three sentences that tie together the path they took (path_taken) & this reward."
            metadata_add:
              activity_completed: "true"
            next_section_and_step: "section_9:step_1"
          decline_reward:
            content_blocks:
              - "You thank the guardian & decline: the journey itself was the reward. 🌲"
            ai_feedback:
              tokens_for_ai: "Close the story in two or three sentences that tie together the path they took (path_taken) & this choice."
            metadata_add:
              activity_completed: "true"
            next_section_and_step: "section_9:step_1"
          go_back:
            content_blocks:
              - "The forest swirls, & you find yourself back at the fork. 🔄"
            metadata_remove: [path_taken]
            next_section_and_step: "section_1:step_1"
          off_topic:
            content_blocks:
              - "Back to our story: accept the reward, decline it, or start over? 🧭"
          asking_clarifying_questions:
            ai_feedback:
              tokens_for_ai: "Answer their question in the story's voice, briefly, without choosing for them."

  - section_id: "section_9"
    title: "Congratulations!"
    steps:
      - step_id: "step_1"
        title: "Well Done!"
        content_blocks:
          - "Congratulations on completing the Story Builder game! 🎉"
          - "Your choices shaped this adventure. Start the activity again to find a different ending. 🌟"
