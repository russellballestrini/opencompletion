title: "Game Theory in C"
description: "Code the Prisoner's Dilemma in C: a payoff struct, a 2D array of outcomes, a lookup function & a strategy enum."
kind: "lesson"
default_max_attempts_per_step: 3
classifier_model: "MODEL_1"
feedback_model: "MODEL_1"
tokens_for_ai_rubric: |
  Grade C code implementing game theory. Any valid C counts (struct or
  typedef, any field names); judge the ideas, not one exact syntax.

# Wrong answers stay on their step (partial_understanding & incorrect carry no
# next_section_and_step), so attempts count & hints escalate: a per-step
# *_tries counter picks which hint shows. Learner-facing text never shows C's
# nested initializer braces: our templates would read two opening braces as
# a template.

sections:
  - section_id: introduction
    title: Programming Game Theory in C
    steps:
      - step_id: welcome
        title: Systems Programming Meets Strategy
        content_blocks:
          - "# Game Theory Programming with C ⚙️🎮"
          - ""
          - "**Learn C by implementing game theory!**"
          - ""
          - "You'll learn to:"
          - "✓ Define game structures with structs"
          - "✓ Use 2D arrays for payoff matrices"
          - "✓ Pass arrays to functions"
          - "✓ Name strategies with enums"
          - ""
          - "**Prerequisites:**"
          - "- Basic C knowledge (variables, functions, arrays)"
          - "- Understanding of basic game theory concepts"
          - ""
          - "**Why C for game theory:**"
          - "- Performance for large simulations"
          - "- Memory efficiency"
          - "- Understanding low-level implementation"
        question: Ready to implement game theory in C?
        tokens_for_ai: "Any yes or willingness is 'ready'."
        allow_clarifying_questions: false
        buckets: [ready, set_language, off_topic]
        transitions:
          ready:
            metadata_add: {score: 0, concepts_mastered: 0}
            next_section_and_step: structures:step_1
          set_language:
            content_blocks: ["Language preference updated."]
            metadata_add: {language: "the-users-response"}
            counts_as_attempt: false
          off_topic:
            content_blocks: ["Say \"ready\" when you'd like to start."]
            counts_as_attempt: false

  - section_id: structures
    title: Defining Game Structures
    steps:
      - step_id: step_1
        title: Payoff Structure
        content_blocks:
          - "## Representing Payoffs in C 📐"
          - text: "_Progress: {{metadata.concepts_mastered}} of 4 concepts · {{metadata.score}} points_"
            show_if: {score_exists: true}
          - ""
          - "**The challenge:**"
          - "How do we represent a payoff (two player outcomes) in C?"
          - ""
          - "**Conceptual requirement:**"
          - "Each outcome has TWO values:"
          - "- Player 1's payoff"
          - "- Player 2's payoff"
          - ""
          - "**C solution: struct**"
          - "A struct groups related data together"
          - ""
          - "**Struct syntax reminder:**"
          - "```c"
          - "struct StructName {"
          - "    type field1;"
          - "    type field2;"
          - "};"
          - "```"
        question: "Define a C struct called 'Payoff' that contains two integer fields: 'player1' and 'player2' for storing each player's payoff."
        tokens_for_ai: "Their Payoff struct. `struct Payoff { int player1; int player2; };` or a typedef'd struct count; other field names are fine."
        bucket_criteria:
          correct: "A valid struct type Payoff with two int fields."
          partial_understanding: "A struct with one slip: a missing field, a non-int field, or the closing semicolon left out."
          incorrect: "Not a struct."
          off_topic: "Not about the task."
        required_elements:
          - "a struct type named Payoff (struct Payoff or a typedef)"
          - "two int fields, one per player's payoff"
        buckets: [correct, partial_understanding, incorrect, set_language, off_topic]
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Praise their struct; show using it: struct Payoff p; p.player1 = -1; p.player2 = -1;"
            metadata_add: {score: "n+2", concepts_mastered: "n+1"}
            next_section_and_step: structures:index_check
          partial_understanding:
            metadata_add: {struct_tries: "n+1"}
            content_blocks:
              - text: "💡 Hint: two `int` fields inside the braces, & a semicolon after the closing brace."
                show_if: {struct_tries_lt: 2}
              - text: "💡 Hint: each field is a type then a name, like `int player1;`."
                show_if: {struct_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Name the one missing or wrong piece. Show the full struct only if metadata.struct_tries is 3 or more."
          incorrect:
            metadata_add: {struct_tries: "n+1"}
            content_blocks:
              - text: "💡 Hint: follow the syntax reminder: `struct Payoff`, then the fields inside braces."
                show_if: {struct_tries_lt: 2}
              - text: "💡 Hint: each field is a type then a name, like `int player1;`."
                show_if: {struct_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Explain how a struct groups the two payoffs. Show the full struct only if metadata.struct_tries is 3 or more."
          set_language:
            content_blocks: ["Language preference updated."]
            metadata_add: {language: "the-users-response"}
            counts_as_attempt: false
          off_topic:
            content_blocks: ["Let's define the Payoff struct: two int fields."]

      - step_id: index_check
        title: "Quick Check: Indexing"
        content_blocks:
          - "Next, a 2D array will hold all four outcomes. Strategy 0 = cooperate, 1 = defect; the first index is player 1's strategy, the second player 2's."
        question_type: multiple_choice
        question: "Which cell holds \"player 1 defects, player 2 cooperates\"?"
        choices:
          - {id: a, text: "matrix[0][1]"}
          - {id: b, text: "matrix[1][0]"}
          - {id: c, text: "matrix[1][1]"}
          - {id: d, text: "matrix[0][0]"}
        answer: b
        transitions:
          correct:
            content_blocks: ["Right: player 1 defects (1), player 2 cooperates (0)."]
            metadata_add: {score: "n+1"}
            next_section_and_step: structures:step_2
          incorrect:
            content_blocks: ["Not quite: the first index is player 1's strategy."]

      - step_id: step_2
        title: Payoff Matrix with 2D Array
        content_blocks:
          - "## 2D Array for Game Matrix 🎯"
          - text: "_Progress: {{metadata.concepts_mastered}} of 4 concepts · {{metadata.score}} points_"
            show_if: {score_exists: true}
          - ""
          - "**Prisoner's Dilemma has:**"
          - "- 2 strategies per player: cooperate (0) or defect (1)"
          - "- 4 possible outcomes: (0,0), (0,1), (1,0), (1,1)"
          - ""
          - "**Array structure:**"
          - "- First index: player 1's strategy (0 or 1)"
          - "- Second index: player 2's strategy (0 or 1)"
          - "- Value: Payoff struct with both payoffs"
          - ""
          - "**Conceptual mapping:**"
          - "```"
          - "matrix[0][0] = both cooperate"
          - "matrix[0][1] = p1 cooperates, p2 defects"
          - "matrix[1][0] = p1 defects, p2 cooperates"
          - "matrix[1][1] = both defect"
          - "```"
          - ""
          - "You declare a 2D array of your Payoff struct, then initialize it with the four outcomes: an initializer per row, holding one initializer per Payoff."
        question: "Declare and initialize a 2D array called 'prisoners_dilemma' of Payoff structs representing the Prisoner's Dilemma game. Use indices 0=cooperate, 1=defect. Payoffs: both cooperate (-1,-1), both defect (-2,-2), one defects (0,-3) or (-3,0)."
        tokens_for_ai: |
          Their 2D Payoff array. Expected:
          struct Payoff prisoners_dilemma[2][2] = { { {-1, -1}, {-3, 0} }, { {0, -3}, {-2, -2} } };
          Row = player 1's strategy. Designated initializers or assigning each cell count too.
        bucket_criteria:
          correct: "A 2x2 Payoff array with all four payoffs in their right cells."
          partial_understanding: "A 2x2 Payoff array with a slip: a payoff swapped or in the wrong cell, or an initializer syntax error."
          incorrect: "Not a 2x2 array of Payoff."
          off_topic: "Not about the task."
        required_elements:
          - "a 2x2 array of Payoff named prisoners_dilemma"
          - "rows are player 1's strategy, columns player 2's (0 = cooperate)"
          - "the four payoffs in their right cells"
        buckets: [correct, partial_understanding, incorrect, set_language, off_topic]
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Praise their array; note prisoners_dilemma[0][1] is (-3, 0) & the layout is contiguous in memory."
            metadata_add: {score: "n+2", concepts_mastered: "n+1"}
            next_section_and_step: functions:step_1
          partial_understanding:
            metadata_add: {array_tries: "n+1"}
            content_blocks:
              - text: "💡 Hint: check cell [0][1]: player 1 cooperated & player 2 defected, so player 1 gets -3."
                show_if: {array_tries_lt: 2}
              - text: "💡 Hint: row 0 holds (-1,-1) then (-3,0); row 1 holds (0,-3) then (-2,-2). Each Payoff gets its own braces."
                show_if: {array_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Name the one cell or brace that's wrong. Show the full initialization only if metadata.array_tries is 3 or more."
          incorrect:
            metadata_add: {array_tries: "n+1"}
            content_blocks:
              - text: "💡 Hint: declare it as `struct Payoff prisoners_dilemma[2][2]`, then give one initializer per row."
                show_if: {array_tries_lt: 2}
              - text: "💡 Hint: row 0 holds (-1,-1) then (-3,0); row 1 holds (0,-3) then (-2,-2). Each Payoff gets its own braces."
                show_if: {array_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Explain declaring & initializing a 2D array of structs. Show the full initialization only if metadata.array_tries is 3 or more."
          set_language:
            content_blocks: ["Language preference updated."]
            metadata_add: {language: "the-users-response"}
            counts_as_attempt: false
          off_topic:
            content_blocks: ["Let's build the payoff array: 2x2, four Payoffs."]

  - section_id: functions
    title: Strategy Functions
    steps:
      - step_id: step_1
        title: Lookup Function
        content_blocks:
          - "## Querying the Payoff Matrix 🔍"
          - text: "_Progress: {{metadata.concepts_mastered}} of 4 concepts · {{metadata.score}} points_"
            show_if: {score_exists: true}
          - ""
          - "**Function requirements:**"
          - "- Name: `get_payoff`"
          - "- Parameters: 2D array (pointer), two strategy indices"
          - "- Returns: Payoff struct"
          - ""
          - "**C function concepts:**"
          - "- A 2D array parameter decays to a pointer to its rows"
          - "- Access with array indexing"
          - "- Return a struct by value"
        question: "Write a C function called 'get_payoff' that takes a 2D Payoff array (as pointer) and two integer strategy indices, then returns the Payoff struct for that strategy combination."
        tokens_for_ai: |
          Their get_payoff function. Parameter forms that count: struct Payoff m[2][2],
          struct Payoff m[][2], struct Payoff (*m)[2]. Body: return m[s1][s2];
        bucket_criteria:
          correct: "Returns struct Payoff, takes the array & two ints, returns the cell [s1][s2]."
          partial_understanding: "One slip: wrong return type, indices swapped, or an array parameter C won't accept (struct Payoff **)."
          incorrect: "No function, or no array lookup."
          off_topic: "Not about the task."
        required_elements:
          - "returns a struct Payoff"
          - "takes the 2x2 Payoff array & two int strategy indices"
          - "returns the cell at [player 1's strategy][player 2's strategy]"
        buckets: [correct, partial_understanding, incorrect, set_language, off_topic]
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Praise their function; show a call: struct Payoff p = get_payoff(prisoners_dilemma, 0, 1);"
            metadata_add: {score: "n+2", concepts_mastered: "n+1"}
            next_section_and_step: simulation:step_1
          partial_understanding:
            metadata_add: {lookup_tries: "n+1"}
            content_blocks:
              - text: "💡 Hint: the return type comes first: what kind of value comes back from one cell?"
                show_if: {lookup_tries_lt: 2}
              - text: "💡 Hint: `struct Payoff **` is not a 2D array; `struct Payoff m[2][2]` or `struct Payoff (*m)[2]` is."
                show_if: {lookup_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Name the one missing or wrong piece. Show a complete function only if metadata.lookup_tries is 3 or more."
          incorrect:
            metadata_add: {lookup_tries: "n+1"}
            content_blocks:
              - text: "💡 Hint: the body is a single `return` of one array cell."
                show_if: {lookup_tries_lt: 2}
              - text: "💡 Hint: `struct Payoff **` is not a 2D array; `struct Payoff m[2][2]` or `struct Payoff (*m)[2]` is."
                show_if: {lookup_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Explain passing a 2D array & indexing it. Show a complete function only if metadata.lookup_tries is 3 or more."
          set_language:
            content_blocks: ["Language preference updated."]
            metadata_add: {language: "the-users-response"}
            counts_as_attempt: false
          off_topic:
            content_blocks: ["Let's write `get_payoff`: the array & two strategies in, one Payoff out."]

  - section_id: simulation
    title: Game Simulation
    steps:
      - step_id: step_1
        title: Strategy Enumeration
        content_blocks:
          - "## Defining Strategies with Enum 🎲"
          - text: "_Progress: {{metadata.concepts_mastered}} of 4 concepts · {{metadata.score}} points_"
            show_if: {score_exists: true}
          - ""
          - "**Making code readable:**"
          - "Instead of 0 and 1, use named constants!"
          - ""
          - "**C enum for strategies:**"
          - "Enums give names to integer values"
          - ""
          - "**Why enums improve code:**"
          - "- get_payoff(game, COOPERATE, DEFECT) is clearer"
          - "- Better than get_payoff(game, 0, 1)"
          - "- Self-documenting code"
        question: "Define a C enum called 'Strategy' with two values: COOPERATE (equals 0) and DEFECT (equals 1)."
        tokens_for_ai: "Their Strategy enum: `enum Strategy { COOPERATE = 0, DEFECT = 1 };` or a typedef'd enum. Leaving the values implicit (0 & 1 by order) counts."
        bucket_criteria:
          correct: "A Strategy enum where COOPERATE is 0 & DEFECT is 1."
          partial_understanding: "An enum with a slip: a value missing or wrong, or the semicolon left out."
          incorrect: "Not an enum (#define constants or plain ints)."
          off_topic: "Not about the task."
        required_elements:
          - "an enum named Strategy"
          - "COOPERATE equal to 0"
          - "DEFECT equal to 1"
        buckets: [correct, partial_understanding, incorrect, set_language, off_topic]
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Celebrate: their code now reads get_payoff(prisoners_dilemma, COOPERATE, DEFECT)."
            metadata_add: {score: "n+2", concepts_mastered: "n+1", activity_completed: "true"}
            next_section_and_step: simulation:wrap_up
          partial_understanding:
            metadata_add: {enum_tries: "n+1"}
            content_blocks:
              - text: "💡 Hint: list both names inside the braces, separated by a comma, & end with a semicolon."
                show_if: {enum_tries_lt: 2}
              - text: "💡 Hint: `NAME = value` sets a value; without one, an enum counts from 0."
                show_if: {enum_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Name the one missing or wrong piece. Show the enum only if metadata.enum_tries is 3 or more."
          incorrect:
            metadata_add: {enum_tries: "n+1"}
            content_blocks:
              - text: "💡 Hint: the shape is like a struct's, with the keyword `enum` & names in place of fields."
                show_if: {enum_tries_lt: 2}
              - text: "💡 Hint: `NAME = value` sets a value; without one, an enum counts from 0."
                show_if: {enum_tries_gte: 2}
            ai_feedback:
              tokens_for_ai: "Explain how an enum differs from #define constants. Show the enum only if metadata.enum_tries is 3 or more."
          set_language:
            content_blocks: ["Language preference updated."]
            metadata_add: {language: "the-users-response"}
            counts_as_attempt: false
          off_topic:
            content_blocks: ["Let's define the Strategy enum: COOPERATE and DEFECT."]

      - step_id: wrap_up
        title: Game Over
        content_blocks:
          - "# Well Played! 🏆"
          - text: "You coded **{{metadata.concepts_mastered}} of 4** concepts & scored **{{metadata.score}}** points."
            show_if: {score_exists: true}
          - ""
          - "You built a payoff struct, a 2D matrix, a lookup function & a strategy enum."
          - "**Next:** write `enum Strategy tit_for_tat(enum Strategy opponent_last)` & play 100 rounds in a loop."
