title: "Financial Literacy for Teens"
description: "Money basics for teens: budgeting, saving, investing, credit, debt, goals, taxes, smart spending & scams."
kind: "lesson"
default_max_attempts_per_step: 3
tokens_for_ai_rubric: |
  The learner is a teenager. Be friendly, concrete & brief; use teen-sized
  examples (a part-time job, a phone, a first car).
  Accept any valid answer in their own words; never require exact phrasing.

# metadata.score counts correct answers; the first question starts it at 0
# on every bucket so the closing screen always has a number.
sections:
  - section_id: "section_1"
    title: "Introduction to Financial Literacy"
    steps:
      - step_id: "step_1"
        title: "What is Financial Literacy?"
        content_blocks:
          - "# Financial Literacy for Teens 💰"
          - "Financial literacy means knowing how to manage money: budgeting, saving, investing & understanding credit."
        question: "In your own words, what is financial literacy?"
        tokens_for_ai: "Grade their definition."
        bucket_criteria:
          correct: "Knowing how to manage money well (any of budgeting, saving, investing, credit counts as an example)."
          partial_understanding: "Mentions money but not managing it or making decisions with it."
          off_topic: "Not about money."
        required_elements:
          - "understanding how to manage money"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct! Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what someone who is 'good with money' knows how to do, without the answer."
            metadata_add:
              score: "n+0"
          off_topic:
            content_blocks:
              - "Let's focus on money: what does it mean to be good at handling it?"
            metadata_add:
              score: "n+0"

      - step_id: "step_2"
        title: "Importance of Financial Literacy"
        question: "Why is financial literacy important?"
        tokens_for_ai: "Grade their reason."
        bucket_criteria:
          correct: "Gives a real benefit: better money decisions, avoiding debt, reaching goals, planning for the future, avoiding scams."
          partial_understanding: "Says it matters but names no benefit."
          off_topic: "Not about money."
        required_elements:
          - "a concrete benefit"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct! Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what could go wrong for someone who never learns about money, without the answer."
          off_topic:
            content_blocks:
              - "Think about your future self. How could knowing about money help?"

  - section_id: "section_2"
    title: "Budgeting"
    steps:
      - step_id: "step_1"
        title: "What is a Budget?"
        content_blocks:
          - "A budget is a plan for how you will spend & save your money."
        question: "Why is having a budget useful?"
        tokens_for_ai: "Grade their reason."
        bucket_criteria:
          correct: "Tracks income vs. spending so you live within your means, save, or avoid running out."
          partial_understanding: "Restates 'a plan for money' without saying what it achieves."
          off_topic: "Not about budgets."
        required_elements:
          - "keeping spending within income (or making room to save)"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct: a budget keeps spending under what comes in. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what happens when spending is bigger than income, without the answer."
          off_topic:
            content_blocks:
              - "Picture your paycheck from a summer job. How does a budget help with it?"

      - step_id: "step_2"
        title: "Creating a Budget"
        content_blocks:
          - "Budgets sort expenses into needs (food, rent) and wants (games, dining out)."
        question: "What are the basic steps to create a budget?"
        tokens_for_ai: "Grade their steps."
        bucket_criteria:
          correct: "Lists income AND lists or sorts expenses (needs vs. wants, or setting limits)."
          partial_understanding: "Covers only income or only expenses."
          off_topic: "Not about making a budget."
        required_elements:
          - "list your income"
          - "list or sort your expenses"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct: income in, expenses out, then set limits. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Name which side (money in or money out) is missing, without spelling it out."
          off_topic:
            content_blocks:
              - "Think in two columns: money in & money out. What goes where?"

  - section_id: "section_3"
    title: "Saving Money"
    steps:
      - step_id: "step_1"
        title: "Why Save Money?"
        question: "Why is it important to save money?"
        tokens_for_ai: "Grade their reason."
        bucket_criteria:
          correct: "Gives a real reason: reaching goals, covering surprise expenses, avoiding debt, future security."
          partial_understanding: "Says saving is good but not why."
          off_topic: "Not about saving."
        required_elements:
          - "a concrete reason to save"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct: savings are your cushion & your goal fund. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what they'd do if their phone broke tomorrow, without the answer."
          off_topic:
            content_blocks:
              - "Think about something you want, or a surprise bill. Why save?"

      - step_id: "step_2"
        title: "How to Save Money"
        question: "How can you save money effectively?"
        tokens_for_ai: "Grade their method."
        bucket_criteria:
          correct: "Gives a real method: set aside a portion regularly (pay yourself first), a savings account, automatic transfers, cutting wants."
          partial_understanding: "Says 'save more' without a method."
          off_topic: "Not about saving."
        required_elements:
          - "a concrete saving method"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct: setting aside a part of every paycheck, in a savings account that earns interest, works wonders. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what they'd do the day they get paid, without the answer."
          off_topic:
            content_blocks:
              - "Think about the day you get paid. What could you do first to save?"

  - section_id: "section_4"
    title: "Investing"
    steps:
      - step_id: "step_1"
        title: "What is Investing?"
        content_blocks:
          - "Investing puts money into assets that can grow over time."
        question: "How is investing different from saving?"
        tokens_for_ai: "Grade the difference they describe."
        bucket_criteria:
          correct: "Investing aims for growth (higher returns) but carries risk; saving is safer with lower returns."
          partial_understanding: "Gives only the growth side or only the risk side."
          off_topic: "Not about investing."
        required_elements:
          - "investing aims to grow money over time"
          - "investing carries more risk than saving"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct: more growth, more risk. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask for the missing side (growth or risk), without the answer."
          off_topic:
            content_blocks:
              - "Think of a savings account vs. buying shares. What's the trade-off?"

      - step_id: "step_2"
        title: "Types of Investments"
        content_blocks:
          - "Each type of investment has its own risk & return."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Pick EVERY one that is a type of investment."
        choices:
          - {id: a, text: "Stocks"}
          - {id: b, text: "Bonds"}
          - {id: c, text: "A credit card balance"}
          - {id: d, text: "Mutual funds"}
          - {id: e, text: "Real estate"}
        answer: [a, b, d, e]
        answer_mode: all
        transitions:
          correct:
            content_blocks:
              - "Correct! Stocks, bonds, mutual funds & real estate. A credit card balance is debt. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            metadata_add:
              investment_misses: "n+1"
            content_blocks:
              - text: "Not the whole set. Hint: four of these can grow your money."
                show_if:
                  investment_misses_lt: 2
              - text: "Hint: only one of these is money you owe."
                show_if:
                  investment_misses_gte: 2

  - section_id: "section_5"
    title: "Understanding Credit"
    steps:
      - step_id: "step_1"
        title: "What is Credit?"
        content_blocks:
          - "Credit lets you buy now & pay later."
        question: "What is credit, and what is the catch?"
        tokens_for_ai: "Grade the definition & the catch."
        bucket_criteria:
          correct: "Borrowing money you must repay AND a catch: interest, fees, or debt if not repaid."
          partial_understanding: "Gives only the definition or only the catch."
          off_topic: "Not about credit."
        required_elements:
          - "borrowing money with a promise to repay"
          - "a cost or risk (interest, fees, debt)"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct! Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask for the missing half, without the answer."
          off_topic:
            content_blocks:
              - "Think about a credit card. What does it let you do, and what does it cost?"

      - step_id: "step_2"
        title: "Credit Scores"
        content_blocks:
          - "A credit score is a number that sums up your credit history."
        question: "Why does your credit score matter?"
        tokens_for_ai: "Grade their reason."
        bucket_criteria:
          correct: "Lenders (or landlords) use it to judge risk, so it affects whether you get loans & their interest rates."
          partial_understanding: "Says a good score is good but not who uses it or why."
          off_topic: "Not about credit scores."
        required_elements:
          - "lenders use it to decide whether, or at what rate, to lend to you"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct: a good score means easier approvals & lower interest. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask who looks at the score when you want a car loan, without the answer."
          off_topic:
            content_blocks:
              - "Imagine applying for your first car loan. Who checks your score, and why?"

  - section_id: "section_6"
    title: "Avoiding Debt"
    steps:
      - step_id: "step_1"
        title: "What is Debt?"
        content_blocks:
          - "Debt is money you owe, from loans, credit cards or other borrowing."
        question: "Why is it important to manage debt?"
        tokens_for_ai: "Grade their reason."
        bucket_criteria:
          correct: "Interest makes it grow, it can hurt your credit score, or it can become unpayable."
          partial_understanding: "Says debt is bad but not why."
          off_topic: "Not about debt."
        required_elements:
          - "a real consequence of unmanaged debt"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct! Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what interest does to a balance left unpaid, without the answer."
          off_topic:
            content_blocks:
              - "Think about a credit card bill left unpaid for a year. What happens?"

      - step_id: "step_2"
        title: "Managing Debt"
        question: "How can you manage debt effectively?"
        tokens_for_ai: "Grade their strategies."
        bucket_criteria:
          correct: "Gives a real strategy: pay on time, pay high-interest debt first, don't borrow more than you can repay, make a payoff plan."
          partial_understanding: "Says 'pay it off' with no strategy."
          off_topic: "Not about debt."
        required_elements:
          - "a concrete strategy"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct: pay on time, highest interest first. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask which debt they'd pay first if they had two, without the answer."
          off_topic:
            content_blocks:
              - "You owe on two cards, one at 25% interest & one at 10%. What's your plan?"

  - section_id: "section_7"
    title: "Planning for the Future"
    steps:
      - step_id: "step_1"
        title: "Setting Financial Goals"
        content_blocks:
          - "Goals can be short-term (a new phone) or long-term (college)."
        question: "Name one financial goal you could set, and how you'd reach it."
        tokens_for_ai: "Any sensible goal with a plan is correct."
        bucket_criteria:
          correct: "Names a goal AND a way to reach it (an amount, a deadline, saving a set sum each week...)."
          partial_understanding: "Names a goal with no plan, or a plan with no goal."
          off_topic: "Not about money goals."
        required_elements:
          - "a specific goal"
          - "a plan to reach it"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Praise their goal & suggest one way to make it more specific."
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask for the missing half (the goal or the plan)."
          off_topic:
            content_blocks:
              - "Think of something you want to buy. How much, and by when?"

      - step_id: "step_2"
        title: "Building an Emergency Fund"
        content_blocks:
          - "An emergency fund is money set aside for surprises like medical bills or car repairs."
        question: "Why have an emergency fund, and about how much should it hold?"
        tokens_for_ai: "Grade the reason & the size."
        bucket_criteria:
          correct: "Covers unexpected expenses without borrowing AND about 3 to 6 months of living expenses (any figure in that range)."
          partial_understanding: "Gives only the reason or only the size."
          off_topic: "Not about emergency funds."
        required_elements:
          - "covers surprise expenses without going into debt"
          - "about 3 to 6 months of living expenses"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct: 3 to 6 months of expenses keeps a surprise from becoming debt. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask for the missing half; for the size, hint that it's counted in months of expenses."
          off_topic:
            content_blocks:
              - "Your car breaks down. How does an emergency fund help, and how big should it be?"

  - section_id: "section_8"
    title: "Understanding Taxes"
    steps:
      - step_id: "step_1"
        title: "What are Taxes?"
        content_blocks:
          - "Taxes are required payments to the government from people & businesses."
        question: "What do taxes pay for?"
        tokens_for_ai: "Grade their answer."
        bucket_criteria:
          correct: "Names public services: schools, roads, healthcare, emergency services, parks..."
          partial_understanding: "Says 'the government' without what it provides."
          off_topic: "Not about taxes."
        required_elements:
          - "public services"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct: schools, roads, healthcare & more. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what they used today that the public pays for, without the answer."
          off_topic:
            content_blocks:
              - "Think of your school or the road outside. Who pays for them?"

      - step_id: "step_2"
        title: "Filing Taxes"
        content_blocks:
          - "Filing taxes means sending a tax return that reports your income & works out what you owe (or get back)."
        question: "Why should you file your taxes accurately & on time?"
        tokens_for_ai: "Grade their reason."
        bucket_criteria:
          correct: "To avoid penalties, interest or legal trouble (getting a refund owed also counts)."
          partial_understanding: "Says it's required but not what happens otherwise."
          off_topic: "Not about filing taxes."
        required_elements:
          - "avoiding penalties (or claiming a refund)"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct! Many teens with part-time jobs even get a refund. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what happens if you file late, without the answer."
          off_topic:
            content_blocks:
              - "What might happen if you miss the tax deadline?"

  - section_id: "section_9"
    title: "Smart Spending"
    steps:
      - step_id: "step_1"
        title: "Needs vs. Wants"
        content_blocks:
          - "Needs are essential for living. Wants are things you'd like but can live without."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Pick EVERY need."
        choices:
          - {id: a, text: "Groceries"}
          - {id: b, text: "The newest phone"}
          - {id: c, text: "Rent"}
          - {id: d, text: "Concert tickets"}
          - {id: e, text: "A winter coat"}
        answer: [a, c, e]
        answer_mode: all
        transitions:
          correct:
            content_blocks:
              - "Correct! Food, shelter & warmth. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            metadata_add:
              needs_misses: "n+1"
            content_blocks:
              - text: "Not quite. Hint: three of these you can't live without."
                show_if:
                  needs_misses_lt: 2
              - text: "Hint: think food, shelter & staying warm."
                show_if:
                  needs_misses_gte: 2

      - step_id: "step_2"
        title: "Making Smart Purchases"
        question: "How can you make smart purchases?"
        tokens_for_ai: "Grade their strategies."
        bucket_criteria:
          correct: "Gives a real strategy: compare prices, read reviews, consider long-term value, wait before impulse buys, stick to a budget."
          partial_understanding: "Says 'spend less' with no strategy."
          off_topic: "Not about spending."
        required_elements:
          - "a concrete strategy"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct! Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what they'd check before buying new headphones, without the answer."
          off_topic:
            content_blocks:
              - "You want new headphones. What do you do before buying?"

  - section_id: "section_10"
    title: "Protecting Your Finances"
    steps:
      - step_id: "step_1"
        title: "Avoiding Scams"
        content_blocks:
          - "Scams are tricks to steal your money or personal information."
        question: "How can you recognize & avoid a scam?"
        tokens_for_ai: "Grade the sign & the defence."
        bucket_criteria:
          correct: "Gives a warning sign (unsolicited contact, pressure, too good to be true, asks for financial info) AND a defence (don't share info, verify independently, hang up)."
          partial_understanding: "Gives only a sign or only a defence."
          off_topic: "Not about scams."
        required_elements:
          - "a warning sign of a scam"
          - "a way to avoid it"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct! Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask for the missing half (how to spot it, or what to do), without the answer."
          off_topic:
            content_blocks:
              - "A text says you won $1,000 & asks for your bank login. What's wrong, and what do you do?"

      - step_id: "step_2"
        title: "Identity Theft"
        content_blocks:
          - "Identity theft is someone stealing your personal information to commit fraud."
        question: "How can you protect yourself against identity theft?"
        tokens_for_ai: "Grade their protections."
        bucket_criteria:
          correct: "Gives a real protection: strong unique passwords, 2FA, sharing little personal info online, shredding documents, checking statements."
          partial_understanding: "Says 'be careful' with no protection."
          off_topic: "Not about identity theft."
        required_elements:
          - "a concrete protection"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Correct! Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
              activity_completed: "true"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what they'd change about their passwords or social media, without the answer."
          off_topic:
            content_blocks:
              - "Think about your passwords & what you post online. How could you protect yourself?"

  - section_id: "section_11"
    title: "Congratulations!"
    steps:
      - step_id: "step_1"
        title: "Well Done!"
        content_blocks:
          - "# Course Complete! 🎓"
          - "You scored **{{metadata.score}} of 20**."
          - "Budget, save, invest wisely, use credit carefully & guard your information. Keep building your money skills!"
