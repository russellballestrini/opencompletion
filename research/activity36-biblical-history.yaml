  - step_id: step_2
    title: Ancient Literature and Parallels
    content_blocks:
    - '## Ancient Near Eastern Texts'
    - The Bible wasn't written in isolation - it emerged from a world rich in literature.
    - ''
    - '**Atrahasis (~1700 BCE) & the Epic of Gilgamesh, tablet XI (Mesopotamia):**'
    - '- Contains a flood story remarkably similar to Noah''s flood'
    - '- Utnapishtim builds an ark, saves animals, sends out birds, lands on a mountain'
    - '- Written down centuries before most scholars date the Genesis flood account'
    - ''
    - '**Code of Hammurabi (Babylon, ~1750 BCE):**'
    - '- Ancient law code with similarities to biblical law'
    - '- ''Eye for an eye'' appears in Hammurabi and later in Exodus'
    - '- Predates biblical law codes by centuries'
    - ''
    - '**Enuma Elish (Babylon, ~1100 BCE):**'
    - '- Creation story with parallels to Genesis'
    - '- Order from chaos, separation of waters, creation of humans'
    - ''
    - '**Archaeological Discovery:**'
    - 'These texts were found on clay tablets in the 1800s-1900s. Many scholars think biblical writers knew and reworked these traditions; others see a shared Near Eastern heritage behind both. Either way, Genesis tells the story its own way: one God, and a moral reason for the flood.'
    question: What does it mean that biblical stories have parallels in earlier Mesopotamian literature? Does this make the Bible less historically significant, or does it tell us something interesting about how ancient peoples shared and adapted stories?
    tokens_for_ai: 'This is a sophisticated question about cultural context and transmission.


      Looking for:

      - Understanding that cultures influence each other

      - Recognition that adaptation shows engagement with traditions

      - Historical vs religious significance distinction

      - Sophisticated view of ancient literature

      '
    bucket_criteria:
      sophisticated_cultural_analysis: Understands literary borrowing and adaptation
      cultural_exchange_view: Sees parallels as normal cultural interaction
      theological_concern: 'Weighs what the parallels mean for faith: engage respectfully'
      historical_significance: Focuses on what this tells us historically
      partial_understanding: General thoughts
      limited_effort: Very brief
      off_topic: Unrelated
    feedback_tokens_for_ai: 'Engage thoughtfully. Ancient cultures influenced each other through conquest, trade, and

      migration. Biblical writers adapted earlier stories but transformed them (monotheism vs

      polytheism, moral emphasis, etc.). This is how literature works in the ancient world.

      If they express theological concern, acknowledge it but focus on historical perspective.

      '
    buckets:
    - sophisticated_cultural_analysis
    - cultural_exchange_view
    - theological_concern
    - historical_significance
    - partial_understanding
    - limited_effort
    - off_topic
    transitions:
      sophisticated_cultural_analysis:
        ai_feedback:
          tokens_for_ai: Excellent literary and cultural analysis! Biblical writers took existing stories and transformed them to reflect their monotheistic worldview. This is sophisticated engagement with tradition, not mere copying.
        metadata_add:
          score: n+3
          critical_thinking: n+1
        next_section_and_step: israelite_history:step_1
      cultural_exchange_view:
        ai_feedback:
          tokens_for_ai: Good understanding of cultural exchange! Ancient peoples shared stories across cultures. Biblical writers adapted these stories to express their own theological and moral perspectives.
        metadata_add:
          score: n+2
        next_section_and_step: israelite_history:step_1
      theological_concern:
        ai_feedback:
          tokens_for_ai: I understand the concern. From a historical perspective, adaptation shows engagement with surrounding cultures. Biblical writers transformed polytheistic stories into monotheistic ones - this is creative theological work.
        metadata_add:
          score: n+2
        next_section_and_step: israelite_history:step_1
      historical_significance:
        ai_feedback:
          tokens_for_ai: Good historical perspective! These parallels show us how ideas traveled in the ancient world and how biblical writers creatively adapted traditions.
        metadata_add:
          score: n+2
          critical_thinking: n+1
        next_section_and_step: israelite_history:step_1
      partial_understanding:
        ai_feedback:
          tokens_for_ai: 'You''re thinking about this. Consider: Shakespeare adapted earlier plays. Does that make his work less significant, or does it show how great writers transform traditions?'
        metadata_add:
          score: n+1
        next_section_and_step: israelite_history:step_1
      limited_effort:
        content_blocks:
        - Think about how ancient cultures influenced each other. What might it mean that biblical writers knew and adapted earlier stories?
      off_topic:
        content_blocks:
        - Let's think about the parallels between biblical and earlier Mesopotamian stories. What do these similarities tell us?
- section_id: israelite_history
  title: Israelite History and Archaeology
  steps:
  - step_id: step_1
    title: The Exodus Question
    content_blocks:
    - '## Exodus: History or Memory? 🏜️'
    - The Exodus story is central to Jewish identity - but what do we know historically?
    - ''
    - '**The Biblical Account:**'
    - '- Israelites enslaved in Egypt'
    - '- Moses leads them out through the Red Sea'
    - '- 40 years wandering in the Sinai desert'
    - '- Conquest of Canaan under Joshua'
    - ''
    - '**Archaeological Evidence:**'
    - '- **No Egyptian record** names Israelite slaves or an exodus'
    - '- **No archaeological evidence** of 2 million people in Sinai for 40 years'
    - '- **No evidence of sudden conquest** of Canaan - instead, gradual emergence of Israelite settlements in highlands'
    - '- **Merneptah Stele (1208 BCE):** Egyptian inscription mentions ''Israel'' as a people in Canaan'
    - ''
    - '**Where scholars stand:**'
    - '- Many archaeologists conclude that a smaller group, if any, left Egypt, and that the text''s numbers are not literal'
    - '- Many see Israel emerging largely from within Canaan''s highland population'
    - '- Others (e.g. James Hoffmeier, Kenneth Kitchen) argue the story''s Egyptian details fit Egypt''s New Kingdom, and that a desert journey would leave little trace'
    - '- Whatever its history, the Exodus became the founding story of Israelite identity'
    - ''
    - '**Why Founding Stories Matter:**'
    - Every culture has origin stories that define identity - US Declaration of Independence, Romulus and Remus for Rome, etc.
    question: Historians disagree about how much of the Exodus happened as told. Would the story be less important if it is not literal history? What's the difference between historical fact and historical significance, and why might a people preserve and retell such a story?
    tokens_for_ai: 'This is a sophisticated question about myth, history, and identity.


      Looking for:

      - Distinction between literal history and meaning

      - Understanding of foundation myths

      - Recognition that stories shape identity even if not factual

      - Nuanced thinking about truth and significance

      '
    bucket_criteria:
      sophisticated_analysis: Distinguishes historical fact from historical/cultural significance
      myth_understanding: Grasps function of foundation myths
      identity_focus: Sees story's role in shaping group identity
      troubled_by_historicity: 'Defends the account''s history, or is troubled by doubts about it: engage respectfully'
      partial_understanding: General thoughts
      limited_effort: Very brief
      off_topic: Unrelated
    feedback_tokens_for_ai: 'Engage thoughtfully. Foundation myths aren''t ''lies'' - they''re how peoples understand

      themselves. The Exodus story of liberation from oppression became central to Jewish

      identity and later inspired other liberation movements (civil rights, etc.). Historical

      significance isn''t the same as historical accuracy. If troubled by non-historicity,

      acknowledge their concern while explaining the distinction.

      '
    buckets:
    - sophisticated_analysis
    - myth_understanding
    - identity_focus
    - troubled_by_historicity
    - partial_understanding
    - limited_effort
    - off_topic
    transitions:
      sophisticated_analysis:
        ai_feedback:
          tokens_for_ai: Excellent sophisticated thinking! You understand that stories can be historically significant even if not literally factual. The Exodus story shaped Jewish identity and inspired liberation movements worldwide.
        metadata_add:
          score: n+3
          critical_thinking: n+1
        next_section_and_step: israelite_history:quiz_merneptah
      myth_understanding:
        ai_feedback:
          tokens_for_ai: Good understanding of foundation myths! Every culture has origin stories that define who they are. Historical accuracy matters less than the story's role in shaping identity.
        metadata_add:
          score: n+2
        next_section_and_step: israelite_history:quiz_merneptah
      identity_focus:
        ai_feedback:
          tokens_for_ai: Important insight about identity! The Exodus story defines Jewish identity as a people freed from slavery. This narrative inspired countless later liberation movements.
        metadata_add:
          score: n+2
          critical_thinking: n+1
        next_section_and_step: israelite_history:quiz_merneptah
      troubled_by_historicity:
        ai_feedback:
          tokens_for_ai: I understand the concern. From a historical perspective, we can distinguish between literal factuality and cultural/historical significance. The Exodus story's impact on history is undeniable even if the events as described didn't occur.
        metadata_add:
          score: n+2
        next_section_and_step: israelite_history:quiz_merneptah
      partial_understanding:
        ai_feedback:
          tokens_for_ai: 'Think about other foundation stories: George Washington and the cherry tree probably didn''t happen, but it expresses American values. Does that make it unimportant?'
      limited_effort:
        content_blocks:
        - 'Consider: Can a story be important even if it''s not literally factual? Think about how stories shape group identity.'
      off_topic:
        content_blocks:
        - Let's think about the Exodus story's significance. Can stories be important even if not literally historical?
  - step_id: quiz_merneptah
    title: 'Quick Check: Earliest ''Israel'''
    question_type: multiple_choice
    question: Which inscription holds the earliest known mention of 'Israel' outside the Bible?
    choices:
    - id: a
      text: The Merneptah Stele
    - id: b
      text: The Tel Dan Stele
    - id: c
      text: The Cyrus Cylinder
    - id: d
      text: The Dead Sea Scrolls
    answer: a
    hints:
    - attempt: 1
      text: '💡 Hint: It''s Egyptian, and named after a pharaoh.'
    - attempt: 2
      text: '💡 Bigger hint: The Tel Dan Stele mentions the ''House of David'', centuries later.'
    transitions:
      correct:
        content_blocks:
        - '✅ The Merneptah Stele (~1208 BCE): an Egyptian pharaoh boasts of defeating ''Israel'', already a people in Canaan.'
        metadata_add:
          score: n+1
      incorrect:
        metadata_add:
          misses_quiz_merneptah: n+1
        content_blocks:
        - text: Not quite.
          show_if:
            misses_quiz_merneptah_lt: 3
        - text: 'Not this time. The answer: The Merneptah Stele (~1208 BCE).'
          show_if:
            misses_quiz_merneptah_gte: 3
  - step_id: step_2
    title: United Monarchy and Division
    content_blocks:
    - '## Kings David and Solomon'
    - '**Biblical Account:**'
    - '- David unites tribes into a kingdom (~1000 BCE)'
    - '- Solomon builds the First Temple in Jerusalem (~950 BCE)'
    - '- Kingdom splits after Solomon''s death into Israel (north) and Judah (south)'
    - ''
    - '**Archaeological Evidence:**'
    - '- **Tel Dan Stele (9th century BCE):** Mentions ''House of David'' - first non-biblical reference to David'
    - '- **Little direct evidence** for Solomon''s temple (its site cannot be excavated), and debated evidence for his building projects'
    - '- **Debated:** some (e.g. Israel Finkelstein) find little sign of a large 10th-century kingdom; others (e.g. Amihai Mazar, Yosef Garfinkel at Khirbet Qeiyafa) argue for a real, if modest, state'
    - '- **Evidence of division:** Northern kingdom (Israel) and southern kingdom (Judah) had different pottery, architecture, practices'
    - ''
    - '**One common reconstruction:**'
    - '- David and Solomon were real rulers of a smaller kingdom than the text describes'
    - '- Later writers (many date these books to the late monarchy or the exile) enlarged their stories into a golden age'
    - '- The ''united monarchy'' may have been more limited than biblical account suggests'
    - ''
    - '**Why It Matters:**'
    - After the Babylonian exile (586 BCE), Jews longed for restoration of the Davidic monarchy
    - This hope shaped messianic expectations
    question: Many scholars think writers during or after the exile portrayed David and Solomon's kingdom as grander than the evidence shows. If so, what purpose would an idealized past serve for a people in exile? (If you read the evidence differently, say why.)
    tokens_for_ai: 'Looking for understanding of:

      - Writing in response to trauma/loss

      - Idealized past as hope for future

      - How suffering shapes memory

      - Messianic hopes

      '
    bucket_criteria:
      sophisticated_analysis: Connects exile trauma to idealization of past
      hope_focus: Sees idealized past as source of hope
      identity_maintenance: Recognizes role in preserving identity during crisis
      literary_purpose: Understands narrative function
      partial_understanding: General thoughts
      limited_effort: Very brief
      off_topic: Unrelated
    feedback_tokens_for_ai: 'Engage their thinking about trauma and memory. People in exile, having lost everything,

      would remember a ''golden age'' and hope for its restoration. The idealized past provides

      both identity and hope for the future. This shapes messianic expectations - hope for a

      new David to restore the kingdom.

      '
    buckets:
    - sophisticated_analysis
    - hope_focus
    - identity_maintenance
    - literary_purpose
    - partial_understanding
    - limited_effort
    - off_topic
    transitions:
      sophisticated_analysis:
        ai_feedback:
          tokens_for_ai: Excellent analysis of trauma and memory! In exile, an idealized past provides identity and hope for restoration. This shaped Jewish messianic expectations - longing for a new David.
        metadata_add:
          score: n+3
          critical_thinking: n+1
        next_section_and_step: exile_return:step_1
      hope_focus:
        ai_feedback:
          tokens_for_ai: Important insight about hope! The golden age of David/Solomon became a vision for the future - restoration of past glory. This shaped centuries of messianic hope.
        metadata_add:
          score: n+2
        next_section_and_step: exile_return:step_1
      identity_maintenance:
        ai_feedback:
          tokens_for_ai: Good understanding of identity! In exile, remembering a glorious past helped maintain Jewish identity and hope when everything was lost.
        metadata_add:
          score: n+2
          critical_thinking: n+1
        next_section_and_step: exile_return:step_1
      literary_purpose:
        ai_feedback:
          tokens_for_ai: Good literary analysis! The idealized monarchy served narrative and theological purposes - explaining why exile happened and what restoration might look like.
        metadata_add:
          score: n+2
        next_section_and_step: exile_return:step_1
      partial_understanding:
        ai_feedback:
          tokens_for_ai: Think about how people in crisis remember the past. If you've lost everything (exile), how might you remember 'the good old days'?
        metadata_add:
          score: n+1
        next_section_and_step: exile_return:step_1
      limited_effort:
        content_blocks:
        - 'Consider: if you''ve lost your homeland (exile), why might you idealize the past? What purpose would that serve?'
      off_topic:
