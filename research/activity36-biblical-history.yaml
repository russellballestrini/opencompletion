- section_id: exile_return
  title: Exile, Return, and Second Temple Period
  steps:
  - step_id: step_1
    title: Babylonian Exile
    content_blocks:
    - '## The Babylonian Exile (586-539 BCE)'
    - '**Historical Events:**'
    - '- 586 BCE: Babylonians destroy Jerusalem and Solomon''s Temple'
    - '- Judah''s elite are exiled to Babylon'
    - '- 539 BCE: Persians conquer Babylon'
    - '- 538 BCE: Persian King Cyrus allows Jews to return'
    - ''
    - '**Why the Exile Was Transformative:**'
    - ''
    - '**Before Exile:**'
    - '- Temple-centered worship in Jerusalem'
    - '- Sacrifices performed by priests'
    - '- David''s descendants ruled as kings'
    - ''
    - '**After Exile:**'
    - '- In the following centuries synagogues emerged (gathering places for prayer & study; earliest evidence: 3rd-century BCE Egypt)'
    - '- Torah (written law) became central'
    - '- Scribes and teachers of the Torah gained importance (rabbis came later, after 70 CE)'
    - '- Monotheism became strictly defined'
    - ''
    - '**The Exile Forced Questions:**'
    - '- Why did God allow Jerusalem to fall?'
    - '- Can we worship God without the Temple?'
    - '- What does it mean to be Jewish in foreign lands?'
    - '- How do we maintain identity without a homeland?'
    - ''
    - '**Many scholars think much of the Hebrew Bible was edited or compiled during or after the exile**'
    - The experience of exile profoundly shaped how the Bible was written.
    question: The Babylonian exile forced Judaism to transform from a temple-based, land-based religion to one that could survive without either. Why do you think this crisis led to such religious creativity rather than the religion's disappearance?
    tokens_for_ai: 'Looking for understanding of:

      - Crisis forcing adaptation

      - Innovation from necessity

      - Portable religion (Torah, synagogues)

      - Identity maintenance in diaspora

      '
    bucket_criteria:
      sophisticated_analysis: Understands how crisis drives innovation
      adaptation_focus: Emphasizes flexibility and change
      portable_religion: Recognizes creation of non-territorial religion
      identity_focus: Sees response to threat of assimilation
      partial_understanding: General thoughts
      limited_effort: Very brief
      off_topic: Unrelated
    feedback_tokens_for_ai: 'Engage their thinking about crisis and adaptation. The exile could have ended Judaism,

      but instead sparked innovation: synagogues, written Torah, rabbis. This created a

      portable religion that could survive anywhere. This is one of history''s great examples

      of religious innovation in response to crisis.

      '
    buckets:
    - sophisticated_analysis
    - adaptation_focus
    - portable_religion
    - identity_focus
    - partial_understanding
    - limited_effort
    - off_topic
    transitions:
      sophisticated_analysis:
        ai_feedback:
          tokens_for_ai: 'Excellent analysis of crisis and innovation! The exile threatened Judaism''s existence but sparked creativity: Torah, synagogues, and rabbis created a religion that could survive anywhere. This is a pivotal moment in religious history.'
        metadata_add:
          score: n+3
          critical_thinking: n+1
        next_section_and_step: exile_return:quiz_cyrus
      adaptation_focus:
        ai_feedback:
          tokens_for_ai: Good understanding of adaptation! Faced with the Temple's destruction, Judaism transformed rather than disappeared. This flexibility ensured survival.
        metadata_add:
          score: n+2
        next_section_and_step: exile_return:quiz_cyrus
      portable_religion:
        ai_feedback:
          tokens_for_ai: Excellent insight! The exile created a 'portable' religion - Torah scrolls, synagogues, and practices that worked anywhere. This allowed Judaism to survive dispersal worldwide.
        metadata_add:
          score: n+2
          critical_thinking: n+1
        next_section_and_step: exile_return:quiz_cyrus
      identity_focus:
        ai_feedback:
          tokens_for_ai: Important point about identity! The threat of assimilation in Babylon forced Jews to define what made them distinctive - leading to emphasis on Torah and practices.
        metadata_add:
          score: n+2
        next_section_and_step: exile_return:quiz_cyrus
      partial_understanding:
        ai_feedback:
          tokens_for_ai: Think about what Judaism needed to survive without Temple and land. What innovations made religion 'portable'?
        metadata_add:
          score: n+1
        next_section_and_step: exile_return:quiz_cyrus
      limited_effort:
        content_blocks:
        - 'Consider: the Temple was destroyed, the land was lost. What changes would allow Judaism to survive anyway?'
      off_topic:
        content_blocks:
        - Let's think about how the exile transformed Judaism. Why did crisis lead to innovation rather than disappearance?
  - step_id: quiz_cyrus
    title: 'Quick Check: The Return'
    question_type: multiple_choice
    question: Which king allowed exiled Jews to return from Babylon in 538 BCE?
    choices:
    - id: a
      text: Nebuchadnezzar II of Babylon
    - id: b
      text: Cyrus the Great of Persia
    - id: c
      text: Alexander the Great
    - id: d
      text: Darius III of Persia
    answer: b
    hints:
    - attempt: 1
      text: '💡 Hint: Nebuchadnezzar destroyed Jerusalem; he did not send anyone home.'
    - attempt: 2
      text: '💡 Bigger hint: He was Persian, and conquered Babylon in 539 BCE.'
    transitions:
      correct:
