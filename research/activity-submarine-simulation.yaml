  # ============================================================================
  # EMERGENCIES SECTION - Random emergencies
  # ============================================================================
  - section_id: "emergencies"
    title: "Emergency Response"
    steps:
      - step_id: "handle_emergency"
        title: "Emergency!"
        question: "🚨 **{{metadata.emergency_type}}!** The alarm is still sounding & the crew is moving. What do you do?"
        tokens_for_ai: |
          An emergency is underway; judge how the learner responds.

          Evaluate user's response:
          - 'good_response' if they take appropriate action (muster, follow procedures, assist)
          - 'learning' if they're uncertain but willing
          - 'confused' if they don't know what to do
          - 'panic' if they panic (discourage this gently)
          - 'set_language'

        feedback_tokens_for_ai: |
          Describe the emergency in metadata.emergency_type dramatically.

          If fire: Smoke, alarm, crew rushing with firefighting equipment, announcements.
          If flooding: Water spraying, crew shutting valves, damage control.
          If reactor scram: Sudden shutdown, emergency lighting, crew responding calmly but urgently.
          If torpedo: Sonar call "TORPEDO IN THE WATER!", evasive maneuvers ordered.

          Evaluate user's response and have crew guide them appropriately.
          Emergencies are serious but crew is trained and competent.

          After handling emergency, return to exploration.

        buckets: [good_response, learning, confused, panic, set_language]

        transitions:
          good_response:
            ai_feedback:
              tokens_for_ai: |
                Praise their response. Describe crew successfully handling the emergency.
                The situation is brought under control. Crew commends user for staying calm.
                Emergency is resolved.
            metadata_add:
              emergency_experience: "n+1"
            next_section_and_step: "emergencies:return_to_post"

          learning:
            ai_feedback:
              tokens_for_ai: |
                A senior crew member guides them through the emergency response.
                User learns proper procedures. Emergency is handled successfully.
                Educational moment.
            metadata_add:
              emergency_experience: "n+1"
            next_section_and_step: "emergencies:return_to_post"

          confused:
            ai_feedback:
              tokens_for_ai: |
                Crew quickly directs the user to safety and handles the emergency.
                Afterwards, they explain what happened and what the proper response should be.
                Learning opportunity.
            metadata_add:
              emergency_experience: "n+1"
            next_section_and_step: "emergencies:return_to_post"

          panic:
            ai_feedback:
              tokens_for_ai: |
                A calm Chief Petty Officer steadies the user: "Easy there, sailor. We've trained for this.
                Watch how we handle it." Crew professionally resolves the emergency.
                User learns that training and teamwork overcome emergencies.
            metadata_add:
              emergency_experience: "n+1"
            next_section_and_step: "emergencies:return_to_post"

          set_language:
            content_blocks:
              - "Language updated."
            metadata_add:
              language: "the-users-response"
            counts_as_attempt: false
            next_section_and_step: "emergencies:handle_emergency"


      # Emergencies & daily tasks come here, then back to the compartment the
      # learner was in (current_section, set by every hatch transition).
      - step_id: "return_to_post"
        title: "Back to Your Post"
        content_blocks:
          - "You head back to your post."
          - "Emergencies handled: {{metadata.emergency_experience}} · Tasks pitched in on: {{metadata.tasks_completed}}"
        next_section_and_step:
          - if:
              current_section: "torpedo_room"
            goto: "navigation_hub:torpedo_room"
          - elif:
              current_section: "officers_quarters"
            goto: "navigation_hub:officers_quarters"
          - elif:
              current_section: "control_room"
            goto: "navigation_hub:control_room"
          - elif:
              current_section: "sonar_room"
            goto: "navigation_hub:sonar_room"
          - elif:
              current_section: "crews_mess"
            goto: "navigation_hub:crews_mess"
          - elif:
              current_section: "crew_berthing"
            goto: "navigation_hub:crew_berthing"
          - elif:
              current_section: "missile_compartment"
            goto: "navigation_hub:missile_compartment"
          - elif:
              current_section: "reactor_compartment"
            goto: "navigation_hub:reactor_compartment"
          - elif:
              current_section: "engine_room"
            goto: "navigation_hub:engine_room"
          - elif:
              current_section: "maneuvering_room"
            goto: "navigation_hub:maneuvering_room"
          - elif:
              current_section: "auxiliary_machinery"
            goto: "navigation_hub:auxiliary_machinery"
          - elif:
              current_section: "stern_compartment"
            goto: "navigation_hub:stern_compartment"
          - else: true
            goto: "navigation_hub:forward_escape_trunk"

  # ============================================================================
  # DAILY TASKS SECTION - Random daily tasks
  # ============================================================================
  - section_id: "daily_tasks"
    title: "Daily Tasks and Drills"
    steps:
      - step_id: "handle_task"
        title: "Task Assignment"
        question: "📋 **{{metadata.task_type}}**: a task has come up for whoever is nearby. What do you do?"
        tokens_for_ai: |
          A routine task has come up; judge how the learner responds.

          Categorize user response:
          - 'volunteer' if they volunteer to help
          - 'observe' if they want to watch
          - 'participate' if they want to participate
          - 'decline' if they politely decline
          - 'set_language'

        feedback_tokens_for_ai: |
          Describe the daily task in metadata.task_type.

          Submarine life is routine tasks, watches, drills, maintenance.
          Tasks are announced over 1MC (announcing system) or by supervisors.

          If user participates, describe the task and their involvement.
          If they observe, they learn by watching.
          If they decline, that's okay - they can continue exploring.

          Make it realistic and educational.

        buckets: [volunteer, observe, participate, decline, set_language]

        transitions:
          volunteer:
            ai_feedback:
              tokens_for_ai: |
                User volunteers to help. Describe them assisting with the task.
                Crew appreciates their help. User learns about submarine daily operations.
                Task completed successfully.
            metadata_add:
              tasks_completed: "n+1"
            next_section_and_step: "emergencies:return_to_post"

          observe:
            ai_feedback:
              tokens_for_ai: |
                User observes the crew performing the task.
                Educational - they learn by watching professionals work.
                Crew explains what they're doing.
            metadata_add:
              tasks_observed: "n+1"
            next_section_and_step: "emergencies:return_to_post"

          participate:
            ai_feedback:
              tokens_for_ai: |
                User participates in the task under supervision.
                Hands-on learning. Crew guides them through it.
                User gains practical experience.
            metadata_add:
              tasks_completed: "n+1"
            next_section_and_step: "emergencies:return_to_post"

          decline:
            ai_feedback:
              tokens_for_ai: |
                User politely declines. Crew understands - they continue with the task.
                User is free to continue exploring.
            next_section_and_step: "emergencies:return_to_post"

          set_language:
            content_blocks:
              - "Language updated."
            metadata_add:
              language: "the-users-response"
            counts_as_attempt: false
            next_section_and_step: "daily_tasks:handle_task"

  # ============================================================================
  # DEBRIEF - the way to finish: reached by "debrief" in any compartment
  # ============================================================================
  - section_id: "debrief"
    title: "Debrief & Qualification"
    steps:
      - step_id: "captain_debrief"
        title: "Report to the Captain"
        content_blocks:
          - "# Debrief with Captain Morrison ⚓"
          - "**Captain Morrison:** 'Sit down, sailor. Let's see what you learned.'"
          - ""
          - "- Emergencies handled: {{metadata.emergency_experience}}"
          - "- Tasks pitched in on: {{metadata.tasks_completed}}"
          - text: "- You made it past the reactor, all the way to the stern. That's walking the boat."
            show_if:
              visited_sections_contains: "stern_compartment"
          - text: "- You never made it aft of the reactor. A qualified sailor knows every compartment."
            show_if:
              visited_sections_not_contains: "stern_compartment"
          - ""
          - "**Captain Morrison:** 'Before you earn your dolphins, three questions from the qualification board.'"

      - step_id: "qual_power"
        title: "Qualification: Propulsion"
        question_type: multiple_choice
        question: "What turns the propeller on a nuclear submarine?"
        choices:
          - {id: a, text: "The reactor spins the shaft directly"}
          - {id: b, text: "Reactor heat makes steam, & steam turbines turn the shaft"}
          - {id: c, text: "Diesel engines, with the reactor as a backup"}
          - {id: d, text: "Batteries charged in port"}
        answer: b
        transitions:
          correct:
            content_blocks:
              - "**Captain:** 'Right. Fission heats the primary coolant, the steam generators boil secondary water, & steam turns the main turbines.'"
            metadata_add:
              qual_score: "n+1"
            next_section_and_step: "debrief:qual_air"
          incorrect:
            content_blocks:
              - "**Captain:** 'Think back to the steam generators aft of the reactor. What do they feed?'"

      - step_id: "qual_air"
        title: "Qualification: Atmosphere"
        question_type: multiple_choice
        question: "Submerged for months, where does the crew's oxygen come from?"
        choices:
          - {id: a, text: "Splitting seawater by electrolysis"}
          - {id: b, text: "Air tanks filled before the patrol"}
          - {id: c, text: "Snorkeling at the surface every night"}
        answer: a
        transitions:
          correct:
            content_blocks:
              - "**Captain:** 'Correct. The oxygen generators split water into oxygen & hydrogen, & the CO2 scrubbers take out what we breathe out.'"
            metadata_add:
              qual_score: "n+1"
            next_section_and_step: "debrief:qual_escape"
          incorrect:
            content_blocks:
              - "**Captain:** 'Not quite. Remember the auxiliary machinery room: what is all around us that holds oxygen?'"

      - step_id: "qual_escape"
        title: "Qualification: Watertight Doors"
        question_type: multiple_choice
        question: "Why can't a torpedo tube's outer door open while its inner door is open?"
        choices:
          - {id: a, text: "To save hydraulic pressure"}
          - {id: b, text: "An interlock stops the sea from flooding into the boat"}
          - {id: c, text: "So the torpedo can't be fired by accident"}
        answer: b
        transitions:
          correct:
            content_blocks:
              - "**Captain:** 'Exactly. One door to the sea at a time, every time.'"
            metadata_add:
              qual_score: "n+1"
            next_section_and_step: "debrief:last_word"
          incorrect:
            content_blocks:
              - "**Captain:** 'Picture both doors open at depth. What comes in?'"

      - step_id: "last_word"
        title: "A Last Word"
        content_blocks:
          - "**Qualification board: {{metadata.qual_score}} of 3.**"
          - text: "**Captain Morrison:** 'Clean sweep. Well done, sailor.'"
            show_if:
              qual_score_gte: 3
          - text: "**Captain Morrison:** 'Study the boat some more. Every sailor aboard can save it.'"
            show_if:
              qual_score_lt: 3
        question: "**Captain Morrison:** 'One last thing: what would you tell a recruit about life aboard? Or say you want to keep exploring.'"
        tokens_for_ai: |
          - 'reflection' if they share any thought about life or work aboard
          - 'keep_exploring' if they want to go back aboard and explore more
          - 'set_language' if changing language
        buckets: [reflection, keep_exploring, set_language]
        transitions:
          reflection:
            ai_feedback:
              tokens_for_ai: "As Captain Morrison, answer their advice in two sentences, then dismiss them warmly."
            metadata_add:
              activity_completed: "true"
            next_section_and_step: "debrief:farewell"
          keep_exploring:
            content_blocks:
              - "**Captain Morrison:** 'Carry on, sailor. Report back when you're ready.'"
            counts_as_attempt: false
            next_section_and_step: "emergencies:return_to_post"
          set_language:
            content_blocks:
              - "Language preference updated."
            metadata_add:
              language: "the-users-response"
            counts_as_attempt: false
            next_section_and_step: "debrief:last_word"

      - step_id: "farewell"
        title: "Farewell"
        content_blocks:
          - "# Tour Complete 🌊⚓"
          - "You climb the ladder out of the forward escape trunk into daylight."
          - "Qualification board: {{metadata.qual_score}} of 3 · Emergencies handled: {{metadata.emergency_experience}} · Tasks pitched in on: {{metadata.tasks_completed}}"
          - "Thanks for sailing with USS Virginia. Fair winds & following seas!"
