title: "All About Elephants"
description: "A gentle lesson for young learners: elephant types, trunks, ears, herds, talk & how to help them."
kind: "lesson"
default_max_attempts_per_step: 3
tokens_for_ai_rubric: |
  The learner is about 7 years old. Be warm, simple & brief.
  Any answer holding the idea counts, in their own words; spelling never matters.

# metadata.stars counts correct answers; the first question starts it at 0
# on every bucket so the closing screen always has a number.
sections:
  - section_id: "section_1"
    title: "Introduction to Elephants"
    steps:
      - step_id: "step_1"
        title: "What is an Elephant?"
        content_blocks:
          - "# Welcome to the world of elephants! 🐘"
          - "Elephants are the largest land animals on Earth. They are known for their big ears, long trunks & tusks."
        question: "What do you know about elephants?"
        tokens_for_ai: "Any true fact about elephants is correct."
        bucket_criteria:
          correct: "Shares at least one true fact about elephants."
          partial_understanding: "Mentions elephants but says nothing true about them yet."
          off_topic: "Not about elephants."
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Great! You know about elephants. ⭐"
            ai_feedback:
              tokens_for_ai: "Praise the fact they shared & add one fun elephant fact."
            metadata_add:
              stars: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Kindly share one fact from the lesson & invite them to try again."
            metadata_add:
              stars: "n+0"
          off_topic:
            content_blocks:
              - "Let's stay with elephants! Tell me anything you know about them."
            metadata_add:
              stars: "n+0"

      - step_id: "step_2"
        title: "Where Do Elephants Live?"
        content_blocks:
          - "Elephants live in different parts of the world."
          - "There are two main kinds of elephants, & each is named after where it lives."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Pick BOTH kinds of elephants."
        choices:
          - {id: a, text: "African elephants"}
          - {id: b, text: "Arctic elephants"}
          - {id: c, text: "Asian elephants"}
          - {id: d, text: "Australian elephants"}
        answer: [a, c]
        answer_mode: all
        transitions:
          correct:
            content_blocks:
              - "Yes! African elephants live in Africa & Asian elephants live in Asia. ⭐ Stars: {{metadata.stars}}"
            metadata_add:
              stars: "n+1"
          incorrect:
            content_blocks:
              - "Not quite! Pick two. Hint: elephants love warm places, never icy ones."

  - section_id: "section_2"
    title: "Elephant Anatomy"
    steps:
      - step_id: "step_1"
        title: "Elephant Trunks"
        content_blocks:
          - "Elephants have long trunks that they use for many things."
          - "They use their trunks to drink water, pick up food & even to greet other elephants."
        question: "What do elephants use their trunks for?"
        tokens_for_ai: "Grade whether they name a real use of a trunk."
        bucket_criteria:
          correct: "Names at least one real use: drinking, eating or picking things up, smelling, breathing, greeting or touching, spraying water."
          partial_understanding: "Talks about the trunk but names no real use."
          off_topic: "Not about elephant trunks."
        required_elements:
          - "a real use of the trunk"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Great! You know how elephants use their trunks. ⭐ Stars: {{metadata.stars}}"
            ai_feedback:
              tokens_for_ai: "Praise the use they named & add one more they didn't."
            metadata_add:
              stars: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what an elephant does when it is thirsty or hungry, without giving the answer."
          off_topic:
            content_blocks:
              - "Let's think about trunks! What might an elephant do with its long nose?"

      - step_id: "step_2"
        title: "Elephant Ears"
        content_blocks:
          - "Elephants live in hot places, & their big ears are very useful there."
        question: "Why do elephants have big ears?"
        tokens_for_ai: "Grade whether they say the ears help keep the elephant cool."
        bucket_criteria:
          correct: "Says big ears help keep the elephant cool (flapping or fanning counts)."
          partial_understanding: "Mentions flapping or hot weather but not cooling, or another true use only (hearing)."
          off_topic: "Not about elephant ears."
        required_elements:
          - "the ears help the elephant stay cool"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Excellent! Elephants flap their ears like fans to stay cool. ⭐ Stars: {{metadata.stars}}"
            metadata_add:
              stars: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what they do on a hot day to cool down, without giving the answer."
          off_topic:
            content_blocks:
              - "Let's think about ears! Hint: elephants live where it is very hot."

  - section_id: "section_3"
    title: "Elephant Behavior"
    steps:
      - step_id: "step_1"
        title: "Elephant Families"
        content_blocks:
          - "Elephants live together in big families."
          - "A family is usually led by the oldest female elephant."
        question: "What is a group of elephants called, and who leads it?"
        tokens_for_ai: "Grade both parts: the group's name & its leader."
        bucket_criteria:
          correct: "Says herd AND that the oldest female (the matriarch, a grandma elephant) leads."
          partial_understanding: "Gets one part only."
          off_topic: "Not about elephant groups."
        required_elements:
          - "the group is a herd"
          - "the oldest female (matriarch) leads it"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Great! A herd, led by the matriarch. ⭐ Stars: {{metadata.stars}}"
            metadata_add:
              stars: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Praise the part they got & ask for the other part, without giving it."
          off_topic:
            content_blocks:
              - "Let's think about elephant families! What is a group of elephants called?"

      - step_id: "step_2"
        title: "Elephant Communication"
        content_blocks:
          - "Elephants talk to each other in more than one way."
          - "Some of their sounds are so low that humans can't hear them!"
        question: "How do elephants communicate with each other?"
        tokens_for_ai: "Grade whether they name a real way elephants communicate."
        bucket_criteria:
          correct: "Names at least one real way: sounds (trumpeting, rumbling), touch, or vibrations through the ground."
          partial_understanding: "Says they communicate but names no way."
          off_topic: "Not about elephant communication."
        required_elements:
          - "a real way elephants communicate"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Excellent! Trumpets, rumbles, touch & even ground vibrations. ⭐ Stars: {{metadata.stars}}"
            metadata_add:
              stars: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what noise an elephant makes, without giving the answer."
          off_topic:
            content_blocks:
              - "Let's think about elephant talk! What sound does an elephant make?"

  - section_id: "section_4"
    title: "Elephant Conservation"
    steps:
      - step_id: "step_1"
        title: "Why Elephants Need Our Help"
        content_blocks:
          - "Elephants are amazing animals, but many are in danger."
          - "Some lose the forests & grasslands they live in, & some are hunted for their tusks."
        question: "Why do elephants need our help?"
        tokens_for_ai: "Grade whether they name a real threat to elephants."
        bucket_criteria:
          correct: "Names a real threat: losing their home (habitat), hunting or poaching for ivory, or conflict with people."
          partial_understanding: "Says elephants are in danger but not why."
          off_topic: "Not about elephants needing help."
        required_elements:
          - "a real threat to elephants"
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            content_blocks:
              - "Great! You understand why elephants need our help. ⭐ Stars: {{metadata.stars}}"
            metadata_add:
              stars: "n+1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Ask what might happen if an elephant's forest is cut down, without giving the answer."
          off_topic:
            content_blocks:
              - "Let's think about it! What could make life hard for an elephant?"

      - step_id: "step_2"
        title: "How We Can Help Elephants"
        content_blocks:
          - "There are many ways we can help elephants."
        question: "Can you think of a way to help elephants?"
        tokens_for_ai: "Any sensible idea that could help elephants is correct."
        bucket_criteria:
          correct: "Offers at least one sensible way to help (protect their homes, never buy ivory, support a sanctuary or charity, learn & tell others)."
          partial_understanding: "Wants to help but offers no idea yet."
          off_topic: "Not about helping elephants."
        buckets: [correct, partial_understanding, off_topic]
        transitions:
          correct:
            ai_feedback:
              tokens_for_ai: "Celebrate their idea & add one more way a child can help."
            metadata_add:
              stars: "n+1"
              activity_completed: "true"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Suggest thinking about telling friends or never buying ivory, & invite one idea."
          off_topic:
            content_blocks:
              - "Let's think together! What could you do to help elephants?"

  - section_id: "section_5"
    title: "Congratulations!"
    steps:
      - step_id: "step_1"
        title: "You're an Elephant Expert!"
        content_blocks:
          - "# 🎉 Congratulations! You're an elephant expert!"
          - "You earned **{{metadata.stars}} of 8 stars** ⭐"
          - "You now know:"
          - "✅ The two kinds of elephants & where they live"
          - "✅ How elephants use their trunks & ears"
          - "✅ How elephant families live & talk"
          - "✅ Why elephants need our help, & how to give it"
          - "Keep learning & caring about animals! 🐘🌟"
