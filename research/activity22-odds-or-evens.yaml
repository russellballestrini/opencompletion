# What our Activities gallery shows for this activity (optional: see SPEC.yaml).
title: "Odds or Evens"
description: "Throw 0 to 5 fingers & call odd or even against a historical figure, with a running score."
kind: "game"
default_max_attempts_per_step: 30
# Answers are moves ("3 odd"): our built-in clarifying bucket would misread them.
allow_clarifying_questions: false

sections:
  - section_id: "section_1"
    title: "Odds and Evens with History"
    steps:

      - step_id: "step_0"
        title: "Challenge a Historical Figure"
        content_blocks:
          - "Welcome to the Odds and Evens challenge! 🎮"
          - "You will be playing against a random historical figure. Each of you throws 0 to 5 fingers & calls **odd** or **even**: whoever called the sum right wins the round (both right or both wrong is a tie)."
          - "Say **exit** when you've had enough."

      - step_id: "step_1"
        title: "Throw Your Fingers"
        question: "How many fingers do you throw, & odd or even? (for example `3 odd`) 🤔"
        tokens_for_ai: |
          - throw_fingers: anything that could be a throw (a number and/or odd or even); our script checks it.
          - set_language: they ask to play in another language.
          - exit: they want to stop, quit or leave.
        # Our script reads the throw, plays the figure's & keeps score: any
        # text at all is handled (a throw it can't read asks again kindly).
        processing_script: |
          import random
          import re

          text = str(metadata.get("user_response") or "").lower()
          numbers = re.findall(r"\d+", text)
          words = {"zero": 0, "one": 1, "two": 2, "three": 3, "four": 4, "five": 5}
          numbers += [str(n) for w, n in words.items() if re.search(r"\b" + w + r"\b", text)]
          calls = [c for c in ("odd", "even") if re.search(r"\b" + c + r"s?\b", text)]
          fingers = int(numbers[0]) if len(numbers) == 1 else None

          if fingers is None or not 0 <= fingers <= 5 or len(calls) != 1:
              metadata["round_note"] = "🤔 I need one number of fingers from 0 to 5 **and** odd or even, for example `3 odd`. No round played."
              script_result = {"valid": False}
          else:
              call = calls[0]
              theirs = random.randint(0, 5)
              their_call = random.choice(["odd", "even"])
              total = fingers + theirs
              result = "even" if total % 2 == 0 else "odd"
              you_right = call == result
              they_right = their_call == result
              for key in ("rounds", "wins", "losses", "ties"):
                  metadata[key] = int(metadata.get(key) or 0)
              metadata["rounds"] += 1
              if you_right and not they_right:
                  metadata["wins"] += 1
                  verdict = "You win this round! 🎉"
              elif they_right and not you_right:
                  metadata["losses"] += 1
                  verdict = "Your opponent wins this round. 😤"
              else:
                  metadata["ties"] += 1
                  verdict = "A tie! 🤝"
              metadata["round_note"] = (
                  f"You: **{fingers}** & **{call}** · Opponent: **{theirs}** & **{their_call}** → "
                  f"{fingers} + {theirs} = **{total}**, **{result}**. {verdict}\n\n"
                  f"Score: **{metadata['wins']}** won · **{metadata['losses']}** lost · **{metadata['ties']}** tied"
              )
              script_result = {"valid": True, "sum": total, "result": result, "verdict": verdict}
        feedback_tokens_for_ai: |
          Speak in first person as one historical figure (keep the same figure all game). Never mention machine learning.
          The round is decided & shown already (round_note): never recount it or change any number.
          If processing_script_result.valid is false, just ask kindly for a number from 0 to 5 and odd or even.
          Otherwise add one witty fact in character, & a word on the score.
        buckets:
          - throw_fingers
          - set_language
          - exit
        transitions:
          throw_fingers:
            run_processing_script: true
            content_blocks:
              - "{{metadata.round_note}}"
            ai_feedback:
              tokens_for_ai: "React to the round in character."
            next_section_and_step: "section_1:step_1"
          set_language:
            content_blocks:
              - "Language preference updated. Please continue in your preferred language."
            metadata_add:
              language: "the-users-response"
            counts_as_attempt: false
            next_section_and_step: "section_1:step_1"
          exit:
            metadata_add:
              activity_completed: "true"
            next_section_and_step: "section_2:step_1"

  - section_id: "section_2"
    title: "Goodbye"
    steps:
      - step_id: "step_1"
        title: "Exit"
        content_blocks:
          - text: "Final score after {{metadata.rounds}} rounds: **{{metadata.wins}}** won · **{{metadata.losses}}** lost · **{{metadata.ties}}** tied."
            show_if:
              rounds_gte: 1
          - "Thank you for playing! We hope you enjoyed the game. Have a great day! 🌟"
