title: "Mario Trivia"
description: "Nine quick picks about Mario: his first game, friends, foes, power-ups & worlds."
kind: "game"
default_max_attempts_per_step: 3

# Every question is a pick: graded by its answer key, no model asked.
# A wrong pick stays on the question (3 tries), then the game moves on.
# metadata.score counts first-time-or-later right picks; the first question's
# incorrect transition starts it at 0 so the final screen always has a number.
sections:
  - section_id: "section_1"
    title: "Introduction to Mario"
    steps:
      - step_id: "step_1"
        title: "Who is Mario?"
        content_blocks:
          - "# Welcome to Mario Trivia! 🍄"
          - "Nine questions. Pick a letter (or tap a button). Three tries each."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Who is Mario?"
        choices:
          - {id: a, text: "A plumber & Nintendo's mascot hero"}
          - {id: b, text: "A race car driver from Sega"}
          - {id: c, text: "A wizard from a fantasy novel"}
          - {id: d, text: "A chef from a cooking show"}
        answer: a
        transitions:
          correct:
            content_blocks:
              - "Right! Mario is Nintendo's mustached plumber. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: think of a red cap, a mustache & pipes."
            metadata_add:
              score: "n+0"

      - step_id: "step_2"
        title: "Mario's First Game"
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Which game did Mario first appear in (1981)?"
        choices:
          - {id: a, text: "Super Mario Bros."}
          - {id: b, text: "Donkey Kong"}
          - {id: c, text: "Mario Kart"}
          - {id: d, text: "Pac-Man"}
        answer: b
        transitions:
          correct:
            content_blocks:
              - "Yes! In Donkey Kong he was called Jumpman. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: his first game is named after a giant ape."

  - section_id: "section_2"
    title: "Mario's Friends and Foes"
    steps:
      - step_id: "step_1"
        title: "Mario's Friends"
        content_blocks:
          - "Mario has many friends who help him on his adventures."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Pick EVERY one of Mario's friends."
        choices:
          - {id: a, text: "Luigi"}
          - {id: b, text: "Bowser"}
          - {id: c, text: "Yoshi"}
          - {id: d, text: "Princess Peach"}
          - {id: e, text: "Goomba"}
        answer: [a, c, d]
        answer_mode: all
        transitions:
          correct:
            content_blocks:
              - "All three! Luigi, Yoshi & Peach. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not the whole set: there are three friends here, & no villains."

      - step_id: "step_2"
        title: "Mario's Foes"
        content_blocks:
          - "Mario also has many enemies that he has to defeat."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Who is Mario's arch-enemy, the King of the Koopas?"
        choices:
          - {id: a, text: "Wario"}
          - {id: b, text: "Toad"}
          - {id: c, text: "Bowser"}
          - {id: d, text: "Donkey Kong"}
        answer: c
        transitions:
          correct:
            content_blocks:
              - "Yes, Bowser! A giant fire-breathing turtle. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: he is a huge spiked turtle who keeps kidnapping Peach."

  - section_id: "section_3"
    title: "Mario's Adventures"
    steps:
      - step_id: "step_1"
        title: "Super Mario Bros."
        content_blocks:
          - "One of the most famous Mario games is Super Mario Bros., released in 1985."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "What is the main goal in Super Mario Bros.?"
        choices:
          - {id: a, text: "Win the Grand Prix"}
          - {id: b, text: "Rescue Princess Peach from Bowser"}
          - {id: c, text: "Collect every star in the castle"}
          - {id: d, text: "Build the tallest tower"}
        answer: b
        transitions:
          correct:
            content_blocks:
              - "Right! \"Our princess is in another castle!\" Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: someone royal needs saving."

      - step_id: "step_2"
        title: "Mario Kart"
        content_blocks:
          - "Mario Kart is a racing series starring Mario & his friends."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "What is the main goal in a Mario Kart race?"
        choices:
          - {id: a, text: "Finish first, using items to get ahead"}
          - {id: b, text: "Jump on as many Goombas as possible"}
          - {id: c, text: "Collect 100 coins before the timer ends"}
        answer: a
        transitions:
          correct:
            content_blocks:
              - "Yes! Banana peels & shells help. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: it's a racing game."

  - section_id: "section_4"
    title: "Mario's Power-Ups"
    steps:
      - step_id: "step_1"
        title: "Super Mushroom"
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "What does the Super Mushroom do?"
        choices:
          - {id: a, text: "Lets Mario throw fireballs"}
          - {id: b, text: "Makes Mario big, so he can take an extra hit"}
          - {id: c, text: "Makes Mario invincible"}
          - {id: d, text: "Gives Mario an extra life"}
        answer: b
        transitions:
          correct:
            content_blocks:
              - "Right! Small Mario becomes Super Mario. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: the name says it's *super*: think size. (The green 1-Up mushroom is the extra life.)"

      - step_id: "step_2"
        title: "Fire Flower"
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "What does the Fire Flower do?"
        choices:
          - {id: a, text: "Lets Mario throw fireballs"}
          - {id: b, text: "Makes Mario fly"}
          - {id: c, text: "Shrinks Mario"}
        answer: a
        transitions:
          correct:
            content_blocks:
              - "Yes! Fireballs defeat enemies from a distance. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: the clue is in the name."

  - section_id: "section_5"
    title: "Mario's Worlds"
    steps:
      - step_id: "step_1"
        title: "Mushroom Kingdom"
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Who rules the Mushroom Kingdom?"
        choices:
          - {id: a, text: "Bowser"}
          - {id: b, text: "Luigi"}
          - {id: c, text: "Princess Peach"}
          - {id: d, text: "Yoshi"}
        answer: c
        transitions:
          correct:
            content_blocks:
              - "Right! Peach rules the Mushroom Kingdom. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: the one Mario keeps rescuing."

      - step_id: "step_2"
        title: "Bowser's Castle"
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Where do you usually face Bowser at the end of a Mario game?"
        choices:
          - {id: a, text: "Rainbow Road"}
          - {id: b, text: "Bowser's Castle"}
          - {id: c, text: "Yoshi's Island"}
        answer: b
        transitions:
          correct:
            content_blocks:
              - "Yes! Lava, Thwomps & a bridge over fire. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
              activity_completed: "true"
          incorrect:
            content_blocks:
              - "Not quite: the villain fights at home."
            metadata_add:
              activity_completed: "true"

      - step_id: "step_3"
        title: "The End"
        content_blocks:
          - "# Game Over! 🏁"
          - "You scored **{{metadata.score}} out of 9**."
          - text: "A true Mario expert! ⭐"
            show_if:
              score_gte: 8
          - text: "Nice run! Try again to beat your score."
            show_if:
              score_lt: 8
