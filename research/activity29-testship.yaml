default_max_attempts_per_step: 9
tokens_for_ai_rubric: |
  based on the game without knowing where each ship was, score the process each player used to target ships.

  be sure to look for moves or strategies in the game play that where _not_ smart given the obvious information uncovered.

  use chain-of-thought to reason about the progression of the game and the winner.

  first summarize the game, we don't need the turn by turn plays.

  the game was battleship. the moves were done 1 by 1.
  the grid is 0-99.

  did any player blunder as the information was learned?

  There was a user and an AI playing.

  Depending on the game mode the player chooses they are going up against a different algo,

  * random

    * always plays randomly

  * hunter

    * keeps track of hits and targets every cell around it no matter what, randomly, else random

  * super human hunter

    * keeps track of hits and uses a probability grid normalized to 100 and always picks the max or random of any 100.

  * llm reasoner

    * uses the probability algorithm paired with a chat model (llm) to reason for 3 sentences about what the next 0-99 move should be given the current game state and turn number

  * jev reasoner

    * recomputes an exact placement-density probability grid every turn: every placement of every ship still afloat that avoids misses and sunk cells counts, and while a hit is live only placements explaining it count. then asks jev, a decision model, to choose among the top 6 cells in one typed question. jev's probabilities are fused with the grid (grid 0.6, jev 0.4, each on its own max scale, so jev overturns a near-tie but never a landslide) and the maximum is fired. falls back to the grid alone when jev is unavailable.

  Did any player miss sinking a ship that was found? was it due to end game or a blunder?

  Do not mix up ships, keep careful track of the order they were found and sunk.

sections:
  - section_id: "section_1"
    title: "Battleship"
    steps:
      - step_id: "step_0"
        title: "Introduction"
        content_blocks:
          - |
            Welcome to Battleship! 🚢
            In this game, you and the AI each have a fleet of five ships on a 10x10 grid. The AI's fleet is placed at random; yours can be random too, or you can place each ship yourself.
            The grid positions are numbered 0 to 99.

            Your goal is to sink all of the AI's ships before it sinks yours.
            Let's get started!

      - step_id: "step_1"
        title: "Choose AI Mode"
        question: "Choose the AI mode: Random, Hunter, Super Human Hunter, LLM Reasoner, or Jev Reasoner?"
        tokens_for_ai: |
          If the user chooses Random, categorize as 'random_mode'.
          If the user chooses Hunter, categorize as 'hunter_mode'.
          If the user chooses Super Human Hunter, categorize as 'super_hunter_mode'.
          If the user chooses LLM Reasoner (or Hermes Reasoner, its old name), categorize as 'llm_reasoner_mode'.
          If the user chooses Jev Reasoner (or Jev Hunter), categorize as 'jev_reasoner_mode'.
        feedback_tokens_for_ai: |
          If the user chooses Random, say: "Random mode selected! The AI will make completely random moves."
          If the user chooses Hunter, say: "Hunter mode selected! The AI will systematically hunt around hits."
          If the user chooses Super Human Hunter, say: "Super Human Hunter mode selected! The AI will use advanced probability analysis."
          If the user chooses LLM Reasoner, say: "LLM Reasoner mode selected! The AI will use probability analysis combined with a chat model's reasoning to make strategic decisions."
          If the user chooses Jev Reasoner, say: "Jev Reasoner mode selected! The AI recomputes an exact probability grid every turn and asks jev, a decision model, to choose the shot."
        processing_script: |
          import random

          def place_ships():
              global random
              # Define ship sizes and names
              ships = {
                  "Testship": 1
              }

              board = [-1] * 100
              # Place testship at position 21 for easy testing
              board[21] = "Testship"
              return board

          ai_board = place_ships()  # the AI's fleet; the player's comes from Fleet Setup

          script_result = {
              "metadata": {
                  "ai_board": ai_board
              }
          }

        buckets:
          - random_mode
          - hunter_mode
          - super_hunter_mode
          - llm_reasoner_mode
          - jev_reasoner_mode
        transitions:
          random_mode:
            run_processing_script: True
            ai_feedback:
              tokens_for_ai: "Random Mode enabled for the AI."
            metadata_add:
              ai_mode: "random"
            next_section_and_step: "section_1:setup"
          hunter_mode:
            run_processing_script: True
            ai_feedback:
              tokens_for_ai: "Hunter Mode enabled for the AI."
            metadata_add:
              ai_mode: "hunter"
            next_section_and_step: "section_1:setup"
          super_hunter_mode:
            run_processing_script: True
            ai_feedback:
              tokens_for_ai: "Super Human Hunter Mode enabled for the AI."
            metadata_add:
              ai_mode: "super_hunter"
            next_section_and_step: "section_1:setup"
          llm_reasoner_mode:
            run_processing_script: True
            ai_feedback:
              tokens_for_ai: "LLM Reasoner Mode enabled for the AI. The AI will use probability analysis combined with a chat model's reasoning to make strategic decisions."
            metadata_add:
              ai_mode: "llm_reasoner"
            next_section_and_step: "section_1:setup"
          jev_reasoner_mode:
            run_processing_script: True
            ai_feedback:
              tokens_for_ai: "Jev Reasoner Mode enabled for the AI. Every turn it recomputes an exact placement-density probability grid and asks jev, a decision model, to choose among the top cells. Its read is drawn as a heatmap beside the boards."
            metadata_add:
              ai_mode: "jev_reasoner"
            next_section_and_step: "section_1:setup"

      - step_id: "setup"
        title: "Fleet Setup"
        question: "Your fleet: a random layout, or place your ships yourself?"
        tokens_for_ai: |
          If the user wants a random, automatic, or quick layout, categorize as 'random_setup'.
          If the user wants to place, pick, choose, or position their ships themselves (manual), categorize as 'manual_setup'.
          Otherwise categorize as 'unclear'.
        processing_script: |
          import random
          import battleship_modes as bm
          board = bm.place_remaining([-1] * 100, random)
          script_result = {
              "plot_image": bm.render_fleet(board, "Your Ships (random layout)"),
              "set_background": True,
              "metadata": {"user_board": board, "placed_ships": bm.unplaced([-1] * 100), "next_ship": None},
          }
        buckets:
          - random_setup
          - manual_setup
          - unclear
        transitions:
          random_setup:
            run_processing_script: True
            ai_feedback:
              tokens_for_ai: "Tell the admiral their fleet has been dealt at random and the battle begins. One sentence."
            counts_as_attempt: false
            next_section_and_step: "section_1:step_2"
          manual_setup:
            content_blocks:
              - "You place the fleet. Five ships, one at a time: **Carrier** (5), **Battleship** (4), **Cruiser** (3), **Submarine** (3), **Destroyer** (2)."
              - "For each ship reply with its start and end tiles, for example `23 27` for a Carrier along row 2, or `5 45` for one down column 5. Tiles run 0 to 99, left to right, top to bottom."
              - "Say **random** at any point and the rest of the fleet is placed for you."
              - "First: your **Carrier** (5 tiles)."
            counts_as_attempt: false
            next_section_and_step: "section_1:place"
          unclear:
            content_blocks:
              - "Say **random** for a random layout, or **place** to position your ships yourself."
            counts_as_attempt: false
            next_section_and_step: "section_1:setup"

      - step_id: "place"
        title: "Place a Ship"
        question: "Start and end tiles for the ship named above (for example `23 27`), or say random to place the rest."
        tokens_for_ai: |
          If the response contains two numbers between 0 and 99 (any separator: space, comma, 'to', dash), categorize as 'placement'.
          If the user says random, auto, automatic, skip, or asks to place the rest for them, categorize as 'random_rest'.
          Otherwise categorize as 'invalid_placement'.
        feedback_tokens_for_ai: |
          You are the fleet's quartermaster. One or two sentences, plain and exact.
        feedback_prompts:
          - name: "Placement Report"
            tokens_for_ai: |
              Metadata:
              - placement_result: what happened with the tiles the admiral gave (a success line, or why it was refused)
              - placed_ships: ships now on the board
              - next_ship / next_ship_size: the ship to place next, or null when the fleet is complete
              Repeat placement_result word for word. If next_ship is not null, end with: "Next: your [next_ship] ([next_ship_size] tiles)." If next_ship is null, say the fleet is complete and the battle begins.
            metadata_filter:
              - placement_result
              - placed_ships
              - next_ship
              - next_ship_size
        processing_script: |
          import random
          import battleship_modes as bm
          board = metadata.get("user_board") or [-1] * 100
          queue = bm.unplaced(board)
          result = None
          if str(metadata.get("placement_random") or "").lower() in ("yes", "true", "1"):
              board = bm.place_remaining(board, random)
              result = "The rest of the fleet has been placed for you."
          elif queue:
              tiles = bm.parse_placement(metadata.get("placement_input", ""))
              if tiles is None:
                  result = "I need two tiles, like 23 27."
              else:
                  ok, result, cells = bm.place_ship(board, queue[0], *tiles)
          queue = bm.unplaced(board)
          next_ship = queue[0] if queue else None
          script_result = {
              "plot_image": bm.render_fleet(board, "Your Ships" if not queue else f"Your Ships (placing the {queue[0]})"),
              "set_background": True,
              "metadata": {
                  "user_board": board,
                  "placement_result": result,
                  "placed_ships": [n for n, _ in bm.FLEET if n in set(board)],
                  "next_ship": next_ship,
                  "next_ship_size": bm.SHIPS[next_ship] if next_ship else None,
              },
          }
          if not queue:
              script_result["next_section_and_step"] = "section_1:step_2"
        buckets:
          - placement
          - random_rest
          - invalid_placement
        transitions:
          placement:
            run_processing_script: True
            metadata_tmp_add:
              placement_input: "the-users-response"
            counts_as_attempt: false
            next_section_and_step: "section_1:place"
          random_rest:
            run_processing_script: True
            metadata_tmp_add:
              placement_random: "yes"
            counts_as_attempt: false
            next_section_and_step: "section_1:place"
          invalid_placement:
            content_blocks:
              - "Reply with two tiles, start and end, for example `23 27`. Or say **random** to place the rest."
            counts_as_attempt: false
            next_section_and_step: "section_1:place"

      - step_id: "step_2"
        title: "Take a Shot"
        question: "Choose a position to fire at (0-99)."
        pre_script: |
          # Check if moves match winning moves from previous turn
          user_winning_move = metadata.get("user_winning_move")
          ai_winning_move = metadata.get("ai_winning_move")
          user_shot_input = metadata.get("user_response", "")
          print(f"PRE-SCRIPT DEBUG: user_shot_input = '{user_shot_input}', user_winning_move = {user_winning_move}, ai_winning_move = {ai_winning_move}")
          ai_shot = metadata.get("ai_shot")
          
          is_game_ending_move = False
          
          # Check if user move wins
          if user_shot_input and user_shot_input.isdigit():
              user_move = int(user_shot_input)
              if user_winning_move is not None and user_move == user_winning_move:
                  is_game_ending_move = True
                  print(f"PRE-SCRIPT: User winning move detected! user_move={user_move} matches user_winning_move={user_winning_move}")
          
          # Check if AI move wins (from previous turn)
          if ai_shot is not None and ai_winning_move is not None and ai_shot == ai_winning_move:
              is_game_ending_move = True
              print(f"PRE-SCRIPT: AI winning move detected! ai_shot={ai_shot} matches ai_winning_move={ai_winning_move}")
          
          script_result = {
              "metadata": {
                  "is_game_ending_move": is_game_ending_move
              }
          }
        tokens_for_ai: |
          1) If the user reply is *only* digits, and corresponds to a grid cell (0–99),
             treat it as a valid move:
          If the response matches the regex /^\d+$/ and 0 ≤ int(response) < 100, categorize as 'valid_move'.

          2) Otherwise fall back to the usual buckets:
          If the user wants to restart or play again, categorize as 'restart'.
          If the user wants to exit, categorize as 'exit'.
          Otherwise, categorize as 'invalid_move'.
        feedback_tokens_for_ai: |
          You are a battleship narrator. Each prompt has its own specific role - follow the individual prompt instructions precisely.
        feedback_prompts:
          - name: "Shot Report"
            tokens_for_ai: |
              🎯 Report ONLY the hit/miss results for both shots this turn. DO NOT report ship sinking or game over.

              Check metadata:
              - user_shot: Player's target position
              - user_hit_result: "hit" or "miss"
              - ai_shot: AI's target position
              - ai_hit_result: "hit" or "miss"

              Format: "🎯 Your shot at position [user_shot]: [user_hit_result]! 🤖 Enemy shot at position [ai_shot]: [ai_hit_result]!"

              When metadata jev_read is present (Jev Reasoner is the enemy admiral), append ONE more sentence on the same message, in character as a cold, precise decision engine, opening with "🧭 Jev's read:". Use only these fields:
              - source: "jev" when the jev decision model chose among the candidates; "grid" when the probability grid alone decided (then say plainly that the grid alone decided)
              - p: jev's probability on its chosen cell (0-1); confidence: jev's own confidence (0-1)
              - orientation / orientation_p: jev's read on which way the wounded ship lies, present only while a hit is live
              - candidates: the top cells it weighed as [cell, density] pairs, density 0-100
              - error: why jev did not answer, when source is "grid"
              Ignore turn, shot, fused and sunk_cells. Never invent numbers not in the metadata. When jev_read is null, write no Jev sentence at all.
            metadata_filter:
              - user_shot
              - ai_shot
              - user_hit_result
              - ai_hit_result
              - user_response
              - jev_read

          - name: "Ship Status"
            tokens_for_ai: |
              A ship has been destroyed! Generate a dramatic 2-3 sentence description.
              
              Metadata tells you which ship(s) were sunk:
              - user_sunk_ship_this_round: The ship YOU destroyed (your victory)
              - ai_sunk_ship_this_round: The ship that was destroyed by the enemy (your loss)
              
              Format:
              - If user destroyed a ship: "💥 You've sunk their [ship]! [2-3 dramatic sentences imagining how this warship meets its doom]"
              - If AI destroyed your ship: "🔥 Your [ship] has been destroyed! [2-3 dramatic sentences about its destruction]"
              - If both: Include both messages
            metadata_filter:
              - user_sunk_ship_this_round
              - ai_sunk_ship_this_round
            skip_condition: "all_null"
              
          - name: "Game Over"
            tokens_for_ai: |
              The naval battle has ended! Generate an epic conclusion.
              
              Based on the metadata:
              - If user_wins is true: "🎉 TOTAL VICTORY! You have destroyed all enemy ships! The seas belong to you, Admiral. Your tactical brilliance has secured complete naval supremacy."
              - If ai_wins is true: "💀 DEFEAT! All your ships have been destroyed. Your fleet lies scattered across the ocean floor. The enemy's superior strategy has prevailed."
              
              Make it dramatic and final - this is the end of the battle!
            metadata_filter:
              - game_over
              - user_wins
              - ai_wins
            skip_condition: "all_false"

        processing_script: |
          import random
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import io
          import base64

          # Define ship sizes
          ship_sizes = {
              "Testship": 1
          }

          # Define colors for ships
          ship_colors = {
              "Testship": "red"
          }

          # Retrieve the game state
          user_board = metadata.get("user_board")
          ai_board = metadata.get("ai_board")
          
          # Normal processing code
          user_shots = metadata.get("user_shots", [])
          ai_shots = metadata.get("ai_shots", [])
          user_hits = metadata.get("user_hits", [])
          ai_hits = metadata.get("ai_hits", [])
          game_over = metadata.get("game_over", False)
          user_wins = False
          ai_wins = False
          user_hit_result = "miss"
          ai_hit_result = "miss"
          user_sunk_ships = metadata.get("user_sunk_ships", [])
          ai_sunk_ships = metadata.get("ai_sunk_ships", [])
          user_sunk_ship_this_round = None
          ai_sunk_ship_this_round = None

          # AI state variables
          ai_mode = metadata.get("ai_mode", "random")
          jev_read = None  # Jev Reasoner's readout for this turn (see battleship_modes.py)

          probability_matrix = metadata.get("probability_matrix")
          llm_last = None

          # Function to check if a ship is sunk
          def check_sunk(board, hits, ship_name):
              ship_positions = []
              for i, ship in enumerate(board):
                  if ship == ship_name:
                      ship_positions.append(i)
              for pos in ship_positions:
                  if pos not in hits:
                      return False
              return True

          # Function to draw a line across a sunken ship
          def draw_line(ax, board, ship_name):
              ship_positions = []
              for i, ship in enumerate(board):
                  if ship == ship_name:
                      ship_positions.append(i)
              if not ship_positions:
                  return

              # Determine if the ship is horizontal or vertical
              first_pos = ship_positions[0]
              last_pos = ship_positions[-1]
              if last_pos - first_pos < 10:  # Horizontal
                  x_start, y_start = first_pos % 10 + 0.5, 9 - first_pos // 10 + 0.5
                  x_end, y_end = last_pos % 10 + 0.5, 9 - last_pos // 10 + 0.5
              else:  # Vertical
                  x_start, y_start = first_pos % 10 + 0.5, 9 - first_pos // 10 + 0.5
                  x_end, y_end = first_pos % 10 + 0.5, 9 - last_pos // 10 + 0.5

              ax.plot([x_start, x_end], [y_start, y_end], color='red', linewidth=2)

          # AI chooses a shot: every admiral lives in battleship_modes.py, the
          # same functions battleship_arena.py measures, so what plays in a
          # room is exactly what the arena reports.
          def choose_ai_shot():
              global ai_hits, ai_hit_result, probability_matrix, jev_read, llm_last
              import battleship_modes as bm
              st = bm.new_state()
              st["shots"] = list(ai_shots)
              st["hits"] = list(ai_hits)
              st["misses"] = [s for s in ai_shots if s not in ai_hits]
              st["sunk_ships"] = list(ai_sunk_ships)
              st["sunk_cells"] = [i for i, s in enumerate(user_board) if s in ai_sunk_ships]
              st["probability_matrix"] = probability_matrix
              ai_shot = bm.choose_shot(ai_mode, st, random)
              # Referee: what the shot did, so the mode can learn from it.
              hit = user_board[ai_shot] != -1
              sunk_name, sunk_cells = None, ()
              if hit:
                  ai_hits.append(ai_shot)
                  ai_hit_result = "hit"
                  name = user_board[ai_shot]
                  cells = [i for i, s in enumerate(user_board) if s == name]
                  if all(c in ai_hits for c in cells):
                      sunk_name, sunk_cells = name, cells
              else:
                  ai_hit_result = "miss"
              bm.record_shot(ai_mode, st, ai_shot, hit, sunk_name, sunk_cells)
              probability_matrix = st["probability_matrix"]
              jev_read = st["jev_read"]
              llm_last = st["llm_last"]
              return ai_shot

          # Get the user's shot
          try:
              user_shot = int(metadata.get("user_shot"))
          except (IndexError, ValueError) as e:
              user_shot = -1

          if game_over:
              script_result = {
                  "metadata": {
                      "game_over": True,
                      "user_wins": user_wins,
                      "ai_wins": ai_wins
                  }
              }
              print(f"DEBUG: Game over detected! User wins: {user_wins}, AI wins: {ai_wins}")
          elif 0 <= user_shot < 100 and user_shot not in user_shots:
              # The move is valid
              user_shots.append(user_shot)
              user_hit_result = "miss"
              if ai_board[user_shot] != -1:
                  user_hits.append(user_shot)
                  user_hit_result = "hit"

              # AI makes a move
              ai_shot = choose_ai_shot()
              ai_shots.append(ai_shot)

              # Check if any AI ship is sunk
              for ship_name in ship_sizes.keys():
                  if check_sunk(ai_board, user_hits, ship_name) and ship_name not in user_sunk_ships:
                      user_sunk_ships.append(ship_name)
                      user_sunk_ship_this_round = ship_name
                      print(f"DEBUG: USER SUNK AI SHIP: {ship_name}")

              # Check if any User ship is sunk
              for ship_name in ship_sizes.keys():
                  if check_sunk(user_board, ai_hits, ship_name) and ship_name not in ai_sunk_ships:
                      ai_sunk_ships.append(ship_name)
                      ai_sunk_ship_this_round = ship_name
                      print(f"DEBUG: AI SUNK USER SHIP: {ship_name}")

              # Check if all AI ships are hit
              all_ai_ships_hit = True
              for pos in range(100):
                  if ai_board[pos] != -1 and pos not in user_hits:
                      all_ai_ships_hit = False
                      break

              # Check if all User ships are hit
              all_user_ships_hit = True
              for pos in range(100):
                  if user_board[pos] != -1 and pos not in ai_hits:
                      all_user_ships_hit = False
                      break

              if all_ai_ships_hit:
                  game_over = True
                  user_wins = True
                  ai_wins = False
                  print(f"DEBUG: USER WINS! All AI ships destroyed. Game over.")
              elif all_user_ships_hit:
                  game_over = True
                  user_wins = False
                  ai_wins = True
                  print(f"DEBUG: AI WINS! All user ships destroyed. Game over.")
              
              # Only track winning move if there's exactly 1 position left (for next turn's categorization)
              user_winning_move = None
              ai_winning_move = None
              
              # Check which user move would win the game (AI ship positions left)
              ai_ship_positions_left = [pos for pos in range(100) if ai_board[pos] != -1 and pos not in user_hits]
              if len(ai_ship_positions_left) == 1:
                  user_winning_move = ai_ship_positions_left[0]
                  print(f"DEBUG: User has exactly 1 winning move at position {user_winning_move}")
              else:
                  print(f"DEBUG: User has {len(ai_ship_positions_left)} AI positions left - no winning move")
              
              # Check which AI move would win the game (user ship positions left)  
              user_ship_positions_left = [pos for pos in range(100) if user_board[pos] != -1 and pos not in ai_hits]
              if len(user_ship_positions_left) == 1:
                  ai_winning_move = user_ship_positions_left[0]
                  print(f"DEBUG: AI has exactly 1 winning move at position {ai_winning_move}")
              else:
                  print(f"DEBUG: AI has {len(user_ship_positions_left)} user positions left - no winning move")

              # Plot the boards
              panels = 3 if ai_mode == "jev_reasoner" else 2
              fig, axs = plt.subplots(1, panels, figsize=(6 * panels, 6))
              fig.suptitle("Battleship", fontsize=16)

              # User's view of AI's board
              axs[0].set_xlim(0, 10)
              axs[0].set_ylim(0, 10)
              axs[0].set_xticks([])
              axs[0].set_yticks([])
              axs[0].grid(True)
              axs[0].set_title("Your Shots", fontsize=12)

              # Plot user shots on AI's board
              for i in range(100):
                  x, y = i % 10, 9 - i // 10
                  if i in user_shots:
                      if i in user_hits:
                          axs[0].text(x + 0.5, y + 0.5, 'X', fontsize=12, ha='center', va='center', color='red')
                      else:
                          axs[0].text(x + 0.5, y + 0.5, 'O', fontsize=12, ha='center', va='center', color='black')
                  axs[0].text(x + 0.5, y + 0.5, str(i), fontsize=8, ha='center', va='center', color='gray')

              # AI's view of User's board
              axs[1].set_xlim(0, 10)
              axs[1].set_ylim(0, 10)
              axs[1].set_xticks([])
              axs[1].set_yticks([])
              axs[1].grid(True)
              axs[1].set_title("Your Ships", fontsize=12)

              # Plot user ships
              for i, ship in enumerate(user_board):
                  x, y = i % 10, 9 - i // 10
                  if ship != -1:
                      axs[1].add_patch(plt.Rectangle((x, y), 1, 1, color=ship_colors[ship], alpha=0.5))

              # Plot AI shots on User's board
              for i in range(100):
                  x, y = i % 10, 9 - i // 10
                  if i in ai_shots:
                      if i in ai_hits:
                          axs[1].text(x + 0.5, y + 0.5, 'X', fontsize=12, ha='center', va='center', color='red')
                      else:
                          axs[1].text(x + 0.5, y + 0.5, 'O', fontsize=12, ha='center', va='center', color='black')
                  axs[1].text(x + 0.5, y + 0.5, str(i), fontsize=8, ha='center', va='center', color='gray')

              # Draw lines across sunk ships
              for ship_name in user_sunk_ships:
                  draw_line(axs[0], ai_board, ship_name)

              for ship_name in ai_sunk_ships:
                  draw_line(axs[1], user_board, ship_name)

              # Add legend
              handles = []
              for color in ship_colors.values():
                  handles.append(plt.Rectangle((0, 0), 1, 1, color=color, alpha=0.5))
              axs[1].legend(handles, ship_colors.keys(), loc='upper right', fontsize=8)

              # Jev Reasoner's read: the fused probability grid that decided this shot
              if ai_mode == "jev_reasoner" and jev_read is not None:
                  import jev_hunter
                  jev_hunter.draw_heatmap(
                      axs[2], jev_read["fused"], ai_shots, ai_hits, jev_read["sunk_cells"], shot=ai_shot,
                      title=f"Jev Reasoner's Read (turn {jev_read['turn']}, {jev_read['source']})")

              buf = io.BytesIO()
              plt.savefig(buf, format='png', bbox_inches='tight', pad_inches=0.1)
              plt.close(fig)
              buf.seek(0)
              plot_image = base64.b64encode(buf.getvalue()).decode('utf-8')

              # gpt-4: If "plot_image" is in the result, set it as the background image
              print(f"DEBUG: Setting metadata for feedback - user_sunk_ship_this_round: {user_sunk_ship_this_round}, ai_sunk_ship_this_round: {ai_sunk_ship_this_round}")
              
              script_result = {
                  "plot_image": plot_image,
                  "set_background": True,
                  "metadata": {
                      "user_board": user_board,
                      "ai_board": ai_board,
                      "user_shot": user_shot,
                      "ai_shot": ai_shot,
                      "user_shots": user_shots,
                      "ai_shots": ai_shots,
                      "user_hits": user_hits,
                      "ai_hits": ai_hits,
                      "game_over": game_over,
                      "user_wins": user_wins,
                      "ai_wins": ai_wins,
                      "user_hit_result": user_hit_result,
                      "ai_hit_result": ai_hit_result,
                      "user_sunk_ships": user_sunk_ships,
                      "ai_sunk_ships": ai_sunk_ships,
                      "user_sunk_ship_this_round": user_sunk_ship_this_round,
                      "ai_sunk_ship_this_round": ai_sunk_ship_this_round,
                      "ai_mode": ai_mode,
                      "jev_read": jev_read,
                      "llm_last": llm_last,
                      "probability_matrix": probability_matrix,
                      "user_winning_move": user_winning_move,
                      "ai_winning_move": ai_winning_move
                  }
              }
              
              # Check if this was a winning move and override transition  
              if game_over:
                  script_result["next_section_and_step"] = "section_1:step_3"
                  print(f"POST-SCRIPT: Game over detected, overriding transition to step_3")
          else:
              script_result = {
              "error": f"Invalid shot: {metadata.get('user_shot')}",
              "metadata": {}
              }

        buckets:
          - valid_move
          - invalid_move
          - exit
          - restart
        transitions:
          valid_move:
            run_processing_script: True
            ai_feedback:
              tokens_for_ai: |
                The user shot seems valid.
            metadata_tmp_add:
              user_shot: "the-users-response"
            next_section_and_step: "section_1:step_2"
          invalid_move:
            content_blocks:
              - "That move is invalid. Please choose a position between 0 and 99."
            metadata_tmp_add:
              user_shot: "the-users-response"
            next_section_and_step: "section_1:step_2"
          exit:
            next_section_and_step: "section_1:step_4"
          restart:
            content_blocks:
              - "Restarting the game. Let's start fresh!"
            metadata_clear: True
            next_section_and_step: "section_1:step_0"

      - step_id: "step_3"
        title: "Game Over"
        question: "Would you like to restart and play again, or would you prefer to exit?"
        tokens_for_ai: |
          If the user wants to restart or play again, categorize as 'restart'.
          If the user wants to exit, categorize as 'exit'.
        buckets:
          - restart
          - exit
        transitions:
          restart:
            content_blocks:
              - "Restarting the game. Let's start fresh!"
            metadata_clear: True
            next_section_and_step: "section_1:step_0"
          exit:
            content_blocks:
              - "Thank you for playing Battleship! 🎉"
              - "Feel free to come back anytime for another game."
            next_section_and_step: "section_1:step_4"

      - step_id: "step_4"
        title: "Goodbye"
        content_blocks:
          - "Thanks for playing! Hope you enjoyed the battle at sea."
