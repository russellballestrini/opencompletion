# What our Activities gallery shows for this activity (optional: see SPEC.yaml).
title: "Escape Room: Key, Book & Safe"
description: "Wake in a locked room & find a way out: a key under a rug, a password in a book, a safe on a wall."
kind: "game"
default_max_attempts_per_step: 30

# Metadata: key, password (true once taken), looked_around (past the
# first look); pick (this turn's choice).
# Story steps keep our built-in clarifying bucket: a question about the
# room gets a hint & the question again.

tokens_for_ai_rubric: |
  You are a master storyteller. Retell this chat as one coherent, vivid escape story with a beginning, middle & end, shaped by the choices the player made & the narrator's replies.

sections:
  - section_id: "section_1"
    title: "The Escape Room Begins"
    steps:
      - step_id: "step_1"
        title: "Waking Up"
        content_blocks:
          - text: "You wake up in a dimly lit room with no memory of how you got there. Its single door is locked."
            show_if:
              looked_around_not_exists: true
          - "You see a rug on the floor, a bookshelf with a book, and a safe on the wall."
          - text: "🔑 You carry a small brass key."
            show_if:
              key: true
          - text: "🔐 You remember a password: ESCAPE123."
            show_if:
              password: true
        # A pick among three things in the room: buttons, no model asked.
        question_type: multiple_choice
        question: "What do you do? 🤔"
        choices:
          - {id: rug, text: "Look under the rug"}
          - {id: book, text: "Examine the book"}
          - {id: safe, text: "Try to open the safe"}
        answer: [rug, book, safe]
        answer_mode: any
        buckets: [choose, unclear]
        mc_correct: choose
        mc_incorrect: unclear
        transitions:
          choose:
            metadata_add:
              looked_around: true
            metadata_tmp_add:
              pick: "the-users-response"
            counts_as_attempt: false
            next_section_and_step:
              - if:
                  pick_matches: "(?i)rug"
                goto: "section_2:step_1"
              - elif:
                  pick_matches: "(?i)book"
                goto: "section_3:step_1"
              - else: true
                goto: "section_4:step_1"
          unclear:
            content_blocks:
              - "Pick one thing to try: the **rug**, the **book** or the **safe**."
            counts_as_attempt: false
            next_section_and_step: "section_1:step_1"

  - section_id: "section_2"
    title: "The Key"
    steps:
      - step_id: "step_1"
        title: "Found the Key"
        content_blocks:
          - text: "You lift the rug: a small brass key glints in the dust. 🔑"
            show_if:
              key_not_exists: true
          - text: "Nothing else under the rug: you already have its key."
            show_if:
              key: true
        question: "Take the key, or keep exploring? 🤔"
        tokens_for_ai: |
          - take_key: they take, pocket or pick up the key.
          - continue_exploring: they leave it, look elsewhere or go back.
          - off_topic: anything else.
        buckets:
          - take_key
          - continue_exploring
          - off_topic
        transitions:
          take_key:
            content_blocks:
              - "You pocket the key. 🔑"
            metadata_add:
              key: true
            next_section_and_step: "section_1:step_1"
          continue_exploring:
            next_section_and_step: "section_1:step_1"
          off_topic:
            content_blocks:
              - "Back to our room: take the key, or keep exploring? 🧭"

  - section_id: "section_3"
    title: "The Book"
    steps:
      - step_id: "step_1"
        title: "Found the Password"
        content_blocks:
          - "Inside the book's cover, a note reads: 'ESCAPE123'. 🔐"
        question: "Memorise the password, or keep exploring? 🤔"
        tokens_for_ai: |
          - take_password: they note, memorise, read or take the password.
          - continue_exploring: they put the book back, look elsewhere or go back.
          - off_topic: anything else.
        buckets:
          - take_password
          - continue_exploring
          - off_topic
        transitions:
          take_password:
            content_blocks:
              - "You commit ESCAPE123 to memory. 🧠"
            metadata_add:
              password: true
            next_section_and_step: "section_1:step_1"
          continue_exploring:
            next_section_and_step: "section_1:step_1"
          off_topic:
            content_blocks:
              - "Back to our room: memorise the password, or keep exploring? 🧭"

  - section_id: "section_4"
    title: "The Safe"
    steps:
      - step_id: "step_1"
        title: "Opening the Safe"
        content_blocks:
          - "The safe has a keyhole & a keypad: it needs both a key and a password. 🔒"
        question: "Try to open it, or keep exploring? 🤔"
        tokens_for_ai: |
          - use_key_and_password: they try to open the safe (with a key, a password, or both).
          - continue_exploring: they leave it, look elsewhere or go back.
          - off_topic: anything else.
        # Marks the escape complete only when both are in hand.
        processing_script: |
          if metadata.get("key") is True and metadata.get("password") is True:
              metadata["activity_completed"] = "true"
          script_result = {}
        buckets:
          - use_key_and_password
          - continue_exploring
          - off_topic
        transitions:
          use_key_and_password:
            run_processing_script: true
            content_blocks:
              - text: "You turn the key & type ESCAPE123... *click*! The safe swings open on the door's key & a hidden treasure. 🎉"
                show_if:
                  key: true
                  password: true
              - text: "The keyhole is empty: you need a key. Maybe something in this room hides one?"
                show_if:
                  key_not_exists: true
              - text: "The keypad blinks red: you need a password. Books sometimes keep secrets..."
                show_if:
                  password_not_exists: true
            next_section_and_step:
              - if:
                  key: true
                  password: true
                goto: "section_5:step_1"
              - else: true
                goto: "section_1:step_1"
          continue_exploring:
            next_section_and_step: "section_1:step_1"
          off_topic:
            content_blocks:
              - "Back to our room: try the safe, or keep exploring? 🧭"

  - section_id: "section_5"
    title: "Congratulations!"
    steps:
      - step_id: "step_1"
        title: "Well Done!"
        content_blocks:
          - "You unlock the door & step out into the light. 🎉"
          - "You have successfully completed the escape room. Start the activity again to escape faster! 🌟"
