# What our Activities gallery shows for this activity (optional: see SPEC.yaml).
title: "Killer Squares"
description: "We & our computer each hide on a 3x3 board, then take turns striking squares: hit their hiding place first to win."
kind: "game"
default_max_attempts_per_step: 9
# Answers are moves ("4"): our built-in clarifying bucket would misread them.
allow_clarifying_questions: false

sections:
  - section_id: "section_1"
    title: "Killer Squares"
    steps:
      - step_id: "step_0"
        title: "Introduction"
        content_blocks:
          - |
            Welcome to Killer Squares! 🎮
            In this game, both you and the computer secretly choose a square.
            Then you take turns striking a square. Strike the computer's secret spot & you win!
            If the computer strikes yours first, you lose.

            The board positions are numbered 0 to 8 as follows:

            ```
            0 | 1 | 2
            ---------
            3 | 4 | 5
            ---------
            6 | 7 | 8
            ```

      - step_id: "step_1"
        title: "Choose Your Secret Spot"
        question: "Choose a secret spot (0-8) for this round."
        tokens_for_ai: |
          - valid_move: a square, a number 0 to 8 (our script checks it).
          - invalid_move: anything else meant as a square.
          - restart: they want to start over.
          - exit: they want to stop, quit or leave.
        # Our script hides the computer too; a square it can't read asks again.
        processing_script: |
          import random

          text = str(metadata.get("user_response") or "").strip()
          if text.isdigit() and 0 <= int(text) < 9:
              metadata["user_secret"] = int(text)
              metadata["ai_secret"] = random.randint(0, 8)
              metadata["user_shots"] = []
              metadata["ai_shots"] = []
              metadata["game_over"] = False
              metadata["move_note"] = f"🤫 You hide on square **{text}**. The computer has hidden too."
              script_result = {"next_section_and_step": "section_1:step_2"}
          else:
              metadata["move_note"] = f"🤔 `{text[:20]}` isn't a square: pick a number from 0 to 8."
              script_result = {"next_section_and_step": "section_1:step_1"}
        buckets:
          - valid_move
          - invalid_move
          - restart
          - exit
        transitions:
          valid_move:
            run_processing_script: true
            content_blocks:
              - "{{metadata.move_note}}"
            next_section_and_step: "section_1:step_2"
          invalid_move:
            run_processing_script: true
            content_blocks:
              - "{{metadata.move_note}}"
            counts_as_attempt: false
            next_section_and_step: "section_1:step_1"
          exit:
            metadata_add:
              activity_completed: "true"
            next_section_and_step: "section_1:step_3"
          restart:
            content_blocks:
              - "Restarting the game. Let's start fresh!"
            next_section_and_step: "section_1:step_0"

      - step_id: "step_2"
        title: "Kill a Square"
        question: "Choose a square to strike (0-8)."
        tokens_for_ai: |
          - valid_move: a square, a number 0 to 8 (our script checks it).
          - invalid_move: anything else meant as a square.
          - restart: they want to start over.
          - exit: they want to stop, quit or leave.
        feedback_tokens_for_ai: |
          Speak in first person as the computer. One or two sentences of playful trash talk.
          The strike & result are decided & shown already (move_note): never change them.
          Never reveal ai_secret unless game_over is true.
        # Our script referees each strike, strikes back & ends the game.
        processing_script: |
          import random
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import io
          import base64

          user_secret = metadata.get("user_secret")
          ai_secret = metadata.get("ai_secret")
          user_shots = list(metadata.get("user_shots") or [])
          ai_shots = list(metadata.get("ai_shots") or [])
          for key in ("games", "wins", "losses", "draws"):
              metadata[key] = int(metadata.get(key) or 0)
          text = str(metadata.get("user_response") or "").strip()
          user_kill = int(text) if text.isdigit() else -1

          if user_secret is None or ai_secret is None or metadata.get("game_over"):
              metadata["move_note"] = "Let's hide first."
              script_result = {"next_section_and_step": "section_1:step_1"}
          elif not 0 <= user_kill < 9:
              metadata["move_note"] = f"🤔 `{text[:20]}` isn't a square: strike a number from 0 to 8."
              script_result = {"valid": False}
          elif user_kill in user_shots:
              metadata["move_note"] = f"🙃 You already struck square {user_kill}. Try another."
              script_result = {"valid": False}
          else:
              user_shots.append(user_kill)
              ai_kill = None
              result = None
              if user_kill == ai_secret:
                  result = "win"
                  note = f"💥 You strike **{user_kill}**: that's where the computer hid. **You win!** 🎉"
              else:
                  # The computer strikes back, never its own spot or a square twice
                  free = [i for i in range(9) if i not in ai_shots and i != ai_secret]
                  ai_kill = random.choice(free) if free else None
                  note = f"You strike **{user_kill}**: a miss."
                  if ai_kill is None:
                      result = "draw"
                      note += " Nobody is left to strike: **a draw.** 🤝"
                  else:
                      ai_shots.append(ai_kill)
                      note += f" The computer strikes **{ai_kill}**"
                      if ai_kill == user_secret:
                          result = "loss"
                          note += f": your hiding place! **The computer wins.** It was hiding on **{ai_secret}**."
                      else:
                          note += ": a miss."
              game_over = result is not None
              if game_over:
                  metadata["games"] += 1
                  metadata[{"win": "wins", "loss": "losses", "draw": "draws"}[result]] += 1

              # Plot both boards
              fig, axs = plt.subplots(1, 2, figsize=(6, 3))
              fig.suptitle("Killer Squares", fontsize=16)
              titles = ("Your strikes", "The computer's strikes")
              for ax, shots, colour, title in zip(axs, (user_shots, ai_shots), ("red", "blue"), titles):
                  ax.set_xlim(0, 3)
                  ax.set_ylim(0, 3)
                  ax.set_xticks([])
                  ax.set_yticks([])
                  ax.grid(True)
                  ax.set_title(title, fontsize=12)
                  for i in range(9):
                      ax.text(i % 3 + 0.5, 2 - i // 3 + 0.5, str(i), fontsize=12, ha='center', va='center', color='gray')
                  for shot in shots:
                      ax.text(shot % 3 + 0.5, 2 - shot // 3 + 0.5, 'X', fontsize=24, ha='center', va='center', color=colour)
              fig.tight_layout()
              buf = io.BytesIO()
              plt.savefig(buf, format='png', bbox_inches='tight', pad_inches=0.1)
              plt.close(fig)
              buf.seek(0)

              metadata["move_note"] = note
              metadata.update({
                  "user_shots": user_shots,
                  "ai_shots": ai_shots,
                  "game_over": game_over,
                  "user_wins": result == "win",
                  "ai_wins": result == "loss",
                  "draw": result == "draw",
              })
              script_result = {"plot_image": base64.b64encode(buf.getvalue()).decode('utf-8')}
              if game_over:
                  script_result["next_section_and_step"] = "section_1:game_over"
        buckets:
          - valid_move
          - invalid_move
          - exit
          - restart
        transitions:
          valid_move:
            run_processing_script: true
            content_blocks:
              - "{{metadata.move_note}}"
            ai_feedback:
              tokens_for_ai: "React to the strike."
            next_section_and_step: "section_1:step_2"
          invalid_move:
            run_processing_script: true
            content_blocks:
              - "{{metadata.move_note}}"
            counts_as_attempt: false
            next_section_and_step: "section_1:step_2"
          exit:
            metadata_add:
              activity_completed: "true"
            next_section_and_step: "section_1:step_3"
          restart:
            content_blocks:
              - "Restarting the game. Let's start fresh!"
            next_section_and_step: "section_1:step_0"

      - step_id: "game_over"
        title: "Game Over"
        content_blocks:
          - "Games: **{{metadata.games}}** · you won **{{metadata.wins}}** · the computer won **{{metadata.losses}}** · draws **{{metadata.draws}}**"
        question: "Play **again**, or **exit**?"
        tokens_for_ai: |
          - restart: they want another game (yes, again, sure, a square number).
          - exit: they want to stop, quit or leave (no, done).
        buckets:
          - restart
          - exit
        transitions:
          restart:
            next_section_and_step: "section_1:step_0"
          exit:
            metadata_add:
              activity_completed: "true"
            next_section_and_step: "section_1:step_3"

      - step_id: "step_3"
        title: "Goodbye"
        content_blocks:
          - text: "Final tally: **{{metadata.games}}** games · you won **{{metadata.wins}}** · the computer won **{{metadata.losses}}** · draws **{{metadata.draws}}**"
            show_if:
              games_gte: 1
          - "Thank you for playing Killer Squares! 🎉"
          - "Feel free to come back anytime for another game."
