      text: '💡 Hint: Hollywood is in the United States and Bollywood in India.'
    - attempt: 2
      text: '💡 Bigger hint: Its name starts with the first letter of Nigeria.'
    transitions:
      correct:
        content_blocks:
        - '✅ Nollywood: by number of films made, one of the largest film industries in the world.'
        metadata_add:
