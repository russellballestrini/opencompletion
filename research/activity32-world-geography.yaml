- section_id: south_america
  title: Exploring South America
  steps:
  - step_id: step_1
    title: Welcome to South America - Brazil
    content_blocks:
    - '## Welcome to South America! 🦜'
    - Home to the Amazon rainforest, the Andes mountains, and incredibly rich biodiversity!
    - ''
    - '**Let''s visit Brazil!**'
    - ''
    - '**Geography:** The largest country in South America, covering nearly half the continent'
    - '**Capital:** Brasília (a planned city, capital since 1960)'
    - '**Famous for:** Amazon rainforest, carnival celebrations, football (soccer), and diverse ecosystems from rainforests to beaches'
    - ''
    - '**Environmental Fact:**'
    - The Amazon rainforest, which covers much of Brazil, holds about one in ten of the world's known species. (It's often said to make 20% of our oxygen, but the forest uses up almost all the oxygen it makes.)
    - ''
    - '**Cultural Fact:**'
    - Brazil was colonized by Portugal, while most of its neighbours were colonized by Spain. Brazil's language has its own unique accent and expressions!
    question_type: multiple_choice
    question: What language is primarily spoken in Brazil?
    choices:
    - id: a
      text: Spanish
    - id: b
      text: Portuguese
    - id: c
      text: French
    - id: d
      text: English
    answer: b
    hints:
    - attempt: 1
      text: '💡 Hint: Most of Brazil''s neighbours speak Spanish, but Brazil was colonized by a different country.'
    - attempt: 2
      text: '💡 Bigger hint: Brazil was colonized by Spain''s neighbour on the Iberian Peninsula.'
