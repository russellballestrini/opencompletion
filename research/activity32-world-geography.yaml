- section_id: africa_egypt
  title: Egypt
  steps:
  - step_id: step_1
    title: Egypt - Land of Ancient Wonders
    content_blocks:
    - '## Egypt - Land of Ancient Wonders 🐪'
    - '**Geography:** Located in Northeast Africa, Egypt connects Africa to Asia via the Sinai Peninsula.'
    - '**Capital:** Cairo'
    - '**Famous for:** The Pyramids of Giza, the Sphinx, and a river usually ranked the world''s longest (some measurements give the title to the Amazon)'
    - ''
    - '**Historical Fact:**'
    - Ancient Egyptian civilization lasted over 3,000 years! They developed hieroglyphic writing, built massive monuments, and made advances in mathematics, medicine, and astronomy.
    - ''
    - '**Cultural Fact:**'
    - The Nile River has been central to Egyptian life for millennia. The ancient saying 'Egypt is the gift of the Nile' reflects how the river's annual flooding made agriculture possible in the desert.
    question_type: multiple_choice
    question: Which great river flows through Egypt?
    choices:
    - id: a
      text: The Amazon
    - id: b
      text: The Danube
    - id: c
      text: The Nile
    - id: d
      text: The Ganges
    answer: c
    hints:
    - attempt: 1
      text: '💡 Hint: The Amazon is in South America and the Ganges in India.'
    - attempt: 2
      text: '💡 Bigger hint: Its name has four letters.'
    transitions:
      correct:
        content_blocks:
        - ✅ The Nile! It is usually ranked the world's longest river (some measurements give the title to the Amazon).
        metadata_add:
          quiz_score: n+1
          cultural_facts_learned: n+1
      incorrect:
        metadata_add:
          misses_africa_egypt: n+1
        content_blocks:
        - text: 'Not quite: try again!'
          show_if:
            misses_africa_egypt_lt: 3
        - text: 'Good tries! The answer: The Nile.'
          show_if:
            misses_africa_egypt_gte: 3
