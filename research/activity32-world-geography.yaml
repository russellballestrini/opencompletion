    title: Welcome to Oceania - Australia
    content_blocks:
    - '## Welcome to Oceania! 🏝️'
    - A region of islands and nations in the Pacific Ocean!
    - ''
    - '**Let''s visit Australia!**'
    - ''
    - '**Geography:** The world''s smallest continent but largest island, located between the Indian and Pacific Oceans'
    - '**Capital:** Canberra'
    - '**Famous for:** Unique wildlife (kangaroos, koalas, platypuses), a giant coral reef, the Outback, and Aboriginal and Torres Strait Islander cultures tens of thousands of years old'
    - ''
    - '**Indigenous Heritage:**'
    - 'Aboriginal Australians have one of the longest continuous cultures on Earth: at least 50,000 years, and perhaps 65,000! They have deep knowledge of the land, sophisticated art traditions, and hundreds of distinct languages.'
    - ''
    - '**Wildlife Fact:**'
    - Australia has more unique species than anywhere else! About 80% of its plants, mammals, and reptiles are found nowhere else on Earth.
