- section_id: africa
  title: Exploring Africa
  steps:
  - step_id: step_1
    title: Welcome to Africa - Kenya
    content_blocks:
    - '## Welcome to Africa! 🦁'
    - Africa is the world's second-largest continent, home to 54 countries and over 1.4 billion people.
    - ''
    - '**Let''s visit Kenya!**'
    - ''
    - '**Geography:** Kenya is located in East Africa, bordered by the Indian Ocean.'
    - '**Famous for:** Wildlife safaris, the Great Rift Valley, and being home to the Maasai people'
    - ''
    - '**Cultural Fact:**'
    - Kenya is known for its incredible biodiversity. The annual wildebeest migration through the Maasai Mara is one of the world's most spectacular natural events!
    - ''
    - '**Language Note:**'
    - While English and Swahili are official languages, Kenya has over 60 indigenous languages!
    - In Swahili, 'Jambo' means 'Hello' and 'Karibu' means 'Welcome'.
    question_type: multiple_choice
    question: What is the capital city of Kenya?
    choices:
    - id: a
      text: Mombasa
    - id: b
      text: Nairobi
    - id: c
      text: Addis Ababa
    - id: d
      text: Kampala
    answer: b
    hints:
    - attempt: 1
      text: '💡 Hint: Addis Ababa and Kampala are capitals of Kenya''s neighbours (Ethiopia & Uganda).'
    - attempt: 2
      text: '💡 Bigger hint: Mombasa is Kenya''s big port on the coast; the capital is inland.'
    transitions:
      correct:
        content_blocks:
        - ✅ Nairobi, one of East Africa's biggest cities, with a national park inside the city limits!
        metadata_add:
          quiz_score: n+1
          cultural_facts_learned: n+1
      incorrect:
        metadata_add:
          misses_africa: n+1
        content_blocks:
        - text: 'Not quite: try again!'
          show_if:
            misses_africa_lt: 3
        - text: 'Good tries! The answer: Nairobi.'
          show_if:
            misses_africa_gte: 3
