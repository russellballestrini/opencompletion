          set_language:
            content_blocks:
              - "Language updated!"
            metadata_add:
              language: "the-users-response"
            counts_as_attempt: false
            next_section_and_step: "section_1:step_7"
          off_topic:
            content_blocks:
              - "Let's stay with the problem: Solve: $x^2 - 5x + 6 = 0$"

      - step_id: "step_8"
        title: "Simplifying Expressions"
        content_blocks:
          - "**Question 8 of 8.** Simplify: $3(x + 2) - 4x$"
        question: "What is 3(x + 2) - 4x in simplest form? Show your work and give the answer."
        tokens_for_ai: "The answer is 6 - x. Accept 6 - x, -x + 6 or any equal form."
        bucket_criteria:
          correct: "Reaches 6 - x with working that supports it (any valid method)."
          partial_understanding: "Sound working but no final answer or a slip, or 6 - x with no working."
          incorrect: "A wrong final answer."
          off_topic: "Does not attempt the problem."
        required_elements:
          - "working that leads to the answer (any valid method)"
          - "states the final answer 6 - x"
        hints:
          - attempt: 1
            text: "💡 Hint: distribute first: $3(x + 2) = 3x + 6$."
            counts_as_attempt: true
          - attempt: 2
            text: "💡 Hint: now combine the $x$ terms: $3x - 4x$."
            counts_as_attempt: true
        buckets: [correct, partial_understanding, incorrect, set_language, off_topic]
        transitions:
          correct:
            metadata_add:
              score: "n+1"
              activity_completed: "true"
            content_blocks:
              - "✅ Correct! **Score: {{metadata.score}} / 8**"
            ai_feedback:
              tokens_for_ai: "In one or two sentences, praise the specific method they used."
            next_section_and_step: "section_2:step_1"
          partial_understanding:
            ai_feedback:
              tokens_for_ai: "Name what is missing (the final answer, or the working) and ask for it. Never give the answer."
          incorrect:
            ai_feedback:
              tokens_for_ai: "Point to the first mistake in their working and show the method on a different example. Never give this answer."
          set_language:
            content_blocks:
              - "Language updated!"
            metadata_add:
              language: "the-users-response"
            counts_as_attempt: false
            next_section_and_step: "section_1:step_8"
          off_topic:
            content_blocks:
              - "Let's stay with the problem: Simplify: $3(x + 2) - 4x$"

  - section_id: "section_2"
    title: "Quiz Complete"
    steps:
      - step_id: "step_1"
        title: "Completion"
        content_blocks:
          - "# Quiz Complete! 🎉"
          - text: "**Final score: {{metadata.score}} / 8**"
            show_if:
              score_exists: true
          - text: "**Final score: 0 / 8.** Every expert started here: try the quiz again and show each step."
            show_if:
              score_not_exists: true
          - "From adding whole numbers to factoring a quadratic: each step builds on the last."
