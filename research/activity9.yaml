title: "Minecraft Trivia"
description: "Eighteen quick picks about Minecraft: modes, mobs, biomes, blocks, structures, Redstone, updates & community."
kind: "game"
default_max_attempts_per_step: 3

# Every question is a pick: graded by its answer key, no model asked.
# A wrong pick stays on the question (3 tries), then the game moves on.
# metadata.score counts right picks; the first question's incorrect
# transition starts it at 0 so the final screen always has a number.
sections:
  - section_id: "section_1"
    title: "Introduction to Minecraft"
    steps:
      - step_id: "step_1"
        title: "What is Minecraft?"
        content_blocks:
          - "# Welcome to Minecraft Trivia! ⛏️"
          - "Eighteen questions. Pick a letter (or tap a button). Three tries each."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "What kind of game is Minecraft?"
        choices:
          - {id: a, text: "A sandbox game: build, explore & survive in a blocky world"}
          - {id: b, text: "A racing game with karts"}
          - {id: c, text: "A card-battling game"}
          - {id: d, text: "A puzzle game about falling blocks"}
        answer: a
        transitions:
          correct:
            content_blocks:
              - "Right! A blocky world that's yours to shape. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: think blocks you can place & break anywhere."
            metadata_add:
              score: "n+0"

      - step_id: "step_2"
        title: "Minecraft Gameplay"
        content_blocks:
          - "Minecraft has several game modes: Survival, Creative, Adventure & Spectator."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Which mode gives you unlimited blocks & lets you fly without taking damage?"
        choices:
          - {id: a, text: "Survival"}
          - {id: b, text: "Creative"}
          - {id: c, text: "Adventure"}
          - {id: d, text: "Spectator"}
        answer: b
        transitions:
          correct:
            content_blocks:
              - "Yes, Creative! Pure building. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: Spectator can fly but can't build. Which mode is for building?"

  - section_id: "section_2"
    title: "Minecraft Mobs"
    steps:
      - step_id: "step_1"
        title: "Friendly Mobs"
        content_blocks:
          - "Mobs are Minecraft's creatures. Some are friendly & give food or materials."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Pick EVERY friendly (passive) mob."
        choices:
          - {id: a, text: "Cow"}
          - {id: b, text: "Creeper"}
          - {id: c, text: "Pig"}
          - {id: d, text: "Skeleton"}
          - {id: e, text: "Chicken"}
        answer: [a, c, e]
        answer_mode: all
        transitions:
          correct:
            content_blocks:
              - "All three: cows, pigs & chickens. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not the whole set: three of these are farm animals."

      - step_id: "step_2"
        title: "Hostile Mobs"
        content_blocks:
          - "Hostile mobs attack players, mostly in the dark or at night."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Which hostile mob sneaks up silently & explodes?"
        choices:
          - {id: a, text: "Zombie"}
          - {id: b, text: "Creeper"}
          - {id: c, text: "Spider"}
          - {id: d, text: "Enderman"}
        answer: b
        transitions:
          correct:
            content_blocks:
              - "Sssss... BOOM! The Creeper. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: it's green & hisses."

  - section_id: "section_3"
    title: "Minecraft Biomes"
    steps:
      - step_id: "step_1"
        title: "Overworld Biomes"
        content_blocks:
          - "The Overworld, where you start, has many biomes, each with its own features & mobs."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Which of these is an Overworld biome?"
        choices:
          - {id: a, text: "Crimson Forest"}
          - {id: b, text: "Desert"}
          - {id: c, text: "Soul Sand Valley"}
          - {id: d, text: "End Highlands"}
        answer: b
        transitions:
          correct:
            content_blocks:
              - "Right! Sand, cacti & desert temples. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: the others belong to the Nether or the End."

      - step_id: "step_2"
        title: "Nether Biomes"
        content_blocks:
          - "The Nether is a dangerous fiery dimension with biomes of its own."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Which of these is a Nether biome?"
        choices:
          - {id: a, text: "Plains"}
          - {id: b, text: "Taiga"}
          - {id: c, text: "Warped Forest"}
          - {id: d, text: "Mushroom Fields"}
        answer: c
        transitions:
          correct:
            content_blocks:
              - "Yes! Blue-green fungus & Endermen. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: you'd find the others in the Overworld."

  - section_id: "section_4"
    title: "Minecraft Items and Blocks"
    steps:
      - step_id: "step_1"
        title: "Common Blocks"
        content_blocks:
          - "Blocks are what you build with & craft from."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Which block do you get by punching a tree?"
        choices:
          - {id: a, text: "Stone"}
          - {id: b, text: "Log (wood)"}
          - {id: c, text: "Obsidian"}
          - {id: d, text: "Bedrock"}
        answer: b
        transitions:
          correct:
            content_blocks:
              - "Right! Every first night starts with wood. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: what are trees made of?"

      - step_id: "step_2"
        title: "Crafting Items"
        content_blocks:
          - "Crafting turns materials into tools, weapons & armor."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Which item, crafted from wooden planks, is the handle of every pickaxe?"
        choices:
          - {id: a, text: "Stick"}
          - {id: b, text: "Iron ingot"}
          - {id: c, text: "String"}
          - {id: d, text: "Bone"}
        answer: a
        transitions:
          correct:
            content_blocks:
              - "Yes, the humble stick! Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: it's made of wood & it's long & thin."

  - section_id: "section_5"
    title: "Minecraft Structures"
    steps:
      - step_id: "step_1"
        title: "Villages"
        content_blocks:
          - "Villages are groups of houses, farms & paths across the Overworld."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Who lives & trades in a village?"
        choices:
          - {id: a, text: "Piglins"}
          - {id: b, text: "Villagers"}
          - {id: c, text: "Endermen"}
          - {id: d, text: "Pillagers"}
        answer: b
        transitions:
          correct:
            content_blocks:
              - "Right! Villagers trade for emeralds. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: Pillagers raid villages, they don't live there."

      - step_id: "step_2"
        title: "Strongholds"
        content_blocks:
          - "Strongholds are hidden underground mazes of stone bricks."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "What does a stronghold hold that leads to the Ender Dragon?"
        choices:
          - {id: a, text: "A Nether portal"}
          - {id: b, text: "The End Portal"}
          - {id: c, text: "A diamond mine"}
          - {id: d, text: "A beacon"}
        answer: b
        transitions:
          correct:
            content_blocks:
              - "Right! Fill its frames with Eyes of Ender. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: the Ender Dragon lives in the End."

  - section_id: "section_6"
    title: "Minecraft Achievements"
    steps:
      - step_id: "step_1"
        title: "Common Achievements"
        content_blocks:
          - "Achievements reward you for doing certain things, like 'Taking Inventory' or 'Getting Wood.'"
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Which achievement do you earn by crafting a crafting table?"
        choices:
          - {id: a, text: "Benchmarking"}
          - {id: b, text: "Taking Inventory"}
          - {id: c, text: "Getting Wood"}
          - {id: d, text: "The End"}
        answer: a
        transitions:
          correct:
            content_blocks:
              - "Yes! A workbench, a bench mark. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: a crafting table is a kind of workbench."

      - step_id: "step_2"
        title: "Rare Achievements"
        content_blocks:
          - "Rare achievements take real effort: 'The End,' 'Beaconator' & 'Adventuring Time.'"
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "What must you do to earn 'Adventuring Time'?"
        choices:
          - {id: a, text: "Defeat the Wither"}
          - {id: b, text: "Discover every biome on its list"}
          - {id: c, text: "Build a fully powered beacon"}
          - {id: d, text: "Tame a wolf"}
        answer: b
        transitions:
          correct:
            content_blocks:
              - "Right! A long trip across the whole world. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: adventuring means travelling far."

  - section_id: "section_7"
    title: "Minecraft Redstone"
    steps:
      - step_id: "step_1"
        title: "What is Redstone?"
        content_blocks:
          - "Redstone is a red dust you mine deep underground."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "What is Redstone used for?"
        choices:
          - {id: a, text: "Carrying power to build circuits & machines"}
          - {id: b, text: "Brewing potions only"}
          - {id: c, text: "Taming animals"}
          - {id: d, text: "Making armor"}
        answer: a
        transitions:
          correct:
            content_blocks:
              - "Yes! Redstone is Minecraft's wiring. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: think of it as electricity."

      - step_id: "step_2"
        title: "Basic Redstone Contraptions"
        content_blocks:
          - "A Redstone machine needs something to switch it on, like a door that opens itself."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Pick EVERY block that can switch on a Redstone circuit."
        choices:
          - {id: a, text: "Lever"}
          - {id: b, text: "Crafting table"}
          - {id: c, text: "Button"}
          - {id: d, text: "Pressure plate"}
          - {id: e, text: "Bed"}
        answer: [a, c, d]
        answer_mode: all
        transitions:
          correct:
            content_blocks:
              - "All three: lever, button & pressure plate. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not the whole set: three of these are things you flip, press or step on."

  - section_id: "section_8"
    title: "Minecraft Updates"
    steps:
      - step_id: "step_1"
        title: "Major Updates"
        content_blocks:
          - "Big updates add new biomes, mobs & blocks."
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Which update added the Crimson & Warped Forests?"
        choices:
          - {id: a, text: "Caves & Cliffs Update"}
          - {id: b, text: "Nether Update"}
          - {id: c, text: "Village & Pillage Update"}
          - {id: d, text: "Update Aquatic"}
        answer: b
        transitions:
          correct:
            content_blocks:
              - "Right! The Nether Update (1.16). Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: those forests grow in the Nether."

      - step_id: "step_2"
        title: "New Features"
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "Which mob arrived with the Caves & Cliffs Update?"
        choices:
          - {id: a, text: "Axolotl"}
          - {id: b, text: "Creeper"}
          - {id: c, text: "Pig"}
          - {id: d, text: "Enderman"}
        answer: a
        transitions:
          correct:
            content_blocks:
              - "Yes! Axolotls swim in lush caves. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: the others have been around for years. Look for the newest."

  - section_id: "section_9"
    title: "Minecraft Community"
    steps:
      - step_id: "step_1"
        title: "Minecraft Servers"
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "What is a Minecraft server?"
        choices:
          - {id: a, text: "An online world where many players play together"}
          - {id: b, text: "A villager who brings you food"}
          - {id: c, text: "A single-player save file"}
        answer: a
        transitions:
          correct:
            content_blocks:
              - "Right! Servers host mini-games & shared worlds. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
          incorrect:
            content_blocks:
              - "Not quite: servers are about playing with others."

      - step_id: "step_2"
        title: "Minecraft Mods"
        question_type: multiple_choice
        buckets: [correct, incorrect]
        question: "What are Minecraft mods?"
        choices:
          - {id: a, text: "Official game modes like Creative"}
          - {id: b, text: "Community-made changes that add new features"}
          - {id: c, text: "Moderators who ban players"}
        answer: b
        transitions:
          correct:
            content_blocks:
              - "Yes! Mods add items, mobs & whole new mechanics. Score: {{metadata.score}}"
            metadata_add:
              score: "n+1"
              activity_completed: "true"
          incorrect:
            content_blocks:
              - "Not quite: mod is short for modification."
            metadata_add:
              activity_completed: "true"

  - section_id: "section_10"
    title: "Congratulations!"
    steps:
      - step_id: "step_1"
        title: "Well Done!"
        content_blocks:
          - "# You finished Minecraft Trivia! 🏆"
          - "You scored **{{metadata.score}} out of 18**."
          - text: "A true Minecraft expert! 💎"
            show_if:
              score_gte: 15
          - text: "Nice! Play again to dig up a higher score."
            show_if:
              score_lt: 15
          - "Keep building, exploring & discovering."
