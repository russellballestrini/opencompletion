{% extends "base.html" %}

{% block title %}Chatroom{% endblock %}

{% block content %}

    <div id="chat-container">
        <!-- Top bar: search, plus drawer toggles on phones -->
        <div class="chat-topbar">
            <button type="button" class="icon-btn drawer-toggle" onclick="openDrawer('rooms')" aria-label="Rooms & site menu">☰</button>
            <form id="search-form" action="/search" method="get" role="search">
                <label class="visually-hidden" for="search-keywords">Search messages</label>
                <input type="search" id="search-keywords" name="keywords" placeholder="Search messages" value="{{ keywords|default('') }}">
            </form>
            <button type="button" class="icon-btn drawer-toggle" onclick="openDrawer('controls')" aria-label="Room controls">⚙</button>
        </div>

        <!-- Chat area where messages will be displayed -->
        <div id="chat"></div>

        <!-- Form for sending messages -->
        <form id="message-form">
            <label class="visually-hidden" for="message">Message</label>
            <textarea id="message" placeholder="Type your message..."></textarea>
            <button type="button" id="send-button" class="btn" onclick="sendMessage()">Send</button>
        </form>
    </div>

    <aside class="utility-belt" aria-label="Room controls">
        <button type="button" class="icon-btn drawer-close" onclick="closeDrawer()" aria-label="Close controls">×</button>
        {% if current_room %}
        <section class="room-actions-section">
            <h3>Room</h3>
            <div class="button-row">
                <button type="button" class="btn btn-secondary" onclick="forkRoom({{ current_room.id }}, {{ 'true' if user else 'false' }})">Fork</button>
                {% if user and current_room.owner_id == user.id %}
                <button type="button" class="btn btn-secondary" onclick="archiveRoom({{ current_room.id }})">Archive</button>
                <button type="button" class="btn btn-danger" onclick="deleteRoom({{ current_room.id }})">Delete</button>
                {% endif %}
            </div>
        </section>
        {% endif %}

        <p class="download-links">
            Download history:
            <a href="/download_chat_history?room_name={{ room_name|urlencode }}" download="{{ room_name }}.json">JSON</a> ·
            <a href="/download_chat_history_md?room_name={{ room_name|urlencode }}" download="{{ room_name }}.md">Markdown</a>
        </p>

        <div>
            <label for="model-select">Model</label>
            <select id="model-select">
                <option value="None">None</option>
            </select>
        </div>
        <div>
            <label for="voice-select">Voice</label>
            <select id="voice-select">
                <!-- Voices will be populated from API -->
            </select>
        </div>
        <div class="button-stack">
            <button type="button" id="auto-play-tts-btn" class="btn btn-secondary btn-block btn-toggle" aria-pressed="false" onclick="toggleAutoPlayTTS()">Read replies aloud</button>
            <button type="button" id="show-thinking-btn" class="btn btn-secondary btn-block btn-toggle" aria-pressed="true" onclick="toggleShowThinking()">Show model thinking</button>
        </div>

       <div id="activity-controls">
           <h3>Activities</h3>
           <div id="current-activity-info" hidden>
               <p>Running: <span id="current-activity-name"></span></p>
               <button type="button" id="cancel-activity-btn" class="btn btn-danger btn-block" onclick="cancelActivity()">Cancel activity</button>
           </div>
           <div id="activity-list-section">
               <label for="activity-select">Activity</label>
               <div class="select-row">
                   <select id="activity-select">
                       <option value="">Choose an activity</option>
                   </select>
                   <button type="button" id="refresh-activities-btn" class="icon-btn" onclick="refreshActivityList()" aria-label="Refresh activity list">↻</button>
               </div>
               <button type="button" id="load-activity-btn" class="btn btn-block" onclick="loadSelectedActivity()">Start activity</button>
           </div>
       </div>

       <div id="user-lists">
           <div id="active-users-list">
               <h3>Active Users</h3>
               <ul id="active-users">
                   <!-- Active users will be dynamically populated here -->
               </ul>
           </div>
           <div id="inactive-users-list">
               <h3>Inactive Users</h3>
               <ul id="inactive-users">
                   <!-- Inactive users will be dynamically populated here -->
               </ul>
           </div>
       </div>

    </aside>

<script>
    // Everything our chat scripts need from the server, in one place.
    window.CHAT_CONFIG = {
        roomName: {{ room_name|tojson }},
        username: {{ username|tojson if username else 'null' }},
        signedIn: {{ 'true' if user else 'false' }}
    };
</script>
<script src="{{ url_for('static', filename='js/chat/1-state.js') }}"></script>
<script src="{{ url_for('static', filename='js/chat/2-vision.js') }}"></script>
<script src="{{ url_for('static', filename='js/chat/3-room.js') }}"></script>
<script src="{{ url_for('static', filename='js/chat/4-tts.js') }}"></script>
<script src="{{ url_for('static', filename='js/chat/5-messages.js') }}"></script>
<script src="{{ url_for('static', filename='js/chat/6-code.js') }}"></script>
<script src="{{ url_for('static', filename='js/chat/7-activities.js') }}"></script>
{% endblock %}
