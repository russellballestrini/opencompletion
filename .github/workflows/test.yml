name: Run Tests

on:
  push:
    branches: [ main, master, develop, claude/** ]
  pull_request:
    branches: [ main, master, develop ]

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every step calls a Makefile target, so `make ci` locally is this workflow.
# No test needs the network: conftest.py mocks tiktoken, pins our
# classifier off & points MODEL_1 at a placeholder; model calls are patched.
# Page layout tests drive the runner's preinstalled Google Chrome.
env:
  SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
  TESTING: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: requirements*.txt

    - name: Install
      run: make venv

    - name: Lint (black, flake8)
      run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is our Dockerfile's Python, 3.13 our newest supported.
        python-version: [ '3.11', '3.13' ]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: requirements*.txt

    - name: Install
      run: make venv

    - name: Unit tests
      run: make test-unit

    - name: Integration tests
      run: make test-integration

    - name: Functional tests
      run: make test-functional

    - name: Validate activity YAML
      run: make validate-yaml

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: requirements*.txt

    - name: Install
      run: make venv

    - name: Coverage floor
      run: make coverage-check

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build image
      run: docker build -t opencompletion .

    - name: Start & serve pages
      run: |
        docker run -d --name oc -p 5001:5001 \
          -e MODEL_ENDPOINT_1=http://127.0.0.1:9/v1 -e MODEL_API_KEY_1=none \
          opencompletion
        for i in $(seq 1 30); do
          curl -fsS -o /dev/null http://127.0.0.1:5001/ && break
          sleep 2
        done
        for path in / /browse /styleguide /auth /chat/lobby; do
          curl -fsS -o /dev/null -w "$path %{http_code}\n" "http://127.0.0.1:5001$path"
        done

    - name: Container log
      if: always()
      run: docker logs oc
