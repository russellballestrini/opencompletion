name: Run Tests

on:
  push:
    branches: [ main, master, develop, claude/** ]
  pull_request:
    branches: [ main, master, develop ]

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every step calls a Makefile target: `make ci` locally runs these same
# checks one after another (lint, unit, integration, functional, YAML) &
# `make coverage-check` our floor. Here each stage is its own job, so they
# run side by side & a run takes as long as its slowest job, not their sum.
# No test needs the network: conftest.py mocks tiktoken, pins our
# classifier off & points MODEL_1 at a placeholder; model calls are patched.
# Page layout tests drive the runner's preinstalled Google Chrome.
env:
  SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
  TESTING: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    # A job takes ~3 minutes; a hang once ran 6 hours (2026-11-09).
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: requirements*.lock

    - name: Install
      run: make venv

    - name: Lint (black, flake8)
      run: make lint

  unit:
    runs-on: ubuntu-latest
    # A job takes ~3 minutes; a hang once ran 6 hours (2026-11-09).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Feature branches & pull requests: every test, one Python (3.12,
        # what our dev venv runs). main: the whole matrix, every CPython
        # still receiving fixes (none is an LTS: each gets ~5 years,
        # https://devguide.python.org/versions/). Add 3.16 when it ships
        # (Oct 2027); drop 3.11 at its end of life (Oct 2027).
        # 3.13.12+, 3.14.3+ & 3.15 need gevent_asyncio.py, or Unit tests
        # hang in our crawler's suites.
        python-version: ${{ fromJSON(github.ref == 'refs/heads/main' && '["3.11","3.12","3.13","3.14","3.15"]' || '["3.12"]') }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: requirements*.lock

    - name: Install
      run: make venv

    - name: Unit tests
      run: make test-unit

  integration:
    runs-on: ubuntu-latest
    # A job takes ~3 minutes; a hang once ran 6 hours (2026-11-09).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Feature branches & pull requests: every test, one Python (3.12,
        # what our dev venv runs). main: the whole matrix (see `unit`).
        python-version: ${{ fromJSON(github.ref == 'refs/heads/main' && '["3.11","3.12","3.13","3.14","3.15"]' || '["3.12"]') }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: requirements*.lock

    - name: Install
      run: make venv

    - name: Integration tests
      run: make test-integration

    - name: Validate activity YAML
      run: make validate-yaml

  # Our slowest stage (headless Chrome), so its files run as two halves side
  # by side: a-m & n-z, split by a shell glob in our Makefile so every file
  # is in exactly one. Rebalance there if one half grows much slower.
  functional:
    runs-on: ubuntu-latest
    # A job takes ~3 minutes; a hang once ran 6 hours (2026-11-09).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Feature branches & pull requests: every test, one Python (3.12,
        # what our dev venv runs). main: the whole matrix (see `unit`).
        python-version: ${{ fromJSON(github.ref == 'refs/heads/main' && '["3.11","3.12","3.13","3.14","3.15"]' || '["3.12"]') }}
        half: [ 'a-m', 'n-z' ]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: requirements*.lock

    - name: Install
      run: make venv

    # A cold first launch of the runner's Chrome can take tens of seconds;
    # pay it here, not inside a browser test (tests/functional/browser.py).
    - name: Warm up Chrome
      run: |
        google-chrome --version
        timeout 90 google-chrome --headless --no-sandbox --disable-gpu \
          --no-first-run --disable-dev-shm-usage --dump-dom about:blank > /dev/null || true

    - name: Functional tests
      run: make test-functional-${{ matrix.half }}

  # Our coverage floor needs the whole suite measured. Each part measures
  # its share side by side & hands its data to `coverage`, which adds them
  # up: same tests, same .coveragerc, same 82% as `make coverage-check`.
  coverage-part:
    runs-on: ubuntu-latest
    # A job takes ~3 minutes; a hang once ran 6 hours (2026-11-09).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [ 'unit', 'integration', 'functional-a-m', 'functional-n-z' ]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: requirements*.lock

    - name: Install
      run: make venv

    # Same warm-up as the functional jobs: these parts run our browser tests.
    - name: Warm up Chrome
      if: startsWith(matrix.part, 'functional')
      run: |
        google-chrome --version
        timeout 90 google-chrome --headless --no-sandbox --disable-gpu \
          --no-first-run --disable-dev-shm-usage --dump-dom about:blank > /dev/null || true

    - name: Measure
      run: make coverage-${{ matrix.part }}

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: coverage-part-${{ matrix.part }}
        path: reports/coverage-parts/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1

  coverage:
    needs: coverage-part
    runs-on: ubuntu-latest
    # A job takes ~3 minutes; a hang once ran 6 hours (2026-11-09).
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: requirements*.lock

    - name: Install
      run: make venv

    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: coverage-part-*
        path: reports/coverage-parts
        merge-multiple: true

    - name: Coverage floor
      run: make coverage-combine

  docker:
    runs-on: ubuntu-latest
    # A job takes ~3 minutes; a hang once ran 6 hours (2026-11-09).
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Build image
      run: docker build -t opencompletion .

    - name: Start & serve pages
      run: |
        docker run -d --name oc -p 5001:5001 \
          -e MODEL_ENDPOINT_1=http://127.0.0.1:9/v1 -e MODEL_API_KEY_1=none \
          opencompletion
        for i in $(seq 1 30); do
          curl -fsS -o /dev/null http://127.0.0.1:5001/ && break
          sleep 2
        done
        for path in / /browse /styleguide /auth /chat/lobby; do
          curl -fsS -o /dev/null -w "$path %{http_code}\n" "http://127.0.0.1:5001$path"
        done

    - name: Container log
      if: always()
      run: docker logs oc

  # One status for the whole run: green only when every job above is
  # (a cancelled or skipped one is not).
  all-green:
    if: always()
    needs: [ lint, unit, integration, functional, coverage-part, coverage, docker ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Every job passed
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "$RESULTS"
        for result in $RESULTS; do test "$result" = success || exit 1; done
